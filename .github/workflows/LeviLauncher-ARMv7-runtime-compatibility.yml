name: LeviLauncher ARMv7 runtime compatibility gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the workflow repository
        uses: actions/checkout@v4

      - name: Check out pinned LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: cc5c7bc6eac48f1e82adf705b8b5f63ba0883247
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK, exact project NDK, and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Verify upstream runtime architecture and apply ARMv7 compile fixes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Step 1: require the upstream package-context and split-APK runtime path.
          manager = Path('app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt')
          runtime = Path('app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftRuntimePreparer.kt')
          manager_text = manager.read_text(encoding='utf-8')
          runtime_text = runtime.read_text(encoding='utf-8')
          required_manager_tokens = [
              'createPackageContext(',
              'Context.CONTEXT_INCLUDE_CODE',
              'splitPublicSourceDirs',
              'splitSourceDirs',
              'System.load(libFile.absolutePath)',
          ]
          missing = [token for token in required_manager_tokens if token not in manager_text]
          if missing:
              raise SystemExit('Upstream runtime architecture changed; missing: ' + ', '.join(missing))
          if 'MC_SPLIT_SRC' not in runtime_text:
              raise SystemExit('Upstream split-APK handoff is missing; refusing an incomplete build.')

          # Step 2: ensure the original installed package remains the runtime source.
          if 'MinecraftLauncher.MC_PACKAGE_NAME' not in manager_text:
              raise SystemExit('Minecraft package identity was changed; refusing to continue.')

          # Step 3a: the upstream preloader explicitly supports ARMv7 and supplies
          # the matching prebuilt hook archive in its recursive submodule.
          preloader_cmake = Path('app/src/main/cpp/preloader/CMakeLists.txt')
          if not preloader_cmake.is_file():
              raise SystemExit('Preloader submodule was not checked out.')
          preloader_text = preloader_cmake.read_text(encoding='utf-8')
          armv7_branch = 'CMAKE_ANDROID_ARCH_ABI STREQUAL "armeabi-v7a"'
          hook_archive = Path('app/src/main/cpp/preloader/lib/ARM/libGlossHook.a')
          if armv7_branch not in preloader_text or not hook_archive.is_file():
              raise SystemExit('ARMv7 preloader support/archive is missing.')

          # Step 3b: retarget the app from arm64-v8a to armeabi-v7a.
          gradle_file = Path('app/build.gradle')
          gradle_text = gradle_file.read_text(encoding='utf-8')
          old_abi = "abiFilters 'arm64-v8a'"
          if gradle_text.count(old_abi) != 1:
              raise SystemExit(f'Expected one {old_abi!r}; found {gradle_text.count(old_abi)}.')
          gradle_text = gradle_text.replace(old_abi, "abiFilters 'armeabi-v7a'")
          gradle_text = gradle_text.replace('mappingFileUploadEnabled true', 'mappingFileUploadEnabled false')
          gradle_text = gradle_text.replace('nativeSymbolUploadEnabled true', 'nativeSymbolUploadEnabled false')
          gradle_file.write_text(gradle_text, encoding='utf-8')

          # ARMv7 cannot compile the desktop-only LevelDB CLI target.
          cmake_file = Path('app/src/main/cpp/worldtools/vendor/leveldb/CMakeLists.txt')
          cmake_text = cmake_file.read_text(encoding='utf-8')
          old_block = '''add_executable(leveldbutil
            "db/leveldbutil.cc"
          )
          target_link_libraries(leveldbutil leveldb)'''
          # Account for upstream's unindented source formatting.
          old_block = old_block.replace('          ', '')
          new_block = '''# leveldbutil is a desktop CLI and is not part of the Android app.
          if(NOT ANDROID)
            add_executable(leveldbutil
              "db/leveldbutil.cc"
            )
            target_link_libraries(leveldbutil leveldb)
          endif()'''.replace('          ', '')
          if old_block in cmake_text:
              cmake_text = cmake_text.replace(old_block, new_block, 1)
              cmake_file.write_text(cmake_text, encoding='utf-8')
          elif 'if(NOT ANDROID)' not in cmake_text or 'add_executable(leveldbutil' not in cmake_text:
              raise SystemExit('LevelDB CLI target changed; refusing a guessed CMake patch.')

          # Use width-correct FNV-1a constants on 32-bit ARM.
          hash_file = Path('app/src/main/cpp/worldtools/vendor/nbt/src/nbt/detail/StringUtils.hpp')
          hash_text = hash_file.read_text(encoding='utf-8')
          old_hash = '''[[nodiscard]] constexpr size_t doHash(std::string_view x) {
              size_t           hash  = 0xcbf29ce484222325;
              constexpr size_t prime = 0x100000001b3;
              for (char c : x) {
                  hash ^= static_cast<size_t>(c);
                  hash *= prime;
              }
              return hash;
          }'''.replace('              ', '')
          new_hash = '''[[nodiscard]] constexpr size_t doHash(std::string_view x) {
              if constexpr (sizeof(size_t) <= sizeof(uint32_t)) {
                  uint32_t hash = 0x811c9dc5u;
                  constexpr uint32_t prime = 0x01000193u;
                  for (char c : x) {
                      hash ^= static_cast<uint32_t>(static_cast<unsigned char>(c));
                      hash *= prime;
                  }
                  return static_cast<size_t>(hash);
              } else {
                  uint64_t hash = 0xcbf29ce484222325ULL;
                  constexpr uint64_t prime = 0x100000001b3ULL;
                  for (char c : x) {
                      hash ^= static_cast<uint64_t>(static_cast<unsigned char>(c));
                      hash *= prime;
                  }
                  return static_cast<size_t>(hash);
              }
          }'''.replace('              ', '')
          if old_hash in hash_text:
              hash_text = hash_text.replace(old_hash, new_hash, 1)
              if '#include <cstdint>' not in hash_text:
                  hash_text = hash_text.replace('#include <string>', '#include <cstdint>\n#include <string>', 1)
              hash_file.write_text(hash_text, encoding='utf-8')
          elif 'sizeof(size_t) <= sizeof(uint32_t)' not in hash_text:
              raise SystemExit('NBT doHash changed; refusing a guessed ARMv7 hash patch.')

          # PairIP is not injected into the launcher. No PairIP binary or custom
          # VMRunner/bootstrap patch is added by this workflow.
          forbidden = ('initializeOfficialPairIp', 'com.pairip.VMRunner')
          source_text = '\n'.join(p.read_text(encoding='utf-8', errors='ignore')
                                   for p in Path('app/src/main').rglob('*') if p.is_file()
                                   and p.suffix in ('.java', '.kt', '.xml', '.gradle'))
          present = [token for token in forbidden if token in source_text]
          if present:
              raise SystemExit('Unexpected custom PairIP loader code found: ' + ', '.join(present))

          print('Runtime package-context checks passed.')
          print('ARMv7 preloader support and GlossHook archive verified.')
          print('Android ABI set to armeabi-v7a.')
          print('No custom PairIP loader has been injected.')
          PY

          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "org.levimc.launcher"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          chmod +x ./gradlew

      - name: Build ARMv7 debug APK
        id: build
        working-directory: source
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/levilauncher-armv7-gradle.log"
          ./gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Verify runtime dependencies before allowing APK distribution
        if: success()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          REPORT="$RUNNER_TEMP/armv7-runtime-preflight.txt"
          : > "$REPORT"
          echo 'LeviLauncher ARMv7 runtime dependency verification' | tee -a "$REPORT"
          echo 'Source: LiteLDev/LeviLaunchroid @ cc5c7bc6eac48f1e82adf705b8b5f63ba0883247' | tee -a "$REPORT"
          echo | tee -a "$REPORT"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "native-code: 'armeabi-v7a'" "$RUNNER_TEMP/badging.txt"
          echo 'PASS: APK declares armeabi-v7a.' | tee -a "$REPORT"

          unzip -Z1 "$APK" | grep '^lib/armeabi-v7a/' | sort > "$RUNNER_TEMP/armv7-libs.txt"
          cat "$RUNNER_TEMP/armv7-libs.txt" >> "$REPORT"
          grep -q '^lib/armeabi-v7a/libpreloader.so$' "$RUNNER_TEMP/armv7-libs.txt"
          echo 'PASS: ARMv7 preloader is packaged.' | tee -a "$REPORT"

          # The current upstream tree only contains ARM64 prebuilts for these
          # runtime services. The build is deliberately blocked rather than
          # publishing an APK that fails during extraction/bootstrap.
          missing=()
          for lib in libgxcore.so libPlayFabMultiplayer.so libmaesdk.so; do
            if ! grep -q "^lib/armeabi-v7a/${lib}$" "$RUNNER_TEMP/armv7-libs.txt"; then
              missing+=("$lib")
            fi
          done
          if ((${#missing[@]})); then
            {
              echo
              echo 'BLOCKED: ARMv7 runtime dependencies missing from the APK:'
              for lib in "${missing[@]}"; do echo " - $lib"; done
              echo
              echo 'These are present in the supplied official launcher only as ARM64 prebuilts.'
              echo 'The upstream source does not contain ARMv7 builds or corresponding source for them.'
              echo 'libgxcore is required by NativeImageGuard/NativeBridgeHelper; modern Minecraft'
              echo 'runtime initialization also uses PlayFab and Maesdk on the current code path.'
              echo 'No installable APK will be published until authentic ARMv7 implementations'
              echo 'or supported source builds for these components are available.'
            } | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if grep -q 'lib/armeabi-v7a/libpairipcore.so' "$RUNNER_TEMP/armv7-libs.txt"; then
            echo 'BLOCKED: unexpected PairIP binary bundled into the launcher APK.' | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo 'PASS: runtime dependency gate passed; preparing APK artifact.' | tee -a "$REPORT"
          cp "$APK" "$RUNNER_TEMP/LeviLauncher-ARMv7-runtime-compat-debug.apk"

      - name: Upload APK only when all runtime checks pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-runtime-compat-debug-APK
          path: ${{ runner.temp }}/LeviLauncher-ARMv7-runtime-compat-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build and preflight diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-runtime-compat-diagnostics
          path: |
            ${{ runner.temp }}/levilauncher-armv7-gradle.log
            ${{ runner.temp }}/armv7-runtime-preflight.txt
            ${{ runner.temp }}/badging.txt
            ${{ runner.temp }}/armv7-libs.txt
          if-no-files-found: ignore
          retention-days: 7
