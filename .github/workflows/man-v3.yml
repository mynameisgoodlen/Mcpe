name: Single-File ARMv7 Native Bootstrap Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-29 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/com/mclauncher/armv7

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MC-ARMv7-Bootstrap"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mclauncher.armv7'
              compileSdk 29

              defaultConfig {
                  applicationId "com.mclauncher.armv7"
                  minSdk 26
                  targetSdk 29
                  versionCode 3
                  versionName "3.0-armv7"

                  ndk {
                      abiFilters "armeabi-v7a"
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -Wall -Wextra"
                          arguments "-DANDROID_ABI=armeabi-v7a",
                                    "-DANDROID_PLATFORM=android-29",
                                    "-DANDROID_STL=c++_static"
                      }
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                      jniDebuggable true
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mclauncher.armv7">

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:label="MC ARMv7 Bootstrap"
                  android:largeHeap="true">

                  <activity
                      android:name=".BootstrapActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("mc_bootstrap" LANGUAGES CXX)

          if(NOT ANDROID_ABI STREQUAL "armeabi-v7a")
              message(FATAL_ERROR "Strictly armeabi-v7a only. Current ABI: ${ANDROID_ABI}")
          endif()

          add_library(mc_bootstrap SHARED mc_bootstrap.cpp)

          find_library(log-lib log)
          find_library(android-lib android)
          find_library(dl-lib dl)
          find_library(egl-lib EGL)
          find_library(glesv2-lib GLESv2)

          target_link_libraries(mc_bootstrap
              ${log-lib}
              ${android-lib}
              ${dl-lib}
              ${egl-lib}
              ${glesv2-lib}
          )
          EOF

          cat << 'EOF' > app/src/main/cpp/mc_bootstrap.cpp
          #include <jni.h>
          #include <dlfcn.h>
          #include <android/log.h>
          #include <string>
          #include <vector>
          #include <sstream>
          #include <elf.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/stat.h>
          #include <sys/mman.h>
          #include <cstring>

          #define LOG_TAG "MC_ARMv7_Bootstrap"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          namespace {

          void AppendLog(std::ostringstream& oss, const std::string& msg) {
              LOGI("%s", msg.c_str());
              oss << msg << "\n";
          }

          void AppendErr(std::ostringstream& oss, const std::string& msg) {
              LOGE("%s", msg.c_str());
              oss << "[BLOCKER] " << msg << "\n";
          }

          struct ElfInspection {
              bool validArmv7 = false;
              bool hasDtInit = false;
              uint32_t dtInitAddr = 0;
              bool requiresPairip = false;
              bool importsExecuteProgram = false;
              std::vector<std::string> neededLibs;
          };

          ElfInspection InspectElfBinary(const std::string& path) {
              ElfInspection info;
              int fd = open(path.c_str(), O_RDONLY);
              if (fd < 0) return info;

              struct stat st{};
              if (fstat(fd, &st) != 0 || st.st_size < (off_t)sizeof(Elf32_Ehdr)) {
                  close(fd);
                  return info;
              }

              void* map = mmap(nullptr, st.st_size, PROT_READ, MAP_PRIVATE, fd, 0);
              close(fd);
              if (map == MAP_FAILED) return info;

              const auto* ehdr = static_cast<const Elf32_Ehdr*>(map);
              if (ehdr->e_ident[EI_MAG0] == ELFMAG0 &&
                  ehdr->e_ident[EI_MAG1] == ELFMAG1 &&
                  ehdr->e_ident[EI_MAG2] == ELFMAG2 &&
                  ehdr->e_ident[EI_MAG3] == ELFMAG3 &&
                  ehdr->e_ident[EI_CLASS] == ELFCLASS32 &&
                  ehdr->e_machine == EM_ARM) {
                  info.validArmv7 = true;

                  // Scan dynamic section and string table via section headers if within bounds
                  if (ehdr->e_shoff > 0 && ehdr->e_shoff + ehdr->e_shnum * sizeof(Elf32_Shdr) <= (size_t)st.st_size) {
                      const auto* shdrs = reinterpret_cast<const Elf32_Shdr*>(static_cast<const uint8_t*>(map) + ehdr->e_shoff);
                      const Elf32_Shdr* dynSec = nullptr;
                      const Elf32_Shdr* dynsymSec = nullptr;
                      const Elf32_Shdr* dynstrSec = nullptr;

                      for (int i = 0; i < ehdr->e_shnum; ++i) {
                          if (shdrs[i].sh_type == SHT_DYNAMIC) dynSec = &shdrs[i];
                          if (shdrs[i].sh_type == SHT_DYNSYM) dynsymSec = &shdrs[i];
                      }
                      if (dynSec && dynSec->sh_link < ehdr->e_shnum) {
                          dynstrSec = &shdrs[dynSec->sh_link];
                      }

                      if (dynSec && dynstrSec &&
                          dynSec->sh_offset + dynSec->sh_size <= (size_t)st.st_size &&
                          dynstrSec->sh_offset + dynstrSec->sh_size <= (size_t)st.st_size) {
                          const char* strtab = reinterpret_cast<const char*>(static_cast<const uint8_t*>(map) + dynstrSec->sh_offset);
                          size_t strSize = dynstrSec->sh_size;
                          const auto* dyns = reinterpret_cast<const Elf32_Dyn*>(static_cast<const uint8_t*>(map) + dynSec->sh_offset);
                          size_t count = dynSec->sh_size / sizeof(Elf32_Dyn);

                          for (size_t i = 0; i < count; ++i) {
                              if (dyns[i].d_tag == DT_NEEDED && dyns[i].d_un.d_val < strSize) {
                                  std::string needed(strtab + dyns[i].d_un.d_val);
                                  info.neededLibs.push_back(needed);
                                  if (needed == "libpairipcore.so") {
                                      info.requiresPairip = true;
                                  }
                              } else if (dyns[i].d_tag == DT_INIT) {
                                  info.hasDtInit = true;
                                  info.dtInitAddr = dyns[i].d_un.d_ptr;
                              }
                          }

                          if (dynsymSec && dynsymSec->sh_offset + dynsymSec->sh_size <= (size_t)st.st_size) {
                              const auto* syms = reinterpret_cast<const Elf32_Sym*>(static_cast<const uint8_t*>(map) + dynsymSec->sh_offset);
                              size_t symCount = dynsymSec->sh_size / sizeof(Elf32_Sym);
                              for (size_t i = 0; i < symCount; ++i) {
                                  if (syms[i].st_shndx == SHN_UNDEF && syms[i].st_name < strSize) {
                                      if (std::strcmp(strtab + syms[i].st_name, "ExecuteProgram") == 0) {
                                          info.importsExecuteProgram = true;
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              munmap(map, st.st_size);
              return info;
          }

          } // namespace

          JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* /*vm*/, void* /*reserved*/) {
              LOGI("libmc_bootstrap.so (c++_static) initialized on 32-bit ARMv7");
              return JNI_VERSION_1_6;
          }

          extern "C"
          JNIEXPORT jstring JNICALL
          Java_com_mclauncher_armv7_BootstrapActivity_nativeVerifyAndCheckBlocker(
                  JNIEnv* env,
                  jclass /*clazz*/,
                  jstring jNativeLibDir) {

              std::ostringstream report;
              const char* cLibDir = env->GetStringUTFChars(jNativeLibDir, nullptr);
              std::string libDir(cLibDir ? cLibDir : "");
              env->ReleaseStringUTFChars(jNativeLibDir, cLibDir);

              AppendLog(report, "=== C++ Runtime & ELF Linker Verification ===");

              // 1. Verify Minecraft's libc++_shared.so is loaded without STL collision
              std::string cppPath = libDir + "/libc++_shared.so";
              void* cppHandle = dlopen(cppPath.c_str(), RTLD_NOLOAD | RTLD_NOW);
              if (!cppHandle) {
                  cppHandle = dlopen(cppPath.c_str(), RTLD_NOW | RTLD_GLOBAL);
              }
              if (cppHandle) {
                  void* sstreamSym = dlsym(cppHandle, "_ZTVNSt6__ndk118basic_stringstreamIcNS_11char_traitsIcEENS_9allocatorIcEEEE");
                  AppendLog(report, std::string("[STL OK] Minecraft libc++_shared.so basic_stringstream vtable = ") +
                            (sstreamSym ? "RESOLVED (STL collision fixed!)" : "MISSING"));
              }

              // 2. Inspect the remaining engine libraries for PairIP DT_INIT / ExecuteProgram traps
              const char* targets[] = {"libmaesdk.so", "libPlayFabMultiplayer.so", "libminecraftpe.so"};
              for (const char* t : targets) {
                  std::string fullPath = libDir + "/" + t;
                  ElfInspection info = InspectElfBinary(fullPath);
                  AppendLog(report, std::string("\n--- Inspecting ") + t + " ---");
                  AppendLog(report, std::string("32-bit EM_ARM Valid: ") + (info.validArmv7 ? "YES" : "NO"));
                  if (info.hasDtInit) {
                      std::ostringstream hexAddr;
                      hexAddr << "0x" << std::hex << info.dtInitAddr;
                      AppendLog(report, "DT_INIT Constructor Address: " + hexAddr.str());
                  }
                  if (info.requiresPairip || info.importsExecuteProgram) {
                      AppendErr(report, std::string(t) + " has DT_NEEDED=[libpairipcore.so] and an undefined symbol import for ExecuteProgram().");
                      AppendErr(report, "Calling dlopen() on " + std::string(t) + " triggers DT_INIT -> libpairipcore.so::ExecuteProgram(), which verifies the com.mojang.minecraftpe package signature and aborts (SIGABRT) any third-party host process.");
                  }
              }

              return env->NewStringUTF(report.str().c_str());
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mclauncher/armv7/BootstrapActivity.java
          package com.mclauncher.armv7;

          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.res.AssetManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          import dalvik.system.DexClassLoader;

          public class BootstrapActivity extends Activity {

              public static final String MC_PACKAGE = "com.mojang.minecraftpe";

              static {
                  System.loadLibrary("mc_bootstrap");
              }

              public static native String nativeVerifyAndCheckBlocker(String nativeLibDir);

              private TextView logView;
              private PackageInspectionResult runtimeInfo;

              public static class PackageInspectionResult {
                  public boolean installed;
                  public String baseApkPath;
                  public final List<String> splitApkPaths = new ArrayList<>();
                  public String armv7SplitPath;
                  public String stagedLibDir;
                  public DexClassLoader bridgedClassLoader;
                  public Context mcPackageContext;
                  public String diagnosticLog;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#121212"));
                  int pad = (int) (10 * getResources().getDisplayMetrics().density);
                  root.setPadding(pad, pad, pad, pad);

                  LinearLayout buttonRow = new LinearLayout(this);
                  buttonRow.setOrientation(LinearLayout.HORIZONTAL);
                  buttonRow.setGravity(Gravity.CENTER_VERTICAL);

                  Button btnSafeVerify = new Button(this);
                  btnSafeVerify.setText("1. Bootstrap & Verify (Safe)");

                  Button btnForceCrashTest = new Button(this);
                  btnForceCrashTest.setText("2. Force dlopen PairIP (Triggers Abort)");

                  Button btnDumpCrash = new Button(this);
                  btnDumpCrash.setText("3. View Last Crash Log");

                  buttonRow.addView(btnSafeVerify, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  buttonRow.addView(btnForceCrashTest, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  buttonRow.addView(btnDumpCrash, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  ScrollView scroll = new ScrollView(this);
                  logView = new TextView(this);
                  logView.setTextColor(Color.parseColor("#00E676"));
                  logView.setTypeface(Typeface.MONOSPACE);
                  logView.setTextSize(11f);
                  scroll.addView(logView);

                  root.addView(buttonRow, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  appendLog("Preparing installed com.mojang.minecraftpe split APKs (async)...");
                  new Thread(() -> {
                      PackageInspectionResult info = prepareInstalledRuntime(getApplicationContext());
                      runOnUiThread(() -> {
                          runtimeInfo = info;
                          logView.setText(info.diagnosticLog);
                      });
                  }).start();

                  btnSafeVerify.setOnClickListener(v -> runSafeBootstrap());
                  btnForceCrashTest.setOnClickListener(v -> runForcePairipLoad());
                  btnDumpCrash.setOnClickListener(v -> dumpRecentLogcat());
              }

              private void runSafeBootstrap() {
                  if (runtimeInfo == null || !runtimeInfo.installed || runtimeInfo.stagedLibDir == null) {
                      appendLog("\n[ABORT] Runtime is not ready.");
                      return;
                  }
                  appendLog("\n=== Running Safe ARMv7 Bootstrap & ELF Blocker Audit ===");
                  new Thread(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          String[] baseLibs = {
                              "c++_shared",
                              "fmod",
                              "HttpClient.Android",
                              "MediaDecoders_Android",
                              "conscrypt_jni"
                          };

                          for (String lib : baseLibs) {
                              loadIntoBridgedNamespace(runtimeInfo.bridgedClassLoader, lib, sb);
                          }

                          try {
                              Class<?> fmodClass = runtimeInfo.bridgedClassLoader.loadClass("org.fmod.FMOD");
                              Method fmodInit = fmodClass.getDeclaredMethod("init", Context.class);
                              fmodInit.setAccessible(true);
                              fmodInit.invoke(null, runtimeInfo.mcPackageContext != null ? runtimeInfo.mcPackageContext : getApplicationContext());
                              sb.append("[FMOD OK] org.fmod.FMOD.init(Context) succeeded.\n");
                          } catch (Throwable fmodErr) {
                              sb.append("[WARN] FMOD.init note: ").append(fmodErr.toString()).append("\n");
                          }

                          String jniReport = nativeVerifyAndCheckBlocker(runtimeInfo.stagedLibDir);
                          sb.append("\n").append(jniReport);

                      } catch (Throwable t) {
                          sb.append("\n[EXCEPTION] ").append(t.toString()).append("\n");
                      }
                      final String out = sb.toString();
                      runOnUiThread(() -> appendLog(out));
                  }).start();
              }

              private void runForcePairipLoad() {
                  if (runtimeInfo == null || !runtimeInfo.installed || runtimeInfo.stagedLibDir == null) {
                      appendLog("\n[ABORT] Runtime is not ready.");
                      return;
                  }
                  appendLog("\n[WARNING] Forcing dlopen on PairIP-protected libraries (libpairipcore -> libmaesdk -> libminecraftpe)...");
                  new Thread(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          String[] allLibs = {
                              "c++_shared",
                              "fmod",
                              "HttpClient.Android",
                              "MediaDecoders_Android",
                              "conscrypt_jni",
                              "pairipcore",
                              "maesdk",
                              "PlayFabMultiplayer",
                              "minecraftpe"
                          };
                          for (String lib : allLibs) {
                              loadIntoBridgedNamespace(runtimeInfo.bridgedClassLoader, lib, sb);
                          }
                      } catch (Throwable t) {
                          sb.append("\n[FATAL EXCEPTION] ").append(t.toString()).append("\n");
                          if (t.getCause() != null) {
                              sb.append("Cause: ").append(t.getCause().toString()).append("\n");
                          }
                      }
                      final String out = sb.toString();
                      runOnUiThread(() -> appendLog(out));
                  }).start();
              }

              private void dumpRecentLogcat() {
                  appendLog("\n=== Reading App Logcat Buffer (Last 60 lines) ===");
                  new Thread(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          Process proc = Runtime.getRuntime().exec(new String[]{"logcat", "-d", "-t", "60"});
                          try (BufferedReader br = new BufferedReader(new InputStreamReader(proc.getInputStream()))) {
                              String line;
                              while ((line = br.readLine()) != null) {
                                  sb.append(line).append("\n");
                              }
                          }
                      } catch (Throwable t) {
                          sb.append("Failed reading logcat: ").append(t.toString()).append("\n");
                      }
                      final String out = sb.toString();
                      runOnUiThread(() -> appendLog(out));
                  }).start();
              }

              private void loadIntoBridgedNamespace(ClassLoader loader, String libShortName, StringBuilder sb) throws Exception {
                  Method findLib = ClassLoader.class.getDeclaredMethod("findLibrary", String.class);
                  findLib.setAccessible(true);
                  String resolvedPath = (String) findLib.invoke(loader, libShortName);
                  if (resolvedPath == null) {
                      resolvedPath = runtimeInfo.stagedLibDir + "/lib" + libShortName + ".so";
                  }
                  try {
                      Method loadLib0 = Runtime.class.getDeclaredMethod("loadLibrary0", ClassLoader.class, String.class);
                      loadLib0.setAccessible(true);
                      loadLib0.invoke(Runtime.getRuntime(), loader, libShortName);
                      sb.append("[NAMESPACE LOADED] lib").append(libShortName).append(".so\n");
                  } catch (NoSuchMethodException nsme) {
                      System.load(resolvedPath);
                      sb.append("[SYSTEM LOADED] ").append(resolvedPath).append("\n");
                  }
              }

              private void appendLog(String text) {
                  logView.append(text + "\n");
              }

              public static PackageInspectionResult prepareInstalledRuntime(Context hostContext) {
                  PackageInspectionResult res = new PackageInspectionResult();
                  StringBuilder log = new StringBuilder();

                  log.append("=== Device & ABI Inspection ===\n");
                  log.append("Model: ").append(Build.MODEL).append(" (API ").append(Build.VERSION.SDK_INT).append(")\n");
                  log.append("Supported ABIs: ").append(String.join(", ", Build.SUPPORTED_ABIS)).append("\n\n");

                  try {
                      PackageManager pm = hostContext.getPackageManager();
                      PackageInfo pkgInfo = pm.getPackageInfo(MC_PACKAGE, 0);
                      ApplicationInfo appInfo = pkgInfo.applicationInfo;

                      res.installed = true;
                      res.baseApkPath = appInfo.publicSourceDir;
                      log.append("=== Official Minecraft Installation Found ===\n");
                      log.append("Version: ").append(pkgInfo.versionName)
                         .append(" (").append(pkgInfo.getLongVersionCode()).append(")\n");
                      log.append("Base APK: ").append(res.baseApkPath).append("\n");

                      if (appInfo.splitPublicSourceDirs != null) {
                          for (String split : appInfo.splitPublicSourceDirs) {
                              res.splitApkPaths.add(split);
                              log.append("Split APK: ").append(split).append("\n");
                              if (split.contains("armeabi_v7a") || split.contains("arm")) {
                                  res.armv7SplitPath = split;
                              }
                          }
                      }

                      try {
                          res.mcPackageContext = hostContext.createPackageContext(
                                  MC_PACKAGE, Context.CONTEXT_INCLUDE_CODE | Context.CONTEXT_IGNORE_SECURITY);
                          AssetManager mcAssets = res.mcPackageContext.getAssets();
                          String[] rootAssetList = mcAssets.list("");
                          log.append("[ASSETS OK] Mounted com.mojang.minecraftpe AssetManager (")
                             .append(rootAssetList != null ? rootAssetList.length : 0).append(" root entries).\n");
                      } catch (Throwable ctxErr) {
                          log.append("[WARN] createPackageContext note: ").append(ctxErr.toString()).append("\n");
                      }

                      String sourceApkForLibs = (res.armv7SplitPath != null) ? res.armv7SplitPath : res.baseApkPath;
                      File stageDir = new File(hostContext.getFilesDir(), "mc_armv7_libs");
                      if (!stageDir.exists()) {
                          stageDir.mkdirs();
                      }

                      int extractedCount = extractArmv7Libs(sourceApkForLibs, stageDir, log);
                      res.stagedLibDir = stageDir.getAbsolutePath();
                      log.append("Staged ").append(extractedCount).append(" armeabi-v7a libraries to: ")
                         .append(res.stagedLibDir).append("\n");

                      File optimizedDir = hostContext.getCodeCacheDir();
                      res.bridgedClassLoader = new DexClassLoader(
                              res.baseApkPath,
                              optimizedDir.getAbsolutePath(),
                              res.stagedLibDir,
                              hostContext.getClassLoader()
                      );

                      Class<?> gameActivityClass = res.bridgedClassLoader.loadClass("com.google.androidgamesdk.GameActivity");
                      Class<?> mainActivityClass = res.bridgedClassLoader.loadClass("com.mojang.minecraftpe.MainActivity");
                      Class<?> pairipAppClass = res.bridgedClassLoader.loadClass("com.pairip.application.Application");
                      Class<?> fmodClass = res.bridgedClassLoader.loadClass("org.fmod.FMOD");
                      log.append("[DEX OK] Loaded GameActivity: ").append(gameActivityClass.getName()).append("\n");
                      log.append("[DEX OK] Loaded MainActivity: ").append(mainActivityClass.getName()).append("\n");
                      log.append("[DEX OK] Detected PairIP Application Wrapper: ").append(pairipAppClass.getName()).append("\n");
                      log.append("[DEX OK] Loaded FMOD: ").append(fmodClass.getName()).append("\n");

                  } catch (PackageManager.NameNotFoundException e) {
                      res.installed = false;
                      log.append("[ERROR] Package ").append(MC_PACKAGE).append(" is not installed on this device.\n");
                  } catch (Throwable t) {
                      log.append("[ERROR] Exception during runtime preparation: ").append(t.toString()).append("\n");
                  }

                  res.diagnosticLog = log.toString();
                  return res;
              }

              private static int extractArmv7Libs(String apkPath, File destDir, StringBuilder log) {
                  int count = 0;
                  try (ZipFile zip = new ZipFile(apkPath)) {
                      Enumeration<? extends ZipEntry> entries = zip.entries();
                      byte[] buffer = new byte[65536];
                      while (entries.hasMoreElements()) {
                          ZipEntry entry = entries.nextElement();
                          String name = entry.getName();
                          if (name.startsWith("lib/armeabi-v7a/") && name.endsWith(".so")) {
                              String fileName = name.substring("lib/armeabi-v7a/".length());
                              File outFile = new File(destDir, fileName);
                              if (!outFile.exists() || outFile.length() != entry.getSize()) {
                                  if (outFile.exists()) {
                                      outFile.setWritable(true);
                                  }
                                  try (InputStream is = zip.getInputStream(entry);
                                       FileOutputStream fos = new FileOutputStream(outFile)) {
                                      int read;
                                      while ((read = is.read(buffer)) != -1) {
                                          fos.write(buffer, 0, read);
                                      }
                                  }
                                  outFile.setReadOnly();
                              }
                              count++;
                          }
                      }
                  } catch (Exception e) {
                      log.append("[WARN] Failed scanning ").append(apkPath).append(": ").append(e.getMessage()).append("\n");
                  }
                  return count;
              }
          }
          EOF

      - name: Build Debug APK (armeabi-v7a only)
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK ABI Contents (Ensure 32-bit ARMv7 Only & No Bundled libc++_shared.so)
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/"
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/"; then
            echo "ERROR: arm64-v8a libraries detected!"
            exit 1
          fi
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "libc++_shared.so"; then
            echo "ERROR: Bundled libc++_shared.so detected! Must use c++_static."
            exit 1
          fi

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-armv7-bootstrap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
