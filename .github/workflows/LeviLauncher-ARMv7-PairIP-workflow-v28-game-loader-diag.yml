          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.FileReader;
          import java.io.InputStreamReader;
          import java.io.PrintWriter;
          import java.io.RandomAccessFile;
          import java.io.StringWriter;
          import java.lang.reflect.Field;
          import java.lang.reflect.InvocationHandler;
          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          import java.lang.reflect.Proxy;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.Enumeration;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Pattern;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          /**
           * One-file diagnostics for the LeviLauncher ARMv7 port.
           *
           * Everything needed to understand a failed launch ends up in ONE text file:
           * device + Minecraft install facts, native-library details (ELF class, SONAME, DT_NEEDED),
           * class-loader layout, a timeline of launcher events, the launcher's own logcat lines,
           * Java thread stacks sampled while the game starts, full crash reports (Java and native,
           * including the xCrash tombstone itself) and state snapshots.
           *
           * Section markers to grep for:  ===== NAME =====   #K (key event)   LC (logcat)   TH (thread sample)
           */
          public final class GameDiagnostics {
              private static final String TAG = "GameDiagnostics";
              public static final String VERSION = "v28";
              private static final String FILE_NAME = "LeviLauncher-diagnostics.txt";

              private static final long SESSION_SOFT_CAP = 7L * 1024 * 1024;
              private static final long SESSION_HARD_CAP = 12L * 1024 * 1024;
              private static final long LOGCAT_CAP = 3L * 1024 * 1024;
              private static final long WATCH_CAP = 1536L * 1024;
              private static final long FILE_TRIM_AT = 14L * 1024 * 1024;
              private static final long FILE_KEEP = 8L * 1024 * 1024;

              private static final Object LOCK = new Object();
              private static final Object START_LOCK = new Object();
              private static volatile boolean startAttempted = false;
              private static volatile File logFile;
              private static volatile FileOutputStream out;
              private static volatile Context appContext;
              private static volatile long startElapsed;
              private static volatile int myPid;
              private static volatile long watchUntil;
              private static long sessionBytes;
              private static long watchBytes;
              private static String sessionId = "?";

              private static final LinkedHashMap<String, String> STAGES = new LinkedHashMap<String, String>();
              private static final Set<String> WATCH_SEEN = Collections.synchronizedSet(new HashSet<String>());
              private static final Set<String> FIRED_TRIGGERS = Collections.synchronizedSet(new HashSet<String>());
              private static final Map<String, Long> LIB_STARTED = Collections.synchronizedMap(new HashMap<String, Long>());

              private static final Pattern LOGCAT_KEYWORDS = Pattern.compile(
                      "(?i)MinecraftLaunch|GameClassLoader|GameDiagnostics|levimc|mojang|minecraft|pairip|VMRunner"
                              + "|linker|dlopen|UnsatisfiedLink|JNI|FATAL|AndroidRuntime|ActivityManager|ActivityThread"
                              + "|DEBUG|libc|abort|crash|PlayFab|maesdk|fmod|Instrumentation|ClassLoader|dex2oat|oat"
                              + "|Choreographer|OpenGL|EGL|Vulkan|billing|license|integrity|signature");

              private GameDiagnostics() {
              }

              // ------------------------------------------------------------------ public API

              public static boolean isStarted() {
                  return out != null;
              }

              public static String path() {
                  File f = logFile;
                  return f == null ? "(diagnostics file not open)" : f.getAbsolutePath();
              }

              /** Safe to call from any thread, any number of times. */
              public static void ensureStarted(Context context) {
                  if (startAttempted || context == null) return;
                  synchronized (START_LOCK) {
                      if (startAttempted) return;
                      startAttempted = true;
                  }
                  try {
                      Context app = context.getApplicationContext();
                      start(app != null ? app : context);
                  } catch (Throwable t) {
                      Log.e(TAG, "Diagnostics start failed", t);
                  }
              }

              /** Timeline line. */
              public static void line(String text) {
                  write(stamp() + " [" + Thread.currentThread().getName() + "] " + text + "\n", false);
              }

              /** Key event: shows up in the timeline as "#K stage: detail" and in every snapshot. */
              public static void event(String stage, String detail) {
                  String value = stamp() + " " + detail;
                  synchronized (STAGES) {
                      STAGES.put(stage, value);
                  }
                  extendWatch(90000L);
                  line("#K " + stage + ": " + detail);
              }

              public static void section(String title, String body) {
                  write("\n===== " + title + " (" + stamp() + ") =====\n" + body + "\n===== end " + title + " =====\n", false);
              }

              /** Full failure report: exception with causes, sampled state, all thread stacks. */
              public static void failure(String title, Throwable error, String extra) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("\n########## FAILURE: ").append(title).append(" (").append(stamp()).append(") ##########\n");
                  if (extra != null && extra.length() > 0) sb.append(extra).append("\n");
                  if (error != null) sb.append("--- exception ---\n").append(stackToString(error)).append("\n");
                  sb.append("--- state snapshot ---\n").append(snapshotText("failure: " + title)).append("\n");
                  sb.append("--- all Java threads ---\n").append(allThreadStacks(45)).append("\n");
                  sb.append("########## end FAILURE ##########\n");
                  write(sb.toString(), true);
              }

              public static void snapshot(String reason) {
                  write("\n===== STATE SNAPSHOT: " + reason + " (" + stamp() + ") =====\n" + snapshotText(reason)
                          + "\n===== end STATE SNAPSHOT =====\n", true);
              }

              /** "name | loader=... | dex=..." for one class. */
              public static String describeClass(Class<?> c) {
                  if (c == null) return "null";
                  return c.getName() + " | loader=" + loaderId(c.getClassLoader()) + " | dex=" + provenance(c);
              }

              /** Which loader/dex defined each class in the superclass chain. */
              public static String classChain(Class<?> c) {
                  StringBuilder sb = new StringBuilder();
                  int depth = 0;
                  while (c != null && depth < 12) {
                      sb.append("  ").append(describeClass(c)).append('\n');
                      c = c.getSuperclass();
                      depth++;
                  }
                  return sb.toString();
              }

              public static String loaderId(ClassLoader cl) {
                  if (cl == null) return "boot";
                  return cl.getClass().getName() + "@" + Integer.toHexString(System.identityHashCode(cl));
              }

              /** Dex location that defined the class (hidden fields, best effort). */
              public static String provenance(Class<?> c) {
                  try {
                      Field dexCache = Class.class.getDeclaredField("dexCache");
                      dexCache.setAccessible(true);
                      Object cache = dexCache.get(c);
                      if (cache == null) return "no-dexcache";
                      Field location = cache.getClass().getDeclaredField("location");
                      location.setAccessible(true);
                      return String.valueOf(location.get(cache));
                  } catch (Throwable t) {
                      return "unknown(" + t.getClass().getSimpleName() + ")";
                  }
              }

              /** Loader chain plus the dex elements and native directories of every dex loader in it. */
              public static String loaderReport(String label, ClassLoader loader) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("--- loader report: ").append(label).append(" ---\n");
                  ClassLoader cl = loader;
                  int depth = 0;
                  while (cl != null && depth < 8) {
                      sb.append("  [").append(depth).append("] ").append(loaderId(cl)).append('\n');
                      appendDexLoaderDetails(sb, cl);
                      cl = cl.getParent();
                      depth++;
                  }
                  if (cl == null) sb.append("  [").append(depth).append("] boot\n");
                  return sb.toString();
              }

              public static void libLoadBegin(File file) {
                  try {
                      LIB_STARTED.put(file.getName(), SystemClock.elapsedRealtime());
                      event("lib", "loading " + file.getName() + " size=" + file.length() + " " + elfSummary(file));
                  } catch (Throwable t) {
                      line("libLoadBegin failed: " + t);
                  }
              }

              public static void libLoadEnd(File file) {
                  try {
                      Long began = LIB_STARTED.get(file.getName());
                      long ms = began == null ? -1 : SystemClock.elapsedRealtime() - began;
                      event("lib", "loaded " + file.getName() + " in " + ms + "ms, mapped now: " + mappedCount(file.getName()));
                      if ("libminecraftpe.so".equals(file.getName())) snapshot("libminecraftpe.so loaded");
                  } catch (Throwable t) {
                      line("libLoadEnd failed: " + t);
                  }
              }

              // ------------------------------------------------------------------ start-up

              private static void start(Context ctx) throws Exception {
                  appContext = ctx;
                  startElapsed = SystemClock.elapsedRealtime();
                  myPid = Process.myPid();
                  sessionId = Long.toHexString(System.currentTimeMillis()) + "-" + myPid;
                  watchUntil = SystemClock.elapsedRealtime() + 30000L;
                  openLogFile(ctx);
                  write(banner(ctx), true);
                  try {
                      write(environmentReport(ctx), true);
                  } catch (Throwable t) {
                      write("environment report failed: " + stackToString(t) + "\n", true);
                  }
                  try {
                      attachPreviousCrashes(ctx);
                  } catch (Throwable t) {
                      write("attaching previous crashes failed: " + stackToString(t) + "\n", true);
                  }
                  installCrashHooks();
                  startLogcatTee();
                  startThreadWatcher();
                  showToast(ctx);
                  event("diagnostics", "started, file=" + path());
              }

              private static void openLogFile(Context ctx) {
                  List<File> candidates = new ArrayList<File>();
                  try {
                      File downloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (downloads != null && (downloads.isDirectory() || downloads.mkdirs())) {
                          candidates.add(new File(downloads, FILE_NAME));
                      }
                  } catch (Throwable ignored) {
                  }
                  try {
                      File external = ctx.getExternalFilesDir(null);
                      if (external != null) candidates.add(new File(external, FILE_NAME));
                  } catch (Throwable ignored) {
                  }
                  candidates.add(new File(ctx.getFilesDir(), FILE_NAME));
                  for (File candidate : candidates) {
                      try {
                          trimIfHuge(candidate);
                          FileOutputStream stream = new FileOutputStream(candidate, true);
                          logFile = candidate;
                          out = stream;
                          return;
                      } catch (Throwable ignored) {
                      }
                  }
              }

              private static void trimIfHuge(File f) {
                  try {
                      if (!f.isFile() || f.length() <= FILE_TRIM_AT) return;
                      RandomAccessFile raf = new RandomAccessFile(f, "r");
                      byte[] tail = new byte[(int) FILE_KEEP];
                      raf.seek(f.length() - FILE_KEEP);
                      raf.readFully(tail);
                      raf.close();
                      FileOutputStream rewrite = new FileOutputStream(f, false);
                      rewrite.write("[older diagnostics trimmed to keep the file small]\n".getBytes("UTF-8"));
                      rewrite.write(tail);
                      rewrite.close();
                  } catch (Throwable ignored) {
                  }
              }

              private static String banner(Context ctx) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("\n\n");
                  sb.append("################################################################################\n");
                  sb.append("#### LEVILAUNCHER DIAGNOSTICS ").append(VERSION).append("  session=").append(sessionId).append('\n');
                  sb.append("#### started ").append(new java.util.Date()).append("  pid=").append(myPid).append('\n');
                  sb.append("#### file: ").append(path()).append('\n');
                  sb.append("################################################################################\n");
                  sb.append("HOW TO READ THIS FILE (send the WHOLE file):\n");
                  sb.append("  ===== NAME =====   big sections (ENVIRONMENT, MINECRAFT, LIBRARIES, LOADERS, SNAPSHOT, CRASH ...)\n");
                  sb.append("  #K ...            key events in order (grep '#K' for the story of this launch)\n");
                  sb.append("  [bridge] ...      class-loader bridge messages\n");
                  sb.append("  LC ...            the launcher's own logcat lines (warnings/errors + game-related)\n");
                  sb.append("  TH ...            Java thread samples taken while the game starts (find what runs where)\n");
                  sb.append("  ##### FAILURE     Java failures with full stacks, all threads and a state snapshot\n");
                  sb.append("  ===== NATIVE CRASH native crash report + the xCrash tombstone copied in\n");
                  sb.append("Older sessions are above; the NEWEST session is at the bottom.\n\n");
                  return sb.toString();
              }

              private static void showToast(final Context ctx) {
                  try {
                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Toast.makeText(ctx, "Diagnostics file: " + path(), Toast.LENGTH_LONG).show();
                              } catch (Throwable ignored) {
                              }
                          }
                      });
                  } catch (Throwable ignored) {
                  }
              }

              // ------------------------------------------------------------------ writing

              private static String stamp() {
                  long ms = SystemClock.elapsedRealtime() - startElapsed;
                  return String.format(Locale.US, "T+%8.3fs", ms / 1000.0);
              }

              private static void write(String text, boolean critical) {
                  FileOutputStream stream = out;
                  if (stream == null || text == null) return;
                  synchronized (LOCK) {
                      try {
                          byte[] bytes = text.getBytes("UTF-8");
                          long cap = critical ? SESSION_HARD_CAP : SESSION_SOFT_CAP;
                          if (sessionBytes + bytes.length > cap) return;
                          stream.write(bytes);
                          sessionBytes += bytes.length;
                      } catch (Throwable ignored) {
                      }
                  }
              }

              // ------------------------------------------------------------------ environment

              private static String environmentReport(Context ctx) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("===== ENVIRONMENT =====\n");
                  sb.append("device: ").append(Build.MANUFACTURER).append(' ').append(Build.BRAND).append(' ').append(Build.MODEL)
                          .append(" (").append(Build.DEVICE).append(")\n");
