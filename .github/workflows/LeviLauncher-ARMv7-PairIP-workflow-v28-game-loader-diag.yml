name: Build LeviLauncher ARMv7 game-class-loader bridge + PairIP diagnostics APK v28 (Android 10)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this builder workflow
        uses: actions/checkout@v4

      - name: Check out LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: 38764ca77b4fcb9c27ab3cec688e67e5166141df
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Fetch pinned recipe and build v28 official-Minecraft-namespace candidate
        id: build
        shell: bash
        env:
          TEMPLATE_COMMIT: a4ac407be409c912c7450335d9852885d831dfd4
        run: |
          set -euo pipefail
          TEMPLATE="$RUNNER_TEMP/LeviLauncher-ARMv7-PairIP-workflow-v5-template.yml"
          URL="https://raw.githubusercontent.com/mynameisgoodlen/Mcpe/${TEMPLATE_COMMIT}/.github/workflows/LeviLauncher-ARMv7-PairIP-workflow-v5.yml"
          curl --fail --silent --show-error --location "$URL" --retry 3 --retry-delay 2 -o "$TEMPLATE"
          test -s "$TEMPLATE"
          echo "Pinned recipe downloaded: $(wc -c < "$TEMPLATE") bytes"
          python3 - "$TEMPLATE" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "PyYAML"],
                  check=True,
              )
              import yaml

          template_path = Path(sys.argv[1])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          document = yaml.safe_load(template_path.read_text(encoding="utf-8"))
          jobs = document.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"Expected one job in pinned recipe; got {len(jobs)}")
          steps = next(iter(jobs.values())).get("steps", [])
          if not steps:
              raise SystemExit("Pinned build recipe has no steps")

          # Keep v8's PairIP branch patch and verifier fix; the final shared
          # class-loader step below routes the relevant libraries through one namespace.
          old_pairip_line = "i + '} else if (normalizedName == \"pairipcore\" || normalizedName == \"PlayFabMultiplayer\" || normalizedName == \"maesdk\") {',"
          new_pairip_lines = "\n".join([
              "i + '} else if (normalizedName == \"pairipcore\") {',",
              "                  i + '    initializeOfficialPairIp()',",
              "                  i + '} else if (normalizedName == \"PlayFabMultiplayer\" || normalizedName == \"maesdk\") {',",
          ])
          old_dex_check = (
              "loader_dex = z.read('assets/runtime-native-loader.dex')\n"
              "if not loader_dex.startswith(b'dex\\n') or len(loader_dex) < 100:\n"
              "    raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')"
          )
          new_dex_check = (
              "    loader_dex = z.read('assets/runtime-native-loader.dex')\n"
              "    if not loader_dex.startswith(b'dex\\n') or len(loader_dex) < 100:\n"
              "        raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')"
          )

          recipe_run_steps = []
          pairip_fix_count = 0
          dex_fix_count = 0
          for step in steps:
              if "run" not in step:
                  continue
              script = step["run"]
              if old_pairip_line in script:
                  if script.count(old_pairip_line) != 1:
                      raise SystemExit("PairIP branch patch was ambiguous; refusing to build")
                  script = script.replace(old_pairip_line, new_pairip_lines, 1)
                  pairip_fix_count += 1
              if old_dex_check in script:
                  if script.count(old_dex_check) != 1:
                      raise SystemExit("ZIP verifier patch was ambiguous; refusing to build")
                  script = script.replace(old_dex_check, new_dex_check, 1)
                  dex_fix_count += 1

              script = script.replace(
                  "LeviLauncher-ARMv7-build-log-v5", "LeviLauncher-ARMv7-build-log-v28"
              )
              script = script.replace(
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk",
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v28.apk",
              )
              script = script.replace(
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v5",
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v28",
              )
              recipe_run_steps.append((step, script))

          if pairip_fix_count != 1:
              raise SystemExit(f"Expected exactly one PairIP loader patch; found {pairip_fix_count}")
          if dex_fix_count != 1:
              raise SystemExit(f"Expected exactly one ZIP verifier patch; found {dex_fix_count}")

          required_recipe_markers = (
              "PAIRIP_B64_00",
              "Bundle compressed ARMv7 PairIP dependency",
              "Extract and preload PlayFab and Mae dependencies before Minecraft",
              "Load the Minecraft native dependency chain with a shared game-parent classloader",
              "Compile standalone DEX entrypoint for the game-parent native loader",
              "Verify the APK targets ARMv7",
          )
          original_text = template_path.read_text(encoding="utf-8")
          missing = [marker for marker in required_recipe_markers if marker not in original_text]
          if missing:
              raise SystemExit("Pinned recipe is missing required sections: " + ", ".join(missing))

          any_failed = False
          build_failed = False
          run_count = 0

          def condition_allows(step):
              condition = str(step.get("if", "")).strip()
              if "always()" in condition:
                  return True
              if "failure()" in condition or "steps.build.outcome == 'failure'" in condition:
                  return any_failed or build_failed
              if "success()" in condition:
                  return not any_failed
              return not any_failed

          GAME_CLASS_LOADER_BRIDGE_KT = r'''package org.levimc.launcher.core.minecraft

          import android.app.Activity
          import android.content.Context
          import android.util.Log
          import dalvik.system.BaseDexClassLoader
          import dalvik.system.PathClassLoader
          import java.io.File
          import java.util.Collections

          /**
           * Why this exists
           * ---------------
           * Minecraft's native libraries are loaded through the installed Minecraft package ClassLoader
           * (that is what keeps PairIP / PlayFab happy). ART only binds JNI natives from a library that was
           * loaded by the SAME ClassLoader that defined the Java class, and it resolves JNI_OnLoad's
           * FindClass() through that loader as well.
           *
           * The launcher, however, ships its own patched copies of the Mojang classes (GameActivity,
           * MainActivity, HttpClient*, Xbox*, maesdk, FMOD ...) and MinecraftActivity itself. Those were
           * defined by the launcher's ClassLoader, so GameActivity.initializeNativeCode() could never bind.
           *
           * What it does
           * ------------
           * 1. Prepends the launcher's own dex files to the Minecraft ClassLoader's dex list, so the
           *    Minecraft loader defines the launcher's copies of the game classes (and MinecraftActivity).
           * 2. Re-parents the Minecraft ClassLoader to a tiny delegating loader that sends every
           *    non-game class (kotlin, androidx, org.levimc.*, ...) to the launcher ClassLoader, so shared
           *    singletons keep exactly one identity.
           * 3. GameComponentFactory then creates MinecraftActivity from the Minecraft ClassLoader.
           */
          object GameClassLoaderBridge {
              private const val TAG = "GameClassLoaderBridge"
              internal const val ACTIVITY_CLASS = "org.levimc.launcher.core.minecraft.MinecraftActivity"
              private const val GMS_NATIVE_LISTENER = "com.google.android.gms.tasks.NativeOnCompleteListener"

              // Packages whose classes carry JNI natives implemented by Minecraft's libraries.
              private val GAME_PACKAGES = arrayOf(
                  "com.mojang.minecraftpe.",
                  "com.google.androidgamesdk.",
                  "com.microsoft.applications.events.",
                  "com.microsoft.playfab.",
                  "com.microsoft.xal.",
                  "com.microsoft.xbox.",
                  "com.microsoft.xboxtcui.",
                  "com.xbox.httpclient.",
                  "org.fmod."
              )

              @Volatile
              private var gameLoader: ClassLoader? = null

              // ---- v16 diagnostics: which Minecraft-own (PairIP-protected) classes run inside the launcher? ----
              private val reportedNames: MutableSet<String> = Collections.synchronizedSet(HashSet<String>())

              /** Every bridge message goes to logcat AND to the single diagnostics file. */
              private fun trace(line: String) {
                  try {
                      Log.w(TAG, line)
                      GameDiagnostics.line("[bridge] " + line)
                  } catch (ignored: Throwable) {
                  }
              }

              private fun callerStack(): String {
                  return try {
                      val text = Log.getStackTraceString(Throwable("class load requested here"))
                      if (text.length > 3500) text.substring(0, 3500) else text
                  } catch (ignored: Throwable) {
                      "(stack unavailable)"
                  }
              }

              /** Called by the delegating parent for every class the Minecraft loader is asked to load. */
              internal fun noteRequest(name: String, launcherHasIt: Boolean) {
                  try {
                      if (launcherHasIt) return
                      if (!reportedNames.add(name)) return
                      val pairip = name.startsWith("com.pairip.") || name.contains("licens", ignoreCase = true)
                      if (pairip) {
                          trace("MINECRAFT-OWN class (PairIP/license related): $name\n" + callerStack())
                      } else {
                          trace("MINECRAFT-OWN class: $name")
                      }
                  } catch (ignored: Throwable) {
                  }
              }

              /** Records which game classes the Minecraft loader had already defined BEFORE the bridge existed. */
              private fun reportPreloadedGameClasses(loader: ClassLoader) {
                  try {
                      val find = ClassLoader::class.java.getDeclaredMethod("findLoadedClass", String::class.java)
                          .apply { isAccessible = true }
                      val names = arrayOf(
                          "com.mojang.minecraftpe.MainActivity",
                          "com.google.androidgamesdk.GameActivity",
                          "androidx.fragment.app.FragmentActivity",
                          "androidx.activity.ComponentActivity",
                          ACTIVITY_CLASS
                      )
                      val already = ArrayList<String>()
                      for (name in names) {
                          if (find.invoke(loader, name) != null) already.add(name)
                      }
                      trace(
                          "Classes already defined by the Minecraft loader before the bridge: " +
                              (if (already.isEmpty()) "none" else already.joinToString(", "))
                      )
                  } catch (t: Throwable) {
                      trace("findLoadedClass probe failed: $t")
                  }
              }

              /** The Minecraft loader must define the LAUNCHER's copy, not Minecraft's own (PairIP-protected) one. */
              private fun ensureLauncherCopy(minecraftLoader: ClassLoader, launcherLoader: ClassLoader, name: String) {
                  var detail = "unchecked"
                  var mismatch = false
                  try {
                      val mine = Class.forName(name, false, minecraftLoader)
                      val launchers = Class.forName(name, false, launcherLoader)
                      val mineMethods = mine.declaredMethods.size
                      val launcherMethods = launchers.declaredMethods.size
                      val mineFields = mine.declaredFields.size
                      val launcherFields = launchers.declaredFields.size
                      detail = "methods $mineMethods/$launcherMethods fields $mineFields/$launcherFields"
                      mismatch = mineMethods != launcherMethods || mineFields != launcherFields
                  } catch (t: Throwable) {
                      trace("Could not compare $name copies: $t")
                      return
                  }
                  trace("Copy check for $name: $detail" + (if (mismatch) "  <-- MINECRAFT'S OWN COPY" else "  (launcher copy)"))
                  try {
                      trace("  minecraft-loader copy: " + GameDiagnostics.describeClass(Class.forName(name, false, minecraftLoader)))
                      trace("  launcher-loader copy : " + GameDiagnostics.describeClass(Class.forName(name, false, launcherLoader)))
                  } catch (ignored: Throwable) {
                  }
                  if (mismatch) {
                      throw IllegalStateException(
                          "Minecraft loader defined Minecraft's own $name instead of the launcher copy ($detail); " +
                              "it was loaded before the bridge was installed"
                      )
                  }
              }

              /** Logs what PairIP looks like inside Minecraft's own dex so the real trigger can be identified. */
              private fun describePairIp(minecraftLoader: ClassLoader, minecraftElements: Array<*>) {
                  try {
                      val names = ArrayList<String>()
                      for (element in minecraftElements) {
                          if (element == null) continue
                          try {
                              val dexFileField = element.javaClass.getDeclaredField("dexFile").apply { isAccessible = true }
                              val dexFile = dexFileField.get(element) as? dalvik.system.DexFile ?: continue
                              val entries = dexFile.entries()
                              while (entries.hasMoreElements()) {
                                  val name = entries.nextElement()
                                  if (name.startsWith("com.pairip.")) names.add(name)
                              }
                          } catch (ignored: Throwable) {
                          }
                      }
                      names.sort()
                      trace("Minecraft dex contains ${names.size} com.pairip.* class(es):\n" + names.joinToString("\n"))
                  } catch (t: Throwable) {
                      trace("Could not enumerate com.pairip.* classes: $t")
                  }
                  try {
                      val runner = Class.forName("com.pairip.VMRunner", false, minecraftLoader)
                      val sb = StringBuilder("com.pairip.VMRunner members (loader=" + runner.classLoader + "):\n")
                      for (f in runner.declaredFields) sb.append("  field ").append(f.type.name).append(' ').append(f.name).append(" mods=").append(f.modifiers).append('\n')
                      for (m in runner.declaredMethods) {
                          sb.append("  method ").append(m.returnType.name).append(' ').append(m.name).append('(')
                          sb.append(m.parameterTypes.joinToString(",") { it.name }).append(") mods=").append(m.modifiers).append('\n')
                      }
                      trace(sb.toString())
                  } catch (t: Throwable) {
                      trace("Could not describe com.pairip.VMRunner: $t")
                  }
              }

              @JvmStatic
              fun isGameClass(name: String): Boolean {
                  if (name == ACTIVITY_CLASS || name == GMS_NATIVE_LISTENER) return true
                  // MinecraftActivity$Companion, lambdas, PreloaderTextInput ... but NOT MinecraftActivityState.
                  if (name.startsWith("$ACTIVITY_CLASS\$")) return true
                  for (prefix in GAME_PACKAGES) {
                      if (name.startsWith(prefix)) return true
                  }
                  return false
              }

              private const val MINECRAFT_PACKAGE = "com.mojang.minecraftpe"

              /**
               * Creates (once) the dedicated game ClassLoader.
               *
               * Why not the Minecraft package loader any more: Android fills that loader from Minecraft's own
               * pre-compiled app image, so Minecraft's original MainActivity / GameActivity / androidx classes
               * are already defined in it before the launcher can do anything, and no install order can
               * replace them. A fresh loader over the same APKs has none of that. Both PairIP and every game
               * library are initialised through THIS loader, so they share one native namespace.
               */
              @Synchronized
              @JvmStatic
              fun obtainGameLoader(context: Context): ClassLoader {
                  val existing = gameLoader
                  if (existing != null) return existing
                  val launcherLoader = GameClassLoaderBridge::class.java.classLoader
                      ?: throw UnsatisfiedLinkError("Launcher ClassLoader is unavailable")
                  GameDiagnostics.ensureStarted(context)
                  GameDiagnostics.event(
                      "bridge-install-begin",
                      "creating the dedicated game loader; launcherLoader=" + GameDiagnostics.loaderId(launcherLoader) +
                          " thread=" + Thread.currentThread().name
                  )
                  try {
                      val minecraft = context.packageManager.getApplicationInfo(MINECRAFT_PACKAGE, 0)
                      val launcherApk = context.applicationInfo.sourceDir
                      val codePaths = ArrayList<String>()
                      codePaths.add(launcherApk) // the launcher's patched Mojang copies win ...
                      codePaths.addAll(minecraftCodeApks(minecraft)) // ... Minecraft's own classes are the fallback
                      val libraryDirs = ArrayList<String>()
                      val launcherNativeDir = context.applicationInfo.nativeLibraryDir
                      if (launcherNativeDir != null) libraryDirs.add(launcherNativeDir)
                      if (minecraft.nativeLibraryDir != null && !libraryDirs.contains(minecraft.nativeLibraryDir)) {
                          libraryDirs.add(minecraft.nativeLibraryDir)
                      }
                      collectLibraryDirs(context.filesDir, 0, libraryDirs)
                      trace("game loader code paths: $codePaths")
                      trace("game loader native library dirs: $libraryDirs")

                      val loader: ClassLoader = PathClassLoader(
                          codePaths.joinToString(File.pathSeparator),
                          libraryDirs.joinToString(File.pathSeparator),
                          LauncherDelegatingParent(launcherLoader)
                      )
                      detachLauncherResources(loader, launcherApk)
                      reportPreloadedGameClasses(loader)
                      GameDiagnostics.section(
                          "GAME LOADER CREATED",
                          GameDiagnostics.loaderReport("launcher (app) loader", launcherLoader) +
                              GameDiagnostics.loaderReport("dedicated game loader", loader)
                      )
                      describePairIp(loader, dexElementsOf(loader))

                      // Prove the result instead of assuming it.
                      val activityClass = loader.loadClass(ACTIVITY_CLASS)
                      val gameActivityClass = loader.loadClass("com.google.androidgamesdk.GameActivity")
                      check(activityClass.classLoader === loader) { "MinecraftActivity is not defined by the game loader" }
                      check(gameActivityClass.classLoader === loader) { "GameActivity is not defined by the game loader" }
                      check(gameActivityClass.isAssignableFrom(activityClass)) {
                          "MinecraftActivity does not extend the game-loader GameActivity"
                      }
                      ensureLauncherCopy(loader, launcherLoader, "com.mojang.minecraftpe.MainActivity")
                      ensureLauncherCopy(loader, launcherLoader, "com.google.androidgamesdk.GameActivity")

                      gameLoader = loader
                      hookActivityCreation(context, loader)
                      GameDiagnostics.event("bridge-installed", "game classes and game libraries use " + GameDiagnostics.loaderId(loader))
                      return loader
                  } catch (t: Throwable) {
                      Log.e(TAG, "Failed to create the game class loader", t)
                      throw UnsatisfiedLinkError(
                          "Game class-loader bridge failed: ${t.message ?: t.javaClass.simpleName}"
                      ).also { it.initCause(t) }
                  }
              }

              /** Replacement for the launcher's own PairIP initialisation: same call, but in the game loader. */
              @JvmStatic
              fun initializePairIp(context: Context) {
                  val loader = obtainGameLoader(context)
                  GameDiagnostics.event("pairip", "initialising com.pairip.VMRunner in the game loader")
                  try {
                      Class.forName("com.pairip.VMRunner", true, loader)
                      GameDiagnostics.event("pairip", "com.pairip.VMRunner initialised")
                  } catch (t: Throwable) {
                      trace("PairIP initialisation failed: " + Log.getStackTraceString(t))
                      throw UnsatisfiedLinkError(
                          "Cannot initialize official PairIP using the game class loader: ${t.message ?: t.javaClass.simpleName}"
                      ).also { it.initCause(t) }
                  }
              }

              private fun minecraftCodeApks(info: android.content.pm.ApplicationInfo): List<String> {
                  val all = ArrayList<String>()
                  all.add(info.sourceDir)
                  val splits = info.splitSourceDirs
                  if (splits != null) {
                      for (split in splits) all.add(split)
                  }
                  val withCode = ArrayList<String>()
                  for (apk in all) {
                      try {
                          java.util.zip.ZipFile(apk).use { zip ->
                              if (zip.getEntry("classes.dex") != null) withCode.add(apk)
                          }
                      } catch (ignored: Throwable) {
                      }
                  }
                  if (withCode.isEmpty()) withCode.add(info.sourceDir)
                  return withCode
              }

              private fun collectLibraryDirs(dir: File, depth: Int, into: MutableList<String>) {
                  if (depth > 6 || !dir.isDirectory) return
                  val children = dir.listFiles() ?: return
                  var hasLibrary = false
                  for (child in children) {
                      if (child.isFile && child.name.endsWith(".so")) hasLibrary = true
                  }
                  if (hasLibrary) into.add(dir.absolutePath)
                  for (child in children) {
                      if (child.isDirectory) collectLibraryDirs(child, depth + 1, into)
                  }
              }

              private fun dexElementsOf(loader: ClassLoader): Array<*> {
                  val baseDexLoader = Class.forName("dalvik.system.BaseDexClassLoader")
                  val pathListField = baseDexLoader.getDeclaredField("pathList").apply { isAccessible = true }
                  val pathList = pathListField.get(loader) ?: throw IllegalStateException("Loader has no pathList")
                  val elementsField = pathList.javaClass.getDeclaredField("dexElements").apply { isAccessible = true }
                  return elementsField.get(pathList) as Array<*>
              }

              /**
               * The launcher APK is in the game loader only to supply classes. If it also supplied resources,
               * it would shadow Minecraft's APK for getResource() lookups (Element.path == null: no resources).
               */
              private fun detachLauncherResources(loader: ClassLoader, launcherApk: String) {
                  try {
                      var detached = 0
                      for (element in dexElementsOf(loader)) {
                          if (element == null) continue
                          val pathField = element.javaClass.getDeclaredField("path").apply { isAccessible = true }
                          if (pathField.get(element)?.toString() == launcherApk) {
                              pathField.set(element, null)
                              detached++
                          }
                      }
                      trace("Detached resource lookup from $detached launcher dex element(s)")
                  } catch (t: Throwable) {
                      trace("WARNING: could not detach launcher resources: $t")
                  }
              }

              @Volatile
              private var factoryRequests = 0

              @Volatile
              private var factoryResult = "factory never asked for MinecraftActivity"

              @Volatile
              private var factoryHook = "not attempted"

              @Volatile
              private var routerHook = "not attempted"

              @Volatile
              private var routerRequests = 0

              @Volatile
              private var factoryAllCalls = 0

              @Volatile
              private var factoryLastNames = ""

              @Volatile
              private var factoryLastLoader = "none"

              /** Called by GameComponentFactory for every activity Android asks it to create. */
              @JvmStatic
              fun noteFactoryCall(className: String, loader: ClassLoader?) {
                  factoryAllCalls++
                  factoryLastNames = (factoryLastNames + " " + className.substringAfterLast('.')).takeLast(160)
                  factoryLastLoader = loaderLabel(loader, GameClassLoaderBridge::class.java.classLoader)
              }

              /**
               * Two independent ways to make Android build MinecraftActivity from the Minecraft loader:
               *  1. put our factory straight into the launcher's LoadedApk (instead of trusting the manifest);
               *  2. replace LoadedApk.mClassLoader with a router that returns the Minecraft-loader copy of
               *     MinecraftActivity and behaves exactly like the launcher loader for everything else.
               */
              private fun hookActivityCreation(context: Context, game: ClassLoader) {
                  var loadedApk: Any? = null
                  try {
                      val activityThreadClass = Class.forName("android.app.ActivityThread")
                      val thread = activityThreadClass.getMethod("currentActivityThread").invoke(null)
                          ?: throw IllegalStateException("No ActivityThread")
                      loadedApk = activityThreadClass
                          .getMethod("peekPackageInfo", String::class.java, Boolean::class.javaPrimitiveType)
                          .invoke(thread, context.packageName, true)
                          ?: throw IllegalStateException("No LoadedApk for " + context.packageName)
                      val field = loadedApk.javaClass.getDeclaredField("mAppComponentFactory").apply { isAccessible = true }
                      val existing = field.get(loadedApk)
                      if (existing is GameComponentFactory) {
                          factoryHook = "already GameComponentFactory"
                      } else {
                          field.set(loadedApk, GameComponentFactory())
                          factoryHook = "hooked (previous factory: " + (existing?.javaClass?.name ?: "null") + ")"
                      }
                  } catch (t: Throwable) {
                      factoryHook = "FAILED: $t"
                  }
                  trace("AppComponentFactory: $factoryHook")

                  try {
                      val apk = loadedApk ?: throw IllegalStateException("No LoadedApk")
                      val classLoaderField = apk.javaClass.getDeclaredField("mClassLoader").apply { isAccessible = true }
                      val current = classLoaderField.get(apk) as? ClassLoader ?: throw IllegalStateException("LoadedApk has no ClassLoader")
                      val base = if (current is ActivityRoutingLoader) (current.parent ?: current) else current
                      classLoaderField.set(apk, ActivityRoutingLoader(base, game))
                      routerHook = "installed (base loader: " + base.javaClass.simpleName + ")"
                  } catch (t: Throwable) {
                      routerHook = "FAILED: $t"
                  }
                  trace("Activity class-loader router: $routerHook")
              }

              private fun loaderLabel(loader: ClassLoader?, launcher: ClassLoader?): String {
                  return when {
                      loader == null -> "boot"
                      loader === gameLoader -> "MINECRAFT-LOADER"
                      loader === launcher -> "LAUNCHER-LOADER"
                      else -> loader.javaClass.simpleName + "@" + Integer.toHexString(System.identityHashCode(loader))
                  }
              }

              /** One-line summary of who defines what, so a failure shows the class-loader picture by itself. */
              @JvmStatic
              fun describeActivity(activity: Any): String {
                  return try {
                      val launcher = GameClassLoaderBridge::class.java.classLoader
                      val sb = StringBuilder()
                      sb.append("diagnosticsFile=").append(GameDiagnostics.path()).append(" bridgeInstalled=").append(gameLoader != null)
                      sb.append(" factoryHook=").append(factoryHook)
                      sb.append(" routerHook=").append(routerHook)
                      sb.append(" routerRequests=").append(routerRequests)
                      sb.append(" factoryAllCalls=").append(factoryAllCalls)
                      sb.append(" factoryLast=[").append(factoryLastNames.trim()).append("] factoryLoader=").append(factoryLastLoader)
                      sb.append(" factoryRequests=").append(factoryRequests)
                      sb.append(" factoryResult=").append(factoryResult)
                      sb.append(" activityChain=")
                      var current: Class<*>? = activity.javaClass
                      var depth = 0
                      while (current != null && depth < 6) {
                          sb.append(current.simpleName).append(':').append(loaderLabel(current.classLoader, launcher)).append(' ')
                          current = current.superclass
                          depth++
                      }
                      val installed = gameLoader
                      if (installed != null) {
                          try {
                              val ga = Class.forName("com.google.androidgamesdk.GameActivity", false, installed)
                              sb.append("minecraftLoaderGameActivity=").append(loaderLabel(ga.classLoader, launcher))
                          } catch (t: Throwable) {
                              sb.append("minecraftLoaderGameActivity=ERR:").append(t.javaClass.simpleName)
                          }
                      }
                      sb.toString()
                  } catch (t: Throwable) {
                      "describe failed: $t"
                  }
              }

              /** Called from MinecraftActivity when Mojang's MainActivity.onCreate throws, so the cause is never lost. */
              @JvmStatic
              fun reportActivityFailure(activity: Any, error: Throwable) {
                  trace("MinecraftActivity failure [" + describeActivity(activity) + "]")
                  try {
                      GameDiagnostics.failure(
                          "MinecraftActivity.onCreate failed (Mojang MainActivity.onCreate threw)",
                          error,
                          describeActivity(activity) + "\n--- who defines each class in the activity chain ---\n" +
                              GameDiagnostics.classChain(activity.javaClass)
                      )
                  } catch (ignored: Throwable) {
                  }
              }

              /** Fallback for the case where MinecraftActivity is created before the libraries were prepared. */
              private fun installFromApplication() {
                  val application = Class.forName("android.app.ActivityThread")
                      .getMethod("currentApplication").invoke(null) as? Context
                      ?: throw IllegalStateException("No current application")
                  obtainGameLoader(application)
              }

              /** Creates MinecraftActivity from the Minecraft ClassLoader, or null if the bridge is not active. */
              @JvmStatic
              fun newGameActivity(className: String): Activity? {
                  if (className != ACTIVITY_CLASS) return null
                  factoryRequests++
                  if (gameLoader == null) {
                      trace("GameComponentFactory: bridge not installed yet, installing from the application context")
                      try {
                          installFromApplication()
                      } catch (t: Throwable) {
                          trace("On-demand bridge install failed: " + Log.getStackTraceString(t))
                      }
                  }
                  val loader = gameLoader
                  if (loader == null) {
                      factoryResult = "bridge unavailable, default launcher-loader activity used"
                      trace("GameComponentFactory: $factoryResult")
                      return null
                  }
                  trace("GameComponentFactory: creating MinecraftActivity through the Minecraft ClassLoader")
                  return try {
                      val created = loader.loadClass(className).getDeclaredConstructor().newInstance() as Activity
                      factoryResult = "created through the Minecraft loader"
                      created
                  } catch (t: Throwable) {
                      factoryResult = "failed: $t"
                      trace("Could not instantiate $className through the Minecraft ClassLoader: " + Log.getStackTraceString(t))
                      null
                  }
              }

              private class ActivityRoutingLoader(
                  parent: ClassLoader,
                  private val game: ClassLoader
              ) : PathClassLoader("", null, parent) {
                  override fun loadClass(name: String, resolve: Boolean): Class<*> {
                      if (name == GameClassLoaderBridge.ACTIVITY_CLASS) {
                          GameClassLoaderBridge.noteRouted()
                          return game.loadClass(name)
                      }
                      return super.loadClass(name, resolve)
                  }

                  override fun findLibrary(name: String?): String? {
                      if (name == null) return null
                      if (game is BaseDexClassLoader) {
                          val fromGame = game.findLibrary(name)
                          if (fromGame != null) return fromGame
                      }
                      val p = parent
                      if (p is BaseDexClassLoader) {
                          val fromParent = p.findLibrary(name)
                          if (fromParent != null) return fromParent
                      }
                      return super.findLibrary(name)
                  }
              }

              internal fun noteRouted() {
                  routerRequests++
              }

              private class LauncherDelegatingParent(
                  private val launcherLoader: ClassLoader
              ) : ClassLoader(null as ClassLoader?) {
                  override fun loadClass(name: String, resolve: Boolean): Class<*> {
                      // Game classes: refuse, so the Minecraft loader defines them from its own dex list
                      // (the launcher's copy comes first there; Minecraft's own class is the fallback).
                      if (GameClassLoaderBridge.isGameClass(name)) {
                          val launcherHasCopy = try {
                              Class.forName(name, false, launcherLoader)
                              true
                          } catch (ignored: Throwable) {
                              false
                          }
                          GameClassLoaderBridge.noteRequest(name, launcherHasCopy)
                          throw ClassNotFoundException(name)
                      }
                      return try {
                          launcherLoader.loadClass(name)
                      } catch (e: ClassNotFoundException) {
                          // Not in the launcher either: the Minecraft loader will define Minecraft's own class.
                          GameClassLoaderBridge.noteRequest(name, false)
                          throw e
                      }
                  }
              }
          }
          '''

          GAME_COMPONENT_FACTORY_KT = r'''package org.levimc.launcher.core.minecraft

          import android.app.Activity
          import android.app.AppComponentFactory
          import android.content.Intent

          /**
           * Creates MinecraftActivity from the Minecraft ClassLoader (see GameClassLoaderBridge) so that
           * the activity, GameActivity and the JNI libraries all live in the same ClassLoader.
           * Every other component is created exactly as the platform would create it.
           *
           * Extends the platform AppComponentFactory (API 28+; the manifest attribute is ignored below that)
           * instead of androidx's CoreComponentFactory, whose override points differ between versions.
           */
          class GameComponentFactory : AppComponentFactory() {
              override fun instantiateActivity(
                  cl: ClassLoader,
                  className: String,
                  intent: Intent?
              ): Activity {
                  GameClassLoaderBridge.noteFactoryCall(className, cl)
                  GameClassLoaderBridge.newGameActivity(className)?.let { return it }
                  return super.instantiateActivity(cl, className, intent)
              }
          }
          '''

          GAME_DIAGNOSTICS_JAVA = r'''package org.levimc.launcher.core.minecraft;

          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.pm.ApplicationInfo;
