name: Build LeviLauncher ARMv7 V18 GameActivity JNI entrypoint retention APK (Android 10)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Mcpe workflow repository
        uses: actions/checkout@v4

      - name: Check out pinned LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: 38764ca77b4fcb9c27ab3cec688e67e5166141df
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Apply V18 JNI entrypoint retention fix and run V15 build recipe
        id: build
        shell: bash
        env:
          TEMPLATE_COMMIT: a4ac407be409c912c7450335d9852885d831dfd4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "PyYAML"],
                  check=True,
              )
              import yaml

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          v15_path = workspace / ".github/workflows/LeviLauncher-ARMv7-PairIP-workflow-v15-shared-namespace-fix.yml"
          if not v15_path.is_file():
              raise SystemExit("V15 build recipe is missing from the Mcpe repository; refusing to guess the project build steps")

          v15 = yaml.safe_load(v15_path.read_text(encoding="utf-8"))
          jobs = v15.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"Expected exactly one job in V15 workflow, got {len(jobs)}")
          v15_steps = next(iter(jobs.values())).get("steps", [])
          recipe = next((step for step in v15_steps if step.get("id") == "build" and "run" in step), None)
          if recipe is None:
              raise SystemExit("Could not find V15 build step with id=build; refusing to guess")

          script = recipe["run"]
          patch_anchor = '    print("Pre-build checks passed: native loader patch applied; Activity failure now preserves the original exception; debug R8 is disabled; targetSdk is 24 for Android 10 compatibility testing.")\n'
          if script.count(patch_anchor) != 1:
              raise SystemExit("Could not uniquely locate V15 pre-build validation block")

          # V18: link the AndroidX GameActivity implementation into libpreloader.so.
          # Force its exact Java JNI entrypoint to survive --gc-sections. V17 called
          # GameActivity_register from JNI_OnLoad, but that did not retain the separate
          # Java_* wrapper and its post-build check correctly failed.
          game_activity_patch = r'''
              cmake_text = cmake.read_text(encoding="utf-8")
              if "game-activity::game-activity_static" not in cmake_text:
                  link_anchor = "add_subdirectory(preloader)"
                  if cmake_text.count(link_anchor) != 1:
                      raise SystemExit("Could not uniquely locate add_subdirectory(preloader) for GameActivity link")
                  cmake_replacement = "\n".join([
                      "find_package(game-activity REQUIRED CONFIG)",
                      "add_subdirectory(preloader)",
                      "target_link_libraries(preloader PRIVATE game-activity::game-activity_static)",
                  ])
                  cmake_text = cmake_text.replace(link_anchor, cmake_replacement, 1)

              link_line = "target_link_libraries(preloader PRIVATE game-activity::game-activity_static)"
              force_symbol = 'target_link_options(preloader PRIVATE "LINKER:-u,Java_com_google_androidgamesdk_GameActivity_initializeNativeCode")'
              if link_line not in cmake_text:
                  raise SystemExit("GameActivity target link is missing; refusing to patch an unknown CMake layout")
              if force_symbol not in cmake_text:
                  cmake_text = cmake_text.replace(link_line, link_line + "\n" + force_symbol, 1)
              cmake.write_text(cmake_text, encoding="utf-8")
              if cmake_text.count("game-activity::game-activity_static") != 1:
                  raise SystemExit("GameActivity static library link is missing or duplicated")
              if cmake_text.count("Java_com_google_androidgamesdk_GameActivity_initializeNativeCode") != 1:
                  raise SystemExit("The linker-retention option for GameActivity.initializeNativeCode is missing or duplicated")

              # AndroidX static GameActivity also pulls native_app_glue, which references
              # android_main. This app starts via Java Activity, not NativeActivity, so
              # provide the linker-required no-op without using it as a game entrypoint.
              preloader_cpp = workspace / "source/app/src/main/cpp/preloader/src/pl/PreLoader.cpp"
              if not preloader_cpp.is_file():
                  raise SystemExit(f"Native preloader source is missing: {preloader_cpp}")
              preloader_text = preloader_cpp.read_text(encoding="utf-8")
              stub = '\nextern "C" void android_main(struct android_app *app) { (void)app; }\n'
              if 'extern "C" void android_main(struct android_app *app)' not in preloader_text:
                  include_anchor = '#include "pl/runtime/ModMenuBridge.h"\n'
                  if preloader_text.count(include_anchor) != 1:
                      raise SystemExit("Could not safely insert android_main link fallback")
                  preloader_text = preloader_text.replace(include_anchor, include_anchor + stub, 1)
              preloader_cpp.write_text(preloader_text, encoding="utf-8")
              print("V18 applied: GameActivity JNI symbol forced into libpreloader.so; android_main link fallback added.")

          '''
          script = script.replace(patch_anchor, game_activity_patch + patch_anchor, 1)

          # Verify the actual exported dynamic symbol and the exact Configuration-aware
          # method descriptor in the packaged ARMv7 library. A plain strings check alone
          # is insufficient because the wrapper can be garbage-collected.
          verify_anchor = '        script = script.replace(abi_marker, target_sdk_checks, 1)\n'
          if script.count(verify_anchor) != 1:
              raise SystemExit("Could not uniquely locate V15 APK verification insertion point")
          verify_patch = r'''
                  script = script.replace(abi_marker, target_sdk_checks, 1)
                  script += r"""
          set -euo pipefail
          APK="LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v18-gameactivity-entrypoint.apk"
          NATIVE="$RUNNER_TEMP/v18-libpreloader.so"
          unzip -p "$APK" lib/armeabi-v7a/libpreloader.so > "$NATIVE"
          test -s "$NATIVE"
          if ! readelf --dyn-syms --wide "$NATIVE" | awk '
            $4 == "FUNC" && $5 == "GLOBAL" && $7 != "UND" &&
            $8 == "Java_com_google_androidgamesdk_GameActivity_initializeNativeCode" { found = 1 }
            END { exit !found }
          '; then
              echo "::error::libpreloader.so does not export GameActivity.initializeNativeCode."
              readelf --dyn-syms --wide "$NATIVE" | grep -E 'GameActivity|initializeNativeCode' || true
              exit 1
          fi
          if ! strings "$NATIVE" | grep -Fq 'Landroid/content/res/Configuration;)J'; then
              echo "::error::libpreloader.so does not contain the Configuration-aware JNI descriptor."
              exit 1
          fi
          echo "Verified: GameActivity.initializeNativeCode is exported by the packaged ARMv7 library."
          """
          '''
          script = script.replace(verify_anchor, verify_patch, 1)

          # Ensure that this candidate has unique output names, while carrying forward
          # the V15 PairIP and native-loader fixes unchanged.
          script = script.replace("v15-single-pairip", "v18-gameactivity-entrypoint")
          script = script.replace("v15 single-PairIP", "v18 GameActivity JNI entrypoint")
          script = script.replace(
              "Build and static verification succeeded; launcher PairIP duplicate removed. Device launch remains unverified.",
              "Build and static verification succeeded; GameActivity JNI export verified. Device launch remains unverified.",
          )

          child_env = os.environ.copy()
          for key, value in (recipe.get("env") or {}).items():
              child_env[str(key)] = str(value)
          result = subprocess.run(script, shell=True, executable="/bin/bash", cwd=workspace, env=child_env)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PY

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-build-log-v18-gameactivity-entrypoint
          path: ${{ runner.temp }}/gradle-native-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload V18 ARMv7 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v18-gameactivity-entrypoint
          path: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v18-gameactivity-entrypoint.apk
          if-no-files-found: error
          retention-days: 7
