              private static String readText(String path, int maxBytes) {
                  FileInputStream in = null;
                  try {
                      in = new FileInputStream(path);
                      byte[] buf = new byte[maxBytes];
                      int n = in.read(buf);
                      return n <= 0 ? "" : new String(buf, 0, n, "UTF-8");
                  } catch (Throwable t) {
                      return "";
                  } finally {
                      if (in != null) {
                          try {
                              in.close();
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
