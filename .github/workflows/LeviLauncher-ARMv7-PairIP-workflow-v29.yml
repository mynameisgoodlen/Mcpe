                  sb.append("process is64Bit=").append(Process.is64Bit()).append(" pid=").append(myPid)
                          .append(" uid=").append(Process.myUid()).append('\n');
                  String[] props = {"ro.miui.ui.version.name", "ro.miui.ui.version.code", "ro.product.cpu.abilist",
