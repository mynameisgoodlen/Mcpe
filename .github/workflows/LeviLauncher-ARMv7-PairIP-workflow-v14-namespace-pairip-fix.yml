name: Build LeviLauncher ARMv7 V14 JNI namespace and single-PairIP fix (Android 10)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this builder workflow
        uses: actions/checkout@v4

      - name: Check out LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: 38764ca77b4fcb9c27ab3cec688e67e5166141df
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Fetch pinned recipe and build V14 GameActivity-namespace candidate
        id: build
        shell: bash
        env:
          TEMPLATE_COMMIT: a4ac407be409c912c7450335d9852885d831dfd4
        run: |
          set -euo pipefail
          TEMPLATE="$RUNNER_TEMP/LeviLauncher-ARMv7-PairIP-workflow-v5-template.yml"
          URL="https://raw.githubusercontent.com/mynameisgoodlen/Mcpe/${TEMPLATE_COMMIT}/.github/workflows/LeviLauncher-ARMv7-PairIP-workflow-v5.yml"
          curl --fail --silent --show-error --location "$URL" --retry 3 --retry-delay 2 -o "$TEMPLATE"
          test -s "$TEMPLATE"
          echo "Pinned recipe downloaded: $(wc -c < "$TEMPLATE") bytes"
          python3 - "$TEMPLATE" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "PyYAML"],
                  check=True,
              )
              import yaml

          template_path = Path(sys.argv[1])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          document = yaml.safe_load(template_path.read_text(encoding="utf-8"))
          jobs = document.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"Expected one job in pinned recipe; got {len(jobs)}")
          steps = next(iter(jobs.values())).get("steps", [])
          if not steps:
              raise SystemExit("Pinned build recipe has no steps")

          # Keep v8's PairIP branch patch and verifier fix; the final shared
          # class-loader step below routes the relevant libraries through one namespace.
          old_pairip_line = "i + '} else if (normalizedName == \"pairipcore\" || normalizedName == \"PlayFabMultiplayer\" || normalizedName == \"maesdk\") {',"
          new_pairip_lines = "\n".join([
              "i + '} else if (normalizedName == \"pairipcore\") {',",
              "                  i + '    initializeOfficialPairIp()',",
              "                  i + '} else if (normalizedName == \"PlayFabMultiplayer\" || normalizedName == \"maesdk\") {',",
          ])
          old_dex_check = (
              "loader_dex = z.read('assets/runtime-native-loader.dex')\n"
              "if not loader_dex.startswith(b'dex\\n') or len(loader_dex) < 100:\n"
              "    raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')"
          )
          new_dex_check = (
              "    loader_dex = z.read('assets/runtime-native-loader.dex')\n"
              "    if not loader_dex.startswith(b'dex\\n') or len(loader_dex) < 100:\n"
              "        raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')"
          )

          recipe_run_steps = []
          pairip_fix_count = 0
          dex_fix_count = 0
          for step in steps:
              if "run" not in step:
                  continue
              script = step["run"]
              recipe_name = str(step.get("name", ""))
              if recipe_name == "Bundle compressed ARMv7 PairIP dependency (self-contained workflow)":
                  install_line = 'install -m 0644 "$RUNNER_TEMP/libpairipcore.so" source/app/src/main/jniLibs/armeabi-v7a/libpairipcore.so'
                  if script.count(install_line) != 1:
                      raise SystemExit("Could not safely suppress the launcher's duplicate PairIP native payload")
                  script = script.replace(install_line, "# PairIP stays in the installed Minecraft package; do not bundle a second copy in LeviLauncher.", 1)
                  old_hash = "sha256sum source/app/src/main/jniLibs/armeabi-v7a/libpairipcore.so"
                  if script.count(old_hash) != 1:
                      raise SystemExit("Could not redirect PairIP hash check to its validated temporary file")
                  script = script.replace(old_hash, 'sha256sum "$RUNNER_TEMP/libpairipcore.so"', 1)
              if old_pairip_line in script:
                  if script.count(old_pairip_line) != 1:
                      raise SystemExit("PairIP branch patch was ambiguous; refusing to build")
                  script = script.replace(old_pairip_line, new_pairip_lines, 1)
                  pairip_fix_count += 1
              if old_dex_check in script:
                  if script.count(old_dex_check) != 1:
                      raise SystemExit("ZIP verifier patch was ambiguous; refusing to build")
                  script = script.replace(old_dex_check, new_dex_check, 1)
                  dex_fix_count += 1

              script = script.replace(
                  "LeviLauncher-ARMv7-build-log-v5", "LeviLauncher-ARMv7-build-log-v14-namespace-pairip-fix"
              )
              script = script.replace(
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk",
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v14-namespace-pairip-fix.apk",
              )
              script = script.replace(
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v5",
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v14-namespace-pairip-fix",
              )
              recipe_run_steps.append((step, script))

          if pairip_fix_count != 1:
              raise SystemExit(f"Expected exactly one PairIP loader patch; found {pairip_fix_count}")
          if dex_fix_count != 1:
              raise SystemExit(f"Expected exactly one ZIP verifier patch; found {dex_fix_count}")

          required_recipe_markers = (
              "PAIRIP_B64_00",
              "Bundle compressed ARMv7 PairIP dependency",
              "Extract and preload PlayFab and Mae dependencies before Minecraft",
              "Load the Minecraft native dependency chain with a shared game-parent classloader",
              "Compile standalone DEX entrypoint for the game-parent native loader",
              "Verify the APK targets ARMv7",
          )
          original_text = template_path.read_text(encoding="utf-8")
          missing = [marker for marker in required_recipe_markers if marker not in original_text]
          if missing:
              raise SystemExit("Pinned recipe is missing required sections: " + ", ".join(missing))

          any_failed = False
          build_failed = False
          run_count = 0

          def condition_allows(step):
              condition = str(step.get("if", "")).strip()
              if "always()" in condition:
                  return True
              if "failure()" in condition or "steps.build.outcome == 'failure'" in condition:
                  return any_failed or build_failed
              if "success()" in condition:
                  return not any_failed
              return not any_failed

          def prebuild_checks_and_safe_order():
              manager = workspace / "source/app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt"
              guard = workspace / "source/app/src/main/java/org/levimc/launcher/util/NativeImageGuard.java"
              cmake = workspace / "source/app/src/main/cpp/CMakeLists.txt"
              activity = workspace / "source/app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftActivity.kt"
              for f in (manager, guard, cmake, activity):
                  if not f.is_file():
                      raise SystemExit(f"Required source file missing before build: {f}")

              kotlin = manager.read_text(encoding="utf-8")

              # v8/v10 tombstones show the cached PairIP and installed Minecraft
              # PairIP mapped simultaneously. PlayFab is loaded from the cache and
              # has hidden PLT slots; keep its dependency tied to the already-initialized
              # Minecraft parent namespace instead of loading a second cached PairIP.
              dep_pattern = re.compile(r'(?ms)^    private val runtimeDependencyLibs = arrayOf\(\n.*?^    \)')
              dep_match = dep_pattern.search(kotlin)
              if not dep_match:
                  raise SystemExit("Could not find runtimeDependencyLibs to remove the duplicate PairIP entry")
              dep_block = dep_match.group(0)
              dep_line_pattern = re.compile(r'(?m)^[ \t]*"libpairipcore\.so",?[ \t]*\n')
              if dep_line_pattern.subn("", dep_block)[1] != 1:
                  raise SystemExit("Expected exactly one cached PairIP entry; refusing to build an ambiguous loader")
              dep_block = dep_line_pattern.sub("", dep_block, count=1)
              kotlin = kotlin[:dep_match.start()] + dep_block + kotlin[dep_match.end():]

              # Old cache directories survive APK updates. Delete the old cached copy
              # every run so it cannot shadow Minecraft's initialized PairIP.
              extraction_anchor = "        val apkFiles = collectApkFiles()\n"
              stale_pairip_cleanup = '''        val stalePairIp = File(outputDir, "libpairipcore.so")
                      if (stalePairIp.exists() && !stalePairIp.delete()) {
                          throw IOException("Cannot remove stale cached PairIP copy: ${stalePairIp.absolutePath}")
                      }
                      report("Removed stale cached PairIP copy; using Minecraft parent-loader PairIP")
                      val apkFiles = collectApkFiles()
              '''
              if kotlin.count(extraction_anchor) != 1:
                  raise SystemExit("Could not safely insert stale PairIP cache cleanup")
              kotlin = kotlin.replace(extraction_anchor, stale_pairip_cleanup, 1)

              # Keep official PairIP Java initialization on Minecraft's package ClassLoader.
              # Bind all extracted native libraries to GameActivity's defining ClassLoader
              # so JNI provider ownership is consistent across Minecraft, PlayFab and Mae.
              # Runtime.load(String, ClassLoader) is private and explicitly rejects targetSdk > 24
              # on Android 10. This sideloaded Android-10-only candidate lowers targetSdk to 24
              # and verifies the packaged manifest so the private API's explicit precondition holds.
              native_method_pattern = re.compile(
                  r'(?ms)^    private fun loadRuntimeNativeLibrary\(file: File\) \{\n.*?^    \}'
              )
              native_method_match = native_method_pattern.search(kotlin)
              if not native_method_match:
                  raise SystemExit("Could not find loadRuntimeNativeLibrary; refusing to guess")
              native_method = '''    private fun loadRuntimeNativeLibrary(file: File) {
                  if (!file.isFile || file.length() == 0L) {
                      throw UnsatisfiedLinkError("Native library is missing or empty: ${file.absolutePath}")
                  }
                  // MainActivity extends GameActivity in this APK. Register extracted JNI libraries
                  // through the class loader that defines GameActivity; do not split PlayFab/Mae
                  // into the separate installed-Minecraft packageContext namespace.
                  val targetLoader = com.google.androidgamesdk.GameActivity::class.java.classLoader
                      ?: throw UnsatisfiedLinkError("GameActivity defining ClassLoader is null")
                  val method = synchronized(runtimeNativeLoaderLock) {
                      runtimeNativeLoadMethod ?: java.lang.Runtime::class.java
                          .getDeclaredMethod("load", String::class.java, ClassLoader::class.java)
                          .apply { isAccessible = true }
                          .also { runtimeNativeLoadMethod = it }
                  }
                  report("Loading ${file.name} through GameActivity defining ClassLoader ${targetLoader.javaClass.name}: ${file.absolutePath}")
                  try {
                      method.invoke(java.lang.Runtime.getRuntime(), file.absolutePath, targetLoader)
                      report("Loaded ${file.name} through GameActivity ClassLoader namespace")
                  } catch (e: InvocationTargetException) {
                      val cause = e.targetException
                      if (cause is UnsatisfiedLinkError) throw cause
                      throw UnsatisfiedLinkError(
                          "GameActivity ClassLoader failed to load ${file.name}: ${cause.message ?: cause.javaClass.simpleName}"
                      ).also { it.initCause(cause) }
                  } catch (e: Exception) {
                      throw UnsatisfiedLinkError(
                          "Could not load ${file.name} through GameActivity ClassLoader: ${e.message ?: e.javaClass.simpleName}"
                      ).also { it.initCause(e) }
                  }
              }

              '''
              kotlin = kotlin[:native_method_match.start()] + native_method + kotlin[native_method_match.end():]
              # The earlier patch no longer needs its custom DEX ClassLoader import.
              kotlin = kotlin.replace('import dalvik.system.DexClassLoader\n', '')

              # Verify the actual implementation, not only that a loader patch exists.
              dep_match = dep_pattern.search(kotlin)
              if not dep_match or '"libpairipcore.so"' in dep_match.group(0):
                  raise SystemExit("PairIP is still present in the extracted runtime dependency list")
              if "stalePairIp.delete()" not in kotlin:
                  raise SystemExit("Stale PairIP cache cleanup missing")
              if "private fun loadRuntimeNativeLibrary(file: File)" not in kotlin:
                  raise SystemExit("GameActivity-namespace native loader method is missing")
              native_method_match = native_method_pattern.search(kotlin)
              if not native_method_match:
                  raise SystemExit("Could not verify the final native-loader method")
              native_method_text = native_method_match.group(0)
              for marker in (
                  'getDeclaredMethod("load", String::class.java, ClassLoader::class.java)',
                  'method.invoke(java.lang.Runtime.getRuntime(), file.absolutePath, targetLoader)',
                  'val targetLoader = com.google.androidgamesdk.GameActivity::class.java.classLoader',
                  'report("Loaded ${file.name} through GameActivity ClassLoader namespace")',
              ):
                  if marker not in native_method_text:
                      raise SystemExit("GameActivity ClassLoader loading is incomplete; missing: " + marker)
              if "DexClassLoader(" in native_method_text:
                  raise SystemExit("The custom child class-loader path remains")
              if 'import dalvik.system.DexClassLoader\n' in kotlin:
                  raise SystemExit("Unused isolated DexClassLoader import remains")
              if "private val runtimeDependencyLibs = arrayOf(" not in kotlin:
                  raise SystemExit("PlayFab/Mae extraction list is missing")
              for marker in (
                  '"libPlayFabMultiplayer.so"',
                  '"libmaesdk.so"',
                  'loadRuntimeNativeLibrary(libFile)',
              ):
                  if marker not in kotlin:
                      raise SystemExit("Runtime dependency loading is incomplete; missing: " + marker)
              # PairIP itself must be initialized through the installed Minecraft package loader.
              pairip_route = re.search(
                  r'(?ms)^[ \t]*\}\s*else if \(normalizedName == "pairipcore"\) \{\n'
                  r'(?P<body>.*?)^[ \t]*\}\s*else if \(normalizedName == "PlayFabMultiplayer" \|\| normalizedName == "maesdk"\) \{',
                  kotlin,
              )
              if not pairip_route or "initializeOfficialPairIp()" not in pairip_route.group("body") or "loadRuntimeNativeLibrary" in pairip_route.group("body"):
                  raise SystemExit("PairIP must use Minecraft's official package ClassLoader")
              runtime_route = re.search(
                  r'(?ms)^[ \t]*\}\s*else if \(normalizedName == "PlayFabMultiplayer" \|\| normalizedName == "maesdk"\) \{\n'
                  r'(?P<body>.*?)^[ \t]*\} else \{',
                  kotlin,
              )
              if not runtime_route or "loadRuntimeNativeLibrary(dependency)" not in runtime_route.group("body"):
                  raise SystemExit("PlayFab/Mae must load through the GameActivity ClassLoader")
              if "System.loadLibrary(normalizedName)" in runtime_route.group("body"):
                  raise SystemExit("PlayFab/Mae still bypass the Minecraft ClassLoader")

              # Fix the regression seen in v8: PlayFab/Mae were explicitly loaded
              # before libminecraftpe.so, and libPlayFabMultiplayer.so crashed in
              # native initialization. Keep them extracted and in the same search
              # path, but schedule their explicit System.load calls after Minecraft,
              # matching upstream dependency order while preserving the custom loader.
              order_pattern = re.compile(r'(?ms)^[ \t]*val allLibs = buildList \{\n.*?^[ \t]*\}\.distinct\(\)')
              order_replacement = '''        val allLibs = buildList {
                          // Initialize PairIP through Minecraft's official VMRunner first.
                          // Keep the known-safe V14 order: load Minecraft before PlayFab/Mae.
                          add("libpairipcore.so")
                          add("libc++_shared.so")
                          requiredLibs.filterNot { it == "libc++_shared.so" || it == "libminecraftpe.so" }.forEach { add(it) }
                          optionalLibs.forEach { add(it) }
                          add("libminecraftpe.so")
                          systemLoadedLibs.filterNot { it == "libpairipcore.so" }.forEach { add(it) }
                      }.distinct()'''
              kotlin, order_count = order_pattern.subn(order_replacement, kotlin, count=1)
              if order_count != 1:
                  raise SystemExit(f"Expected exactly one native load-order block; found {order_count}")
              block_start = kotlin.find("val allLibs = buildList {")
              block_end = kotlin.find("}.distinct()", block_start)
              if block_start < 0 or block_end < 0:
                  raise SystemExit("Could not verify final native load order")
              order_block = kotlin[block_start:block_end]
              pairip_pos = order_block.find('add("libpairipcore.so")')
              cxx_pos = order_block.find('add("libc++_shared.so")')
              minecraft_pos = order_block.find('add("libminecraftpe.so")')
              system_pos = order_block.find("systemLoadedLibs.filterNot")
              if pairip_pos < 0 or cxx_pos < 0 or pairip_pos > cxx_pos:
                  raise SystemExit("Official PairIP must initialize before extracted native libraries")
              if minecraft_pos < 0 or system_pos < 0 or minecraft_pos > system_pos:
                  raise SystemExit("Unsafe load order remains: PlayFab/Mae must follow Minecraft")
              if 'add("libPlayFabMultiplayer.so")' in order_block or 'add("libmaesdk.so")' in order_block:
                  raise SystemExit("PlayFab/Mae were still hard-coded ahead of Minecraft")
              if 'getDeclaredMethod("load", String::class.java, ClassLoader::class.java)' not in native_method_text:
                  raise SystemExit("The Android Runtime.load(path, classLoader) route is missing")
              if 'val targetLoader = com.google.androidgamesdk.GameActivity::class.java.classLoader' not in native_method_text:
                  raise SystemExit("Native libraries are not routed through GameActivity's defining ClassLoader")
              for loader_marker in (
                  "com.google.androidgamesdk.GameActivity::class.java.classLoader",
              ):
                  if loader_marker not in native_method_text:
                      raise SystemExit("Native loader branch is incomplete; missing: " + loader_marker)
              if "DexClassLoader(" in native_method_text:
                  raise SystemExit("An obsolete child-loader call remains inside the native-load method")

              # This candidate is pinned to an exact upstream source revision. Disable R8
              # for the debug variant so its DEX layout is not needlessly shrunk as in v10.
              app_gradle = workspace / "source/app/build.gradle"
              if not app_gradle.is_file():
                  raise SystemExit("Pinned v1.5.27 app/build.gradle is missing")
              gradle_text = app_gradle.read_text(encoding="utf-8")
              debug_start = gradle_text.find("    debug {")
              beta_start = gradle_text.find("    beta {", debug_start)
              if debug_start < 0 or beta_start < 0:
                  raise SystemExit("Could not isolate the debug build configuration")
              debug_block = gradle_text[debug_start:beta_start]
              if "minifyEnabled true" in debug_block:
                  patched_debug, changed = re.subn(
                      r'(?m)^(?P<indent>[ \t]*)minifyEnabled true[ \t]*$',
                      r'\g<indent>minifyEnabled false',
                      debug_block,
                      count=1,
                  )
                  if changed != 1:
                      raise SystemExit("Could not safely disable R8 for the debug variant")
                  gradle_text = gradle_text[:debug_start] + patched_debug + gradle_text[beta_start:]
                  app_gradle.write_text(gradle_text, encoding="utf-8")
                  debug_block = patched_debug
                  print("Disabled R8 shrinking for debug APK to avoid v10's reduced DEX payload.")
              if "minifyEnabled false" not in debug_block or "minifyEnabled true" in debug_block:
                  raise SystemExit("Debug R8 shrinking is enabled or ambiguous")

              # Android 10 Runtime.load(String, ClassLoader) rejects targetSdk > 24.
              # Keep this strictly an Android 10 sideload/debug test candidate.
              target_pattern = re.compile(r'(?m)^(?P<indent>[ \t]*)targetSdkVersion[ \t]+35[ \t]*$')
              gradle_text, target_count = target_pattern.subn(r'\g<indent>targetSdkVersion 24', gradle_text, count=1)
              if target_count != 1:
                  raise SystemExit(f"Expected exactly one targetSdkVersion 35 in pinned app/build.gradle; found {target_count}")
              if not re.search(r'(?m)^[ \t]*targetSdkVersion[ \t]+24[ \t]*$', gradle_text):
                  raise SystemExit("Target SDK 24 compatibility precondition was not applied")
              app_gradle.write_text(gradle_text, encoding="utf-8")

              manager.write_text(kotlin, encoding="utf-8")

              # The previous Java tombstone is a secondary lifecycle error: this catch
              # returns before MainActivity.onCreate(), hiding the original preparation
              # exception. Preserve the full cause for the next diagnostic run.
              activity_text = activity.read_text(encoding="utf-8")
              old_activity_failure_branch = "\n".join([
                  "        } catch (throwable: Throwable) {",
                  '            trace.error("MinecraftActivity prepare failed", formatLaunchFailure(throwable))',
                  "            returnToLauncherAfterLaunchFailure()",
                  "            return",
                  "        }",
              ])
              new_activity_failure_branch = "\n".join([
                  "        } catch (throwable: Throwable) {",
                  "            trace.error(",
                  '                "MinecraftActivity prepare failed",',
                  "                android.util.Log.getStackTraceString(throwable)",
                  "            )",
                  "            throw IllegalStateException(",
                  '                "MinecraftActivity runtime preparation failed before super.onCreate",',
                  "                throwable",
                  "            )",
                  "        }",
              ])
              if activity_text.count(old_activity_failure_branch) != 1:
                  raise SystemExit("Could not uniquely patch MinecraftActivity's early-return catch; refusing to build")
              activity_text = activity_text.replace(old_activity_failure_branch, new_activity_failure_branch, 1)
              if old_activity_failure_branch in activity_text:
                  raise SystemExit("The invalid early-return failure branch remains in MinecraftActivity")
              if "Log.getStackTraceString(throwable)" not in activity_text or "MinecraftActivity runtime preparation failed before super.onCreate" not in activity_text:
                  raise SystemExit("MinecraftActivity failure cause logging is incomplete")
              old_super_failure_branch = "\n".join([
                  "        } catch (throwable: Throwable) {",
                  '            trace.error("Mojang MainActivity super.onCreate failed", formatLaunchFailure(throwable))',
                  "            returnToLauncherAfterLaunchFailure()",
                  "            return",
                  "        }",
              ])
              new_super_failure_branch = "\n".join([
                  "        } catch (throwable: Throwable) {",
                  "            val fullStackTrace = android.util.Log.getStackTraceString(throwable)",
                  '            trace.error("Mojang MainActivity super.onCreate failed", fullStackTrace)',
                  '            android.util.Log.e("MinecraftActivity", "Mojang MainActivity.onCreate failed", throwable)',
                  "            throw IllegalStateException(",
                  '                "Mojang MainActivity.onCreate failed",',
                  "                throwable",
                  "            )",
                  "        }",
              ])
              if activity_text.count(old_super_failure_branch) != 1:
                  raise SystemExit("Could not uniquely patch Mojang MainActivity.onCreate catch")
              activity_text = activity_text.replace(old_super_failure_branch, new_super_failure_branch, 1)
              if 'trace.error("Mojang MainActivity super.onCreate failed", fullStackTrace)' not in activity_text:
                  raise SystemExit("Full GameActivity exception stack trace logging is missing")

              # Load/check JNI provider immediately before calling GameActivity.onCreate.
              super_call_anchor = "\n".join([
                  "        try {",
                  "            gameRuntimeStarted = true",
                  "            super.onCreate(savedInstanceState)",
              ])
              super_call_replacement = "\n".join([
                  "        try {",
                  '            val gameActivityJniProvider = gameManager.loadLibraryDetailed("minecraftpe")',
                  "            if (!gameActivityJniProvider.loaded) {",
                  '                throw IllegalStateException("Failed to load libminecraftpe.so before GameActivity.onCreate: " + (gameActivityJniProvider.detail ?: "unknown error"))',
                  "            }",
                  '            trace.mark("libminecraftpe preloaded before GameActivity.onCreate", gameActivityJniProvider.detail ?: "already loaded")',
                  "            gameRuntimeStarted = true",
                  "            super.onCreate(savedInstanceState)",
              ])
              if activity_text.count(super_call_anchor) != 1:
                  raise SystemExit("Could not uniquely locate pre-super GameActivity JNI provider load")
              activity_text = activity_text.replace(super_call_anchor, super_call_replacement, 1)
              if activity_text.index('gameManager.loadLibraryDetailed("minecraftpe")') >= activity_text.index("super.onCreate(savedInstanceState)"):
                  raise SystemExit("libminecraftpe.so must load before GameActivity.onCreate")
              activity.write_text(activity_text, encoding="utf-8")
              print("Preloaded libminecraftpe.so through GameActivity's defining loader before super.onCreate.")

              # Preserve the full Java cause when runtime preparation fails in the loading activity.
              # The previous candidate displayed only throwable.message, hiding the useful cause chain.
              loading_activity = workspace / "source/app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftLoadingActivity.kt"
              if not loading_activity.is_file():
                  raise SystemExit(f"Required source file missing before diagnostics patch: {loading_activity}")
              loading_text = loading_activity.read_text(encoding="utf-8")
              old_show_failure = "\n".join([
                  "    private fun showFailure(throwable: Throwable) {",
                  "        if (isFinishing || isDestroyed) return",
                  "        val message = throwable.message ?: throwable.javaClass.simpleName",
                  "        updateProgress(100, getString(R.string.minecraft_loading_failed), null)",
                  "        detailView.visibility = View.GONE",
                  '        trace.error("Launch failed", message)',
                  '        appendLog("Launch failed")',
                  "        appendLog(message)",
                  "        returnButton.visibility = View.VISIBLE",
                  "    }",
              ])
              new_show_failure = "\n".join([
                  "    private fun showFailure(throwable: Throwable) {",
                  "        if (isFinishing || isDestroyed) return",
                  "        val message = throwable.message ?: throwable.javaClass.simpleName",
                  "        val stackTrace = android.util.Log.getStackTraceString(throwable)",
                  "        updateProgress(100, getString(R.string.minecraft_loading_failed), null)",
                  "        detailView.visibility = View.GONE",
                  '        trace.error("Launch failed", stackTrace)',
                  '        appendLog("Launch failed")',
                  "        appendLog(message)",
                  "        appendLog(stackTrace)",
                  "        returnButton.visibility = View.VISIBLE",
                  "    }",
              ])
              if loading_text.count(old_show_failure) != 1:
                  raise SystemExit("Could not uniquely patch MinecraftLoadingActivity.showFailure; refusing to build")
              loading_text = loading_text.replace(old_show_failure, new_show_failure, 1)
              if 'trace.error("Launch failed", stackTrace)' not in loading_text or "appendLog(stackTrace)" not in loading_text:
                  raise SystemExit("Full Java cause logging was not applied")
              loading_activity.write_text(loading_text, encoding="utf-8")
              print("Patched loading failure UI to show and log the full Java exception stack, not only its top-level message.")

              guard_text = guard.read_text(encoding="utf-8")
              if 'if (soFile != null && "libpairipcore.so".equals(soFile.getName())) return false;' not in guard_text:
                  raise SystemExit("PairIP scan/rewrite exclusion is missing")
              if "ARMV7_REQUIRE_REAL_GXCORE" in cmake.read_text(encoding="utf-8"):
                  raise SystemExit("Obsolete deliberate CMake blocker is present")
              if "ARMV7_GXCORE_COMPAT_SHIM" not in cmake.read_text(encoding="utf-8"):
                  raise SystemExit("Expected ARMv7 compatibility shim was not installed")
              print("Pre-build checks passed: unified GameActivity native namespace, pre-super libminecraftpe load, PairIP official initializer, V14 order, targetSdk 24.")

          for step, script in recipe_run_steps:
              name = str(step.get("name", "unnamed recipe step"))
              step_id = str(step.get("id", ""))
              if not condition_allows(step):
                  print(f"::notice::Skipping recipe step after prior failure: {name}")
                  continue
              if step_id == "build":
                  prebuild_checks_and_safe_order()

              working = str(step.get("working-directory", ".")).replace("$" + "{{ github.workspace }}", str(workspace))
              cwd = Path(working)
              if not cwd.is_absolute():
                  cwd = workspace / cwd
              if not cwd.is_dir():
                  raise SystemExit(f"Working directory missing for '{name}': {cwd}")

              script = script.replace("$" + "{{ runner.temp }}", os.environ.get("RUNNER_TEMP", "/tmp"))
              script = script.replace("$" + "{{ github.workspace }}", str(workspace))
              if name == "Build debug APK for ARMv7 and capture all output":
                  build_marker = './gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee "$LOG"'
                  if script.count(build_marker) != 1:
                      raise SystemExit("Could not patch the exact debug Gradle command to bypass expired-target lint")
                  script = script.replace(
                      build_marker,
                      './gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug -x :app:lintVitalDebug 2>&1 | tee "$LOG"',
                      1,
                  )
                  print("Skipping only lintVitalDebug: targetSdk 24 is intentionally required for this Android 10 test candidate.")
              if name == "Verify the APK targets ARMv7":
                  old_verify_call = "python3 - 'LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v14-namespace-pairip-fix.apk' 'source/app/src/main/jniLibs/armeabi-v7a/libpairipcore.so' <<'PY'"
                  new_verify_call = "python3 - 'LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v14-namespace-pairip-fix.apk' <<'PY'"
                  if script.count(old_verify_call) != 1:
                      raise SystemExit("Could not uniquely update APK verifier for single-PairIP packaging")
                  script = script.replace(old_verify_call, new_verify_call, 1)
                  expected_line = "expected_pairip = pathlib.Path(sys.argv[2]).read_bytes()\n"
                  if script.count(expected_line) != 1:
                      raise SystemExit("Could not remove obsolete packaged PairIP byte comparison")
                  script = script.replace(expected_line, "", 1)
                  pairip_required_line = "    'lib/armeabi-v7a/libpairipcore.so',\n"
                  if script.count(pairip_required_line) != 1:
                      raise SystemExit("Could not remove PairIP from the APK's required native payload list")
                  script = script.replace(pairip_required_line, "", 1)
                  old_pairip_block = "\n".join([
                      "    packaged_pairip = z.read('lib/armeabi-v7a/libpairipcore.so')",
                      "    if packaged_pairip != expected_pairip:",
                      "        raise SystemExit('Packaged libpairipcore.so differs from the verified source; check that stripping/rewriting is disabled.')",
                      "    if packaged_pairip[:4] != b'\\x7fELF' or packaged_pairip[4] != 1 or int.from_bytes(packaged_pairip[18:20], 'little') != 40:",
                      "        raise SystemExit('Packaged libpairipcore.so is not a 32-bit ARM ELF')",
                  ])
                  new_pairip_block = "\n".join([
                      "    if 'lib/armeabi-v7a/libpairipcore.so' in names:",
                      "        raise SystemExit('Launcher APK contains a duplicate PairIP runtime; expected official Minecraft copy only.')",
                  ])
                  if script.count(old_pairip_block) != 1:
                      raise SystemExit("Could not replace packaged-PairIP verification block")
                  script = script.replace(old_pairip_block, new_pairip_block, 1)
                  script = script.replace(
                      "Verified ARMv7 gxcore, libc++, byte-identical PairIP, and runtime-loader DEX in",
                      "Verified ARMv7 gxcore/libc++, no bundled PairIP duplicate, and runtime-loader DEX in",
                      1,
                  )
                  abi_marker = """grep -q "native-code: 'armeabi-v7a'" /tmp/apk-badging.txt"""
                  if abi_marker not in script:
                      raise SystemExit("Could not add targetSdk manifest check to APK verification")
                  target_sdk_checks = "\n".join([
                      abi_marker,
                      "grep -q \"targetSdkVersion:'24'\" /tmp/apk-badging.txt",
                      "echo \"Verified target SDK 24 for Android 10 Runtime.load(ClassLoader) compatibility.\"",
                  ])
                  script = script.replace(abi_marker, target_sdk_checks, 1)
              if ("$" + "{{") in script:
                  raise SystemExit(f"Unsupported GitHub expression left in recipe step: {name}")

              child_env = os.environ.copy()
              for key, value in (step.get("env") or {}).items():
                  child_env[str(key)] = str(value)

              print(f"\n::group::v14 diagnostic recipe step: {name}")
              run_count += 1
              result = subprocess.run(script, shell=True, executable="/bin/bash", cwd=cwd, env=child_env)
              print("::endgroup::")
              if result.returncode != 0:
                  print(f"::error::Recipe step failed ({result.returncode}): {name}")
                  any_failed = True
                  if step_id == "build":
                      build_failed = True

          if run_count < 9:
              raise SystemExit(f"Too few shell steps were executed ({run_count}); refusing to call this build complete")
          if any_failed:
              raise SystemExit("One or more v14 build steps failed; inspect the uploaded build log")
          print("Build and static verification succeeded; on-device startup and PlayFab initialization remain unverified.")
          PY

      - name: Upload full build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-build-log-v14-namespace-pairip-fix
          path: ${{ runner.temp }}/gradle-native-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload installable ARMv7 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v14-namespace-pairip-fix
          path: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v14-namespace-pairip-fix.apk
          if-no-files-found: error
          retention-days: 7
