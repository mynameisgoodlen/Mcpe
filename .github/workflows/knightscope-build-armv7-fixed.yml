name: Build KnightScope armeabi-v7a APK

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: Repository path to the APK (used when no release tag is supplied)
        required: false
        default: input/KnightScope-debug-arm64.apk
        type: string
      apk_release_tag:
        description: Optional release tag containing the APK asset (recommended for large APKs)
        required: false
        type: string
      apk_release_asset:
        description: Exact APK asset filename attached to that GitHub Release
        required: false
        default: KnightScope-debug-arm64.apk
        type: string

permissions:
  contents: read

env:
  STOCKFISH_TAG: sf_19
  ANDROID_API: "26"
  NDK_VERSION: "27.2.12479018"
  APKTOOL_VERSION: "3.0.3"
  ANDROIDX_GRAPHICS_PATH_VERSION: "1.0.1"

jobs:
  build:
    name: Rebuild for 32-bit ARM
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository (including Git LFS files)
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install host tools and Android packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils curl file git make python3 qemu-user unzip zip
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=${ANDROID_HOME}/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: Validate input APK and download Apktool
        id: input
        shell: bash
        env:
          APK_PATH_INPUT: ${{ inputs.apk_path }}
          APK_RELEASE_TAG: ${{ inputs.apk_release_tag }}
          APK_RELEASE_ASSET: ${{ inputs.apk_release_asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/work" "$RUNNER_TEMP/input" "$GITHUB_WORKSPACE/dist"

          # A file attached to the ChatGPT conversation is NOT automatically
          # available to GitHub Actions. Supply it either in the checked-out
          # repository or as an asset on a release in this same repository.
          if [[ -n "${APK_RELEASE_TAG//[[:space:]]/}" ]]; then
            echo "Downloading APK asset '$APK_RELEASE_ASSET' from release '$APK_RELEASE_TAG'..."
            gh release download "$APK_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$APK_RELEASE_ASSET" \
              --dir "$RUNNER_TEMP/input"
            APK_PATH="$RUNNER_TEMP/input/$APK_RELEASE_ASSET"
          else
            APK_PATH="$APK_PATH_INPUT"
            if [[ ! -f "$APK_PATH" && -f "$GITHUB_WORKSPACE/$(basename "$APK_PATH")" ]]; then
              APK_PATH="$GITHUB_WORKSPACE/$(basename "$APK_PATH")"
            fi
          fi

          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: Original APK not found." >&2
            echo "Checked repository path: $APK_PATH_INPUT" >&2
            echo "" >&2
            echo "Fix one of these ways:" >&2
            echo "  1. Add the APK to the repository at: $APK_PATH_INPUT" >&2
            echo "     (commit/push it; a file on your computer or in the ChatGPT chat is not visible to Actions)." >&2
            echo "  2. Upload it as an asset to a GitHub Release in this repository, then rerun with" >&2
            echo "     apk_release_tag=<release tag> and apk_release_asset=<exact asset filename>." >&2
            echo "" >&2
            echo "APK files currently present in the checkout:" >&2
            find "$GITHUB_WORKSPACE" -type f -iname '*.apk' -not -path '*/.git/*' -print >&2 || true
            exit 1
          fi

          APK_PATH="$(realpath "$APK_PATH")"
          if grep -aq '^version https://git-lfs.github.com/spec/v1$' "$APK_PATH"; then
            echo "APK path contains a Git LFS pointer, not the downloaded APK bytes." >&2
            echo "Ensure checkout is configured with lfs: true and the repository LFS object exists." >&2
            exit 1
          fi
          if [[ ! -s "$APK_PATH" ]]; then
            echo "APK file is empty: $APK_PATH" >&2
            exit 1
          fi
          unzip -tq "$APK_PATH" >/dev/null
          echo "Using APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          printf 'apk_path=%s\n' "$APK_PATH" >> "$GITHUB_OUTPUT"

          curl -fsSL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
            -o "$RUNNER_TEMP/tools/apktool.jar"
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/tools/apktool.jar" \
            | sha256sum --check --status
          java -jar "$RUNNER_TEMP/tools/apktool.jar" --version

      - name: Build Stockfish 19 for generic ARMv7
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$STOCKFISH_TAG" \
            https://github.com/official-stockfish/Stockfish.git \
            "$RUNNER_TEMP/work/Stockfish"

          STOCKFISH_SRC="$RUNNER_TEMP/work/Stockfish/src"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$NDK_BIN/armv7a-linux-androideabi${ANDROID_API}-clang++"
          LLVM_STRIP="$NDK_BIN/llvm-strip"
          test -x "$CXX"
          test -x "$LLVM_STRIP"

          # The sf_19 NDK stanza adds -mfpu=neon to every ARMv7 build.
          # Replace only that flag so ARCH=armv7 is genuinely baseline ARMv7
          # and does not require optional NEON instructions on the phone.
          python3 - "$STOCKFISH_SRC/Makefile" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text()
          old = "CXXFLAGS += -mthumb -march=armv7-a -mfloat-abi=softfp -mfpu=neon"
          new = "CXXFLAGS += -mthumb -march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16"
          if text.count(old) != 1:
              raise SystemExit("Unexpected Stockfish sf_19 Makefile: ARMv7 NDK flags were not found exactly once")
          p.write_text(text.replace(old, new))
          PY

          # Download and embed the exact sf_19 default NNUE network.
          make -C "$STOCKFISH_SRC" net
          make -C "$STOCKFISH_SRC" clean
          make -C "$STOCKFISH_SRC" -j"$(nproc)" build \
            ARCH=armv7 COMP=ndk COMPCXX="$CXX"
          make -C "$STOCKFISH_SRC" strip \
            ARCH=armv7 COMP=ndk COMPCXX="$CXX" STRIP="$LLVM_STRIP"

          ENGINE="$STOCKFISH_SRC/stockfish"
          test -s "$ENGINE"
          readelf -h "$ENGINE" | tee "$RUNNER_TEMP/work/engine-elf.txt"
          grep -q 'Class:.*ELF32' "$RUNNER_TEMP/work/engine-elf.txt"
          grep -q 'Machine:.*ARM' "$RUNNER_TEMP/work/engine-elf.txt"

          mkdir -p "$RUNNER_TEMP/work/native/armeabi-v7a"
          install -m 0755 "$ENGINE" \
            "$RUNNER_TEMP/work/native/armeabi-v7a/libstockfish.so"

          # Package the NDK's shared C++ runtime only if the resulting engine
          # actually links against it. Android system libraries stay system-provided.
          if readelf -d "$ENGINE" 2>/dev/null | grep -q 'libc++_shared.so'; then
            LIBCXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so"
            test -s "$LIBCXX"
            install -m 0755 "$LIBCXX" "$RUNNER_TEMP/work/native/armeabi-v7a/libc++_shared.so"
          fi
          echo "engine_path=$RUNNER_TEMP/work/native/armeabi-v7a/libstockfish.so" >> "$GITHUB_OUTPUT"

      - name: Try running ARMv7 Stockfish under QEMU (UCI smoke test)
        id: qemu
        continue-on-error: true
        shell: bash
        env:
          ENGINE: ${{ steps.engine.outputs.engine_path }}
        run: |
          set -euo pipefail
          SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          python3 - "$ENGINE" "$SYSROOT" <<'PY'
          import os, queue, subprocess, sys, threading, time

          engine, sysroot = sys.argv[1:]
          command = ["qemu-arm", "-L", sysroot, engine]
          proc = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                  stderr=subprocess.PIPE, text=True, bufsize=1)
          lines = queue.Queue()
          def reader():
              for line in proc.stdout:
                  lines.put(line.rstrip())
          threading.Thread(target=reader, daemon=True).start()

          def send(command):
              proc.stdin.write(command + "\n")
              proc.stdin.flush()

          def wait_for(token, timeout=30):
              deadline = time.monotonic() + timeout
              seen = []
              while time.monotonic() < deadline:
                  try:
                      line = lines.get(timeout=0.5)
                      print(line, flush=True)
                      seen.append(line)
                      if token in line:
                          return
                  except queue.Empty:
                      if proc.poll() is not None:
                          break
              raise RuntimeError(f"Did not receive {token!r}; recent output: {seen[-20:]}")

          try:
              send("uci")
              wait_for("uciok")
              send("isready")
              wait_for("readyok")
              send("position startpos")
              send("go depth 2")
              wait_for("bestmove", timeout=45)
              send("quit")
              proc.wait(timeout=5)
              print("QEMU UCI smoke test passed")
          except Exception as exc:
              proc.kill()
              stderr = proc.stderr.read() if proc.stderr else ""
              print(f"QEMU UCI smoke test did not pass: {exc}", file=sys.stderr)
              if stderr:
                  print(stderr, file=sys.stderr)
              sys.exit(1)
          PY

      - name: Fetch AndroidX Graphics Path 1.0.1 ARMv7 library
        shell: bash
        env:
          APK_PATH: ${{ steps.input.outputs.apk_path }}
        run: |
          set -euo pipefail
          AAR="$RUNNER_TEMP/work/graphics-path.aar"
          URL="https://dl.google.com/dl/android/maven2/androidx/graphics/graphics-path/${ANDROIDX_GRAPHICS_PATH_VERSION}/graphics-path-${ANDROIDX_GRAPHICS_PATH_VERSION}.aar"
          curl -fL "$URL" -o "$AAR"

          # Prove this is the same AndroidX binary version used by the input APK.
          unzip -p "$APK_PATH" lib/arm64-v8a/libandroidx.graphics.path.so \
            > "$RUNNER_TEMP/work/original-graphics-path-arm64.so"
          unzip -p "$AAR" jni/arm64-v8a/libandroidx.graphics.path.so \
            > "$RUNNER_TEMP/work/aar-graphics-path-arm64.so"
          cmp "$RUNNER_TEMP/work/original-graphics-path-arm64.so" \
              "$RUNNER_TEMP/work/aar-graphics-path-arm64.so"

          unzip -l "$AAR" | grep 'jni/armeabi-v7a/libandroidx.graphics.path.so'
          unzip -p "$AAR" jni/armeabi-v7a/libandroidx.graphics.path.so \
            > "$RUNNER_TEMP/work/native/armeabi-v7a/libandroidx.graphics.path.so"
          test -s "$RUNNER_TEMP/work/native/armeabi-v7a/libandroidx.graphics.path.so"
          readelf -h "$RUNNER_TEMP/work/native/armeabi-v7a/libandroidx.graphics.path.so" \
            | grep -E 'Class:.*ELF32|Machine:.*ARM'
          chmod 0755 "$RUNNER_TEMP/work/native/armeabi-v7a/libandroidx.graphics.path.so"

      - name: Decode APK and patch the ARM ABI check
        shell: bash
        env:
          APK_PATH: ${{ steps.input.outputs.apk_path }}
        run: |
          set -euo pipefail
          DECODED="$RUNNER_TEMP/work/decoded"
          java -jar "$RUNNER_TEMP/tools/apktool.jar" d -f "$APK_PATH" -o "$DECODED"

          # The reverse-engineered APK has one literal ABI gate and one matching
          # 64-bit-only warning inside the UciEngine launcher. Fail closed if the
          # DEX/smali layout differs from the analysed APK.
          python3 - "$DECODED" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          abi_old = '"arm64-v8a"'
          abi_new = '"armeabi-v7a"'
          message_old = "This Stockfish build currently supports 64-bit ARM Android devices."
          message_new = "This Stockfish build currently supports 32-bit ARM Android devices."

          candidates = []
          for path in root.glob("smali*/**/*.smali"):
              data = path.read_text(errors="replace")
              if abi_old in data:
                  candidates.append((path, data))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one smali file containing {abi_old}, found {len(candidates)}")
          path, data = candidates[0]
          if data.count(abi_old) != 1:
              raise SystemExit(f"Expected exactly one ABI string in {path}, found {data.count(abi_old)}")
          if data.count(message_old) != 1:
              raise SystemExit(f"Expected exactly one 64-bit warning in {path}, found {data.count(message_old)}")
          data = data.replace(abi_old, abi_new, 1).replace(message_old, message_new, 1)
          path.write_text(data)
          print(f"Patched ABI gate in {path.relative_to(root)}")
          PY

          # Produce an ARMv7-only APK. This avoids advertising arm64 support while
          # the launcher guard now explicitly targets armeabi-v7a.
          rm -rf "$DECODED/lib/arm64-v8a"
          mkdir -p "$DECODED/lib/armeabi-v7a"
          install -m 0755 "$RUNNER_TEMP/work/native/armeabi-v7a/libstockfish.so" \
            "$DECODED/lib/armeabi-v7a/libstockfish.so"
          cp -a "$RUNNER_TEMP/work/native/armeabi-v7a/." "$DECODED/lib/armeabi-v7a/"

      - name: Rebuild and sign APK
        shell: bash
        run: |
          set -euo pipefail
          DECODED="$RUNNER_TEMP/work/decoded"
          UNSIGNED="$RUNNER_TEMP/work/KnightScope-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/work/KnightScope-aligned.apk"
          SIGNED="$GITHUB_WORKSPACE/dist/KnightScope-armeabi-v7a.apk"
          KEYSTORE="$RUNNER_TEMP/work/knightscope-debug.jks"

          java -jar "$RUNNER_TEMP/tools/apktool.jar" b "$DECODED" -o "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" -storepass android -keypass android \
            -alias knightscope -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KnightScope ARMv7 CI,O=Local Build,C=IN"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias knightscope \
            --ks-pass pass:android --key-pass pass:android \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

      - name: Validate final APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/dist/KnightScope-armeabi-v7a.apk"
          unzip -Z1 "$APK" | tee "$RUNNER_TEMP/work/apk-entries.txt"
          grep -qx 'lib/armeabi-v7a/libstockfish.so' "$RUNNER_TEMP/work/apk-entries.txt"
          grep -qx 'lib/armeabi-v7a/libandroidx.graphics.path.so' "$RUNNER_TEMP/work/apk-entries.txt"
          if readelf -d "$RUNNER_TEMP/work/native/armeabi-v7a/libstockfish.so" 2>/dev/null | grep -q 'libc++_shared.so'; then
            grep -qx 'lib/armeabi-v7a/libc++_shared.so' "$RUNNER_TEMP/work/apk-entries.txt"
          fi
          if grep -q '^lib/arm64-v8a/' "$RUNNER_TEMP/work/apk-entries.txt"; then
            echo "Unexpected arm64 native payload remains in ARMv7-only APK" >&2
            exit 1
          fi
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/work/badging.txt"
          grep -q "package: name='com.knightscope.review'" "$RUNNER_TEMP/work/badging.txt"
          echo "Verified ARMv7-only APK: $APK"

      - name: Bundle matching Stockfish source and NNUE network
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/work/Stockfish-source"
          mkdir -p "$SOURCE_DIR"
          git -C "$RUNNER_TEMP/work/Stockfish" archive --format=tar "$STOCKFISH_TAG" \
            | tar -xf - -C "$SOURCE_DIR"
          # Include the exact Makefile adjustment used for the generic ARMv7 build,
          # plus the NNUE file embedded into the engine binary.
          cp "$RUNNER_TEMP/work/Stockfish/src/Makefile" "$SOURCE_DIR/src/Makefile"
          cp "$RUNNER_TEMP/work/Stockfish/src/nn-1a298aa575a0.nnue" "$SOURCE_DIR/src/"
          tar -czf "$GITHUB_WORKSPACE/dist/Stockfish-${STOCKFISH_TAG}-ARMv7-source.tar.gz" \
            -C "$SOURCE_DIR" .

      - name: Upload APK and source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KnightScope-armeabi-v7a
          path: |
            dist/KnightScope-armeabi-v7a.apk
            dist/Stockfish-sf_19-ARMv7-source.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        env:
          QEMU_OUTCOME: ${{ steps.qemu.outcome }}
        run: |
          {
            echo "## KnightScope ARMv7 build"
            echo
            printf '%s\n' '- Target ABI: `armeabi-v7a` (generic ARMv7 / VFPv3-D16; no NEON requirement)'
            printf -- '- Stockfish: `%s`\n' "$STOCKFISH_TAG"
            printf -- '- Android API used for native build: `%s`\n' "$ANDROID_API"
            printf -- '- QEMU engine smoke test: `%s`\n' "${QEMU_OUTCOME:-not run}"
            echo
            echo "The QEMU check runs the native engine and UCI handshake only. It does not replace installation/testing on a physical 32-bit ARM Android device."
          } >> "$GITHUB_STEP_SUMMARY"
