name: Build LeviLauncher ARMv7 PairIP class-loader APK v5

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this builder workflow
        uses: actions/checkout@v4

      - name: Check out LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: main
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Bundle compressed ARMv7 PairIP dependency (self-contained workflow)
        shell: bash
        env:
          PAIRIP_B64_00: ''
          PAIRIP_B64_01: ''
          PAIRIP_B64_02: ''
          PAIRIP_B64_03: ''
          PAIRIP_B64_04: ''
          PAIRIP_B64_05: ''
          PAIRIP_B64_06: ''
          PAIRIP_B64_07: ''
          PAIRIP_B64_08: ''
          PAIRIP_B64_09: ''
          PAIRIP_B64_10: ''
          PAIRIP_B64_11: ''
          PAIRIP_B64_12: ''
          PAIRIP_B64_13: ''
          PAIRIP_B64_14: ''
          PAIRIP_B64_15: ''
          PAIRIP_B64_16: ''
          PAIRIP_B64_17: ''
          PAIRIP_B64_18: ''
          PAIRIP_B64_19: ''
          PAIRIP_B64_20: ''
          PAIRIP_B64_21: ''
          PAIRIP_B64_22: ''
          PAIRIP_B64_23: ''
          PAIRIP_B64_24: ''
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/pairipcore-assets.zip" <<'PY'
          import base64, pathlib, sys, os
          parts = ['PAIRIP_B64_00', 'PAIRIP_B64_01', 'PAIRIP_B64_02', 'PAIRIP_B64_03', 'PAIRIP_B64_04', 'PAIRIP_B64_05', 'PAIRIP_B64_06', 'PAIRIP_B64_07', 'PAIRIP_B64_08', 'PAIRIP_B64_09', 'PAIRIP_B64_10', 'PAIRIP_B64_11', 'PAIRIP_B64_12', 'PAIRIP_B64_13', 'PAIRIP_B64_14', 'PAIRIP_B64_15', 'PAIRIP_B64_16', 'PAIRIP_B64_17', 'PAIRIP_B64_18', 'PAIRIP_B64_19', 'PAIRIP_B64_20', 'PAIRIP_B64_21', 'PAIRIP_B64_22', 'PAIRIP_B64_23', 'PAIRIP_B64_24']
          encoded = ''.join(os.environ[name] for name in parts)
          payload = base64.b64decode(encoded, validate=True)
          pathlib.Path(sys.argv[1]).write_bytes(payload)
          print(f'Wrote embedded compressed asset ZIP: {len(payload)} bytes')
          PY
          python3 - "$RUNNER_TEMP/pairipcore-assets.zip" "$RUNNER_TEMP/libpairipcore.so" <<'PY'
          import hashlib, pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as z:
              matches = [n for n in z.namelist() if n == 'assets/libpairipcore.so']
              if len(matches) != 1:
                  raise SystemExit('Embedded asset ZIP must contain exactly assets/libpairipcore.so')
              data = z.read(matches[0])
          expected = '44ebb64e14ccb3ddb75090f9aef7b00c2e7bfa712ea1843d5f1d3d1ccdccfcbd'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Embedded PairIP SHA-256 mismatch: {actual}')
          if len(data) < 20 or data[:4] != b'\x7fELF' or data[4] != 1 or data[5] != 1 or int.from_bytes(data[18:20], 'little') != 40:
              raise SystemExit('Embedded PairIP library is not little-endian ARMv7 ELF32')
          output.write_bytes(data)
          print(f'Validated embedded PairIP: {len(data)} bytes; SHA-256 {actual}')
          PY
          mkdir -p source/app/src/main/jniLibs/armeabi-v7a
          install -m 0644 "$RUNNER_TEMP/libpairipcore.so" source/app/src/main/jniLibs/armeabi-v7a/libpairipcore.so
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          marker = '"**/libinbuiltmods.so"'
          addition = '"**/libpairipcore.so"'
          if addition not in s:
              if s.count(marker) != 1:
                  raise SystemExit('Could not safely update keepDebugSymbols in app/build.gradle')
              s = s.replace(marker, marker + ',\n                    ' + addition, 1)
              p.write_text(s, encoding='utf-8')
          print('Configured packaging to preserve PairIP library bytes.')
          PY
          sha256sum source/app/src/main/jniLibs/armeabi-v7a/libpairipcore.so

      - name: Configure source for ARMv7 and avoid desktop-only LevelDB utility
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Make the app target 32-bit ARM for this experimental build.
          gradle_file = Path('app/build.gradle')
          s = gradle_file.read_text(encoding='utf-8')
          old = "abiFilters 'arm64-v8a'"
          if s.count(old) != 1:
              raise SystemExit(
                  f'Expected exactly one ABI filter {old!r}; found {s.count(old)}. '
                  'Upstream may have changed; refusing to patch the wrong file.'
              )
          s = s.replace(old, "abiFilters 'armeabi-v7a'")
          s = s.replace('mappingFileUploadEnabled true', 'mappingFileUploadEnabled false')
          s = s.replace('nativeSymbolUploadEnabled true', 'nativeSymbolUploadEnabled false')
          gradle_file.write_text(s, encoding='utf-8')

          # leveldbutil is a standalone desktop CLI; the Android app uses the
          # LevelDB library through leviworld and does not need this executable.
          cmake_file = Path('app/src/main/cpp/worldtools/vendor/leveldb/CMakeLists.txt')
          cm = cmake_file.read_text(encoding='utf-8')
          old_block = "\n".join([
              "add_executable(leveldbutil",
              '  "db/leveldbutil.cc"',
              ")",
              "target_link_libraries(leveldbutil leveldb)",
          ])
          new_block = "\n".join([
              "# leveldbutil is a desktop command-line tool; it is not used in the Android app.",
              "if(NOT ANDROID)",
              "  add_executable(leveldbutil",
              '    "db/leveldbutil.cc"',
              "  )",
              "  target_link_libraries(leveldbutil leveldb)",
              "endif()",
          ])
          if old_block in cm:
              cm = cm.replace(old_block, new_block, 1)
              cmake_file.write_text(cm, encoding='utf-8')
              print('Skipped the desktop-only leveldbutil target for Android.')
          elif 'if(NOT ANDROID)' in cm and 'add_executable(leveldbutil' in cm:
              print('leveldbutil already has an Android guard; leaving it unchanged.')
          else:
              raise SystemExit(
                  f'Expected leveldbutil block not found in {cmake_file}; '
                  'upstream changed. No guessed CMake patch applied.'
              )

          # Fix the NBT string hash for 32-bit size_t. The upstream code uses
          # 64-bit FNV-1a constants unconditionally, which Clang correctly rejects
          # on ARMv7 when -Werror is enabled. Use FNV-1a 32-bit on 32-bit builds
          # and preserve FNV-1a 64-bit on 64-bit builds.
          hash_file = Path('app/src/main/cpp/worldtools/vendor/nbt/src/nbt/detail/StringUtils.hpp')
          hs = hash_file.read_text(encoding='utf-8')
          old_hash = "\n".join([
              "[[nodiscard]] constexpr size_t doHash(std::string_view x) {",
              "    size_t           hash  = 0xcbf29ce484222325;",
              "    constexpr size_t prime = 0x100000001b3;",
              "    for (char c : x) {",
              "        hash ^= static_cast<size_t>(c);",
              "        hash *= prime;",
              "    }",
              "    return hash;",
              "}",
          ])
          new_hash = "\n".join([
              "[[nodiscard]] constexpr size_t doHash(std::string_view x) {",
              "    if constexpr (sizeof(size_t) <= sizeof(uint32_t)) {",
              "        uint32_t hash = 0x811c9dc5u;",
              "        constexpr uint32_t prime = 0x01000193u;",
              "        for (char c : x) {",
              "            hash ^= static_cast<uint32_t>(static_cast<unsigned char>(c));",
              "            hash *= prime;",
              "        }",
              "        return static_cast<size_t>(hash);",
              "    } else {",
              "        uint64_t hash = 0xcbf29ce484222325ULL;",
              "        constexpr uint64_t prime = 0x100000001b3ULL;",
              "        for (char c : x) {",
              "            hash ^= static_cast<uint64_t>(static_cast<unsigned char>(c));",
              "            hash *= prime;",
              "        }",
              "        return static_cast<size_t>(hash);",
              "    }",
              "}",
          ])
          if old_hash in hs:
              hs = hs.replace(old_hash, new_hash, 1)
              if '#include <cstdint>' not in hs:
                  hs = hs.replace('#include <string>', '#include <cstdint>\n#include <string>', 1)
              hash_file.write_text(hs, encoding='utf-8')
              print('Patched NBT doHash for 32-bit and 64-bit size_t.')
          elif 'sizeof(size_t) <= sizeof(uint32_t)' in hs:
              print('NBT doHash already has the ARMv7-safe implementation.')
          else:
              raise SystemExit(
                  f'Expected doHash implementation not found in {hash_file}; '
                  'upstream changed. No guessed hash patch applied.'
              )

          # If Minecraft's APK/cache does not provide libc++_shared.so,
          # fall back to the same-ABI C++ runtime packaged with this launcher APK.
          # Do this only for libc++_shared.so; never overwrite game-specific libraries.
          runtime_file = Path('app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt')
          rt = runtime_file.read_text(encoding='utf-8')
          marker = "        verifyLibraries(outputDir)"
          fallback = """        // Some installed Minecraft packages/splits do not expose libc++_shared.so
          // in the extracted runtime cache. The launcher APK already packages the
          // same-ABI C++ shared runtime, so use it as a fallback only when absent.
          val cachedLibcxx = File(outputDir, "libc++_shared.so")
          if (!cachedLibcxx.isFile || cachedLibcxx.length() == 0L) {
              val launcherLibcxx = File(context.applicationInfo.nativeLibraryDir, "libc++_shared.so")
              if (launcherLibcxx.isFile && launcherLibcxx.length() > 0L) {
                  try {
                      launcherLibcxx.inputStream().use { input ->
                          copyStreamToReadOnlyFile(input, cachedLibcxx)
                      }
                      report("Copied libc++_shared.so from launcher native library directory as fallback")
                      if (!processNativeImage(cachedLibcxx, true)) {
                          cachedLibcxx.delete()
                          throw IOException("Failed to prepare fallback native library: libc++_shared.so")
                      }
                  } catch (e: Exception) {
                      Log.w(TAG, "Failed to copy launcher libc++_shared.so fallback: ${e.message}")
                      report("Failed to copy launcher libc++_shared.so fallback: ${e.message}")
                  }
              } else {
                  report("Launcher libc++_shared.so fallback is not available")
              }
          }
          """
          if marker in rt:
              if 'Copied libc++_shared.so from launcher native library directory as fallback' not in rt:
                  rt = rt.replace(marker, fallback + marker, 1)
                  runtime_file.write_text(rt, encoding='utf-8')
                  print('Added libc++_shared.so runtime-cache fallback.')
              else:
                  print('libc++_shared.so runtime-cache fallback already exists.')
          else:
              raise SystemExit(f'Expected insertion point not found in {runtime_file}; refusing to patch.')

          print('Configured the app for armeabi-v7a.')
          PY
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "org.levimc.launcher"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
                "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }
            ],
            "configuration_version": "1"
          }
          JSON
          chmod +x ./gradlew

      - name: Add ARMv7 gxcore JNI fallback (required for this ABI)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/main/cpp/armv7_gxcore_compat.cpp <<'CPP'
          /* Limited ARMv7 JNI fallback; this is not a full gxcore port. */
          #include <jni.h>

          extern "C" JNIEXPORT jboolean JNICALL
          Java_org_levimc_launcher_util_NativeBridgeHelper_nativeScanImage(
              JNIEnv *, jclass, jstring) {
              return JNI_FALSE;
          }

          extern "C" JNIEXPORT jboolean JNICALL
          Java_org_levimc_launcher_util_NativeBridgeHelper_nativeRewriteImage(
              JNIEnv *, jclass, jstring, jstring) {
              return JNI_FALSE;
          }

          extern "C" JNIEXPORT void JNICALL
          Java_org_levimc_launcher_util_NativeBridgeHelper_nativeBootstrapGxCore(
              JNIEnv *, jclass) {
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_org_levimc_launcher_util_NativeBridgeHelper_nativeLoadMinecraftRuntime(
              JNIEnv *, jclass, jstring) {
              return nullptr;
          }
          CPP

          python3 - <<'PYCODE'
          from pathlib import Path

          cmake_file = Path('app/src/main/cpp/CMakeLists.txt')
          cmake = cmake_file.read_text(encoding='utf-8')
          marker = 'ARMV7_GXCORE_COMPAT_SHIM'
          if marker not in cmake:
              cmake += '''

          # ARMV7_GXCORE_COMPAT_SHIM: experimental fallback for ABI lacking upstream gxcore.
          if(ANDROID AND CMAKE_ANDROID_ARCH_ABI STREQUAL "armeabi-v7a")
              if(NOT TARGET gxcore)
                  add_library(gxcore SHARED armv7_gxcore_compat.cpp)
                  set_target_properties(gxcore PROPERTIES OUTPUT_NAME "gxcore")
                  target_compile_options(gxcore PRIVATE -fvisibility=hidden -fno-exceptions -fno-rtti)
              endif()
          endif()
          '''
              cmake_file.write_text(cmake, encoding='utf-8')
              print('Added ARMv7 gxcore compatibility target.')
          else:
              print('ARMv7 gxcore compatibility target already exists.')

          # The shim intentionally does not implement the custom runtime loader.
          # Do not use that ARM64-oriented path in the ARMv7 process.
          runtime_file = Path('app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftRuntimePreparer.kt')
          runtime = runtime_file.read_text(encoding='utf-8')
          old = 'if (gameManager.shouldLoadMallocRedirect()) {'
          new = 'if (gameManager.shouldLoadMallocRedirect() && Build.SUPPORTED_ABIS.firstOrNull() != "armeabi-v7a") {'
          if old in runtime:
              runtime = runtime.replace(old, new, 1)
              runtime_file.write_text(runtime, encoding='utf-8')
              print('Disabled the custom runtime-loader path on ARMv7.')
          elif new in runtime:
              print('ARMv7 custom runtime-loader bypass already exists.')
          else:
              raise SystemExit('Could not find expected runtime-loader condition; refusing to guess.')
          PYCODE

      - name: Prepare PairIP ordering before the final runtime-loader patch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt')
          s = path.read_text(encoding='utf-8')

          # PairIP must initialize from Minecraft's official class loader. Directly loading
          # libpairipcore.so from the launcher class loader caused the uploaded JNI_OnLoad abort.
          array_start = s.find('private val systemLoadedLibs = arrayOf(')
          if array_start < 0:
              raise SystemExit('systemLoadedLibs definition not found; refusing to patch.')
          array_end = s.find('\n    )', array_start)
          if array_end < 0:
              raise SystemExit('systemLoadedLibs array end not found; refusing to patch.')
          array_text = s[array_start:array_end]
          if '"libpairipcore.so"' not in array_text:
              needle = '        "libPlayFabMultiplayer.so",'
              if array_text.count(needle) != 1:
                  raise SystemExit('Expected one PlayFab entry; upstream changed.')
              s = s[:array_start] + array_text.replace(
                  needle, '        "libpairipcore.so",\n' + needle, 1
              ) + s[array_end:]

          old_order = '        val allLibs = requiredLibs + systemLoadedLibs'
          new_order = '\n'.join([
              '        val allLibs = buildList {',
              '            add("libc++_shared.so")',
              '            add("libpairipcore.so")',
              '            requiredLibs.filterNot { it == "libc++_shared.so" }.forEach { add(it) }',
              '            systemLoadedLibs.filterNot { it == "libpairipcore.so" }.forEach { add(it) }',
              '        }.distinct()',
          ])
          if old_order in s:
              s = s.replace(old_order, new_order, 1)
          elif new_order in s:
              print('PairIP load order already updated.')
          else:
              raise SystemExit('Expected allLibs expression not found; refusing to guess.')

          old_load = '\n'.join([
              '                } else {',
              '                    System.loadLibrary(normalizedName)',
              '                }',
          ])
          new_load = '\n'.join([
              '                } else if (normalizedName == "pairipcore") {',
              '                    // Initialize through the original Minecraft package loader.',
              '                    initializeOfficialPairIp()',
              '                } else {',
              '                    System.loadLibrary(normalizedName)',
              '                }',
          ])
          if old_load in s:
              if s.count(old_load) != 1:
                  raise SystemExit(f'Expected one native load branch, found {s.count(old_load)}.')
              s = s.replace(old_load, new_load, 1)
          elif new_load in s:
              print('PairIP class-loader branch already installed.')
          else:
              raise SystemExit('Expected native library load branch not found; refusing to guess.')

          helper_marker = '    fun loadAllLibraries(\n'
          helper = '\n'.join([
              '    /**',
              "     * Initialize the official PairIP Java entry point using Minecraft's own class loader.",
              '     * Its static initializer should load the original library in its expected JNI context.',
              '     * Never fall back to direct System.load for PairIP.',
              '     */',
              '    private fun initializeOfficialPairIp() {',
              '        try {',
              '            Class.forName("com.pairip.VMRunner", true, packageContext.classLoader)',
              '            report("Initialized official PairIP runtime using Minecraft package class loader")',
              '        } catch (error: Throwable) {',
              '            val detail = error.message ?: error.javaClass.simpleName',
              '            Log.e(TAG, "Official PairIP class-loader initialization failed: $detail", error)',
              '            throw UnsatisfiedLinkError(',
              '                "Cannot initialize official PairIP using Minecraft class loader: $detail"',
              '            ).also { it.initCause(error) }',
              '        }',
              '    }',
              '',
              '',
          ])
          if 'private fun initializeOfficialPairIp()' not in s:
              if helper_marker not in s:
                  raise SystemExit('loadAllLibraries insertion point not found; refusing to guess.')
              s = s.replace(helper_marker, helper + helper_marker, 1)

          # Stop before game entry if a required library cannot initialize; don't continue
          # from a known failed native load and turn it into a later native crash.
          old_fail = '\n'.join([
              '            if (!result.loaded) {',
              '                Log.e(TAG, "Failed to load bundle library $libName: ${result.detail ?: "unknown error"}")',
              '                listener?.onLog("Failed to load native library: ${result.fileName}")',
              '            } else {',
          ])
          new_fail = '\n'.join([
              '            if (!result.loaded) {',
              '                Log.e(TAG, "Failed to load bundle library $libName: ${result.detail ?: "unknown error"}")',
              '                listener?.onLog("Failed to load native library: ${result.fileName}")',
              '                if (libName == "pairipcore" || requiredLibs.any { normalizeLibraryName(it) == libName }) {',
              '                    throw IllegalStateException(',
              '                        "Required Minecraft library ${result.fileName} failed to initialize: ${result.detail ?: "unknown error"}"',
              '                    )',
              '                }',
              '            } else {',
          ])
          if old_fail in s:
              s = s.replace(old_fail, new_fail, 1)
          elif 'Required Minecraft library ${result.fileName} failed to initialize' in s:
              print('Required-library fail-fast already installed.')
          else:
              raise SystemExit('Could not add required-library fail-fast guard; refusing to guess.')

          # Static guards: don't leave the undefined helper that broke the prior build,
          # and verify the PairIP path uses Minecraft's package class loader.
          if 'loadInstalledGameLibrary(' in s:
              raise SystemExit('Undefined loadInstalledGameLibrary reference remains; refusing to build.')
          pairip_start = s.find('} else if (normalizedName == "pairipcore") {')
          pairip_end = s.find('} else {', pairip_start)
          if pairip_start < 0 or pairip_end < 0:
              raise SystemExit('Could not verify the PairIP-specific load branch.')
          if 'loadInstalledGameLibrary' in s[pairip_start:pairip_end]:
              raise SystemExit('PairIP still has an invalid fallback; refusing to build.')
          if 'Class.forName("com.pairip.VMRunner", true, packageContext.classLoader)' not in s:
              raise SystemExit('Official PairIP class-loader initialization is missing.')
          path.write_text(s, encoding='utf-8')
          print('Patched PairIP initialization to use the installed Minecraft class loader.')
          PY

          grep -q 'Class.forName("com.pairip.VMRunner", true, packageContext.classLoader)' \
            app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt

      - name: Extract and preload PlayFab and Mae dependencies before Minecraft
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt')
          s = path.read_text(encoding='utf-8')

          # Minecraft supplies these two ARMv7 libraries in its split APKs.
          # Extract them into the runtime cache, then load them before minecraftpe.
          pattern = r'(?m)^([ \t]*)private val extractableLibs = requiredLibs \+ optionalLibs[ \t]*$'
          replacement = r'''\1private val runtimeDependencyLibs = arrayOf(
          \1    "libPlayFabMultiplayer.so",
          \1    "libmaesdk.so",
          \1)
          \1private val extractableLibs = requiredLibs + optionalLibs + runtimeDependencyLibs'''
          s, n = re.subn(pattern, replacement, s, count=1)
          if n == 0 and not ('private val runtimeDependencyLibs = arrayOf(' in s and 'requiredLibs + optionalLibs + runtimeDependencyLibs' in s):
              raise SystemExit('Could not find the extractableLibs declaration; upstream changed.')

          # Invalidate old markers when these extra libraries become required.
          token_line = "            append(\"token=\").append(NativeImageGuard.TOKEN).append('\\n')"
          deps_line = "            append(\"deps=\").append(runtimeDependencyLibs.joinToString(\",\")).append('\\n')"
          if deps_line not in s:
              if token_line not in s:
                  raise SystemExit('Could not find the extraction manifest token line.')
              s = s.replace(token_line, token_line + '\n' + deps_line, 1)

          cache_pattern = r'(?ms)^    private fun getCacheRequiredLibs\(\): Array<String> \{\n.*?^    \}'
          cache_replacement = '''    private fun getCacheRequiredLibs(): Array<String> {
                  return if (shouldLoadHttpClient()) {
                      requiredLibs + runtimeDependencyLibs + optionalLibs
                  } else {
                      requiredLibs + runtimeDependencyLibs
                  }
              }'''
          s, n = re.subn(cache_pattern, cache_replacement, s, count=1)
          if n == 0 and 'requiredLibs + runtimeDependencyLibs + optionalLibs' not in s:
              raise SystemExit('Could not update getCacheRequiredLibs.')

          # Use the official PairIP Java initializer first, then libraries from the
          # Minecraft APK, then libminecraftpe.so. This satisfies its DT_NEEDED entries.
          order_pattern = r'(?ms)^        val allLibs = buildList \{\n.*?^        \}\.distinct\(\)'
          order_replacement = '''        val allLibs = buildList {
                      add("libc++_shared.so")
                      add("libpairipcore.so")
                      add("libPlayFabMultiplayer.so")
                      add("libmaesdk.so")
                      requiredLibs.filterNot { it == "libc++_shared.so" || it == "libminecraftpe.so" }.forEach { add(it) }
                      add("libminecraftpe.so")
                      systemLoadedLibs.filterNot {
                          it == "libpairipcore.so" || it == "libPlayFabMultiplayer.so" || it == "libmaesdk.so"
                      }.forEach { add(it) }
                  }.distinct()'''
          s, n = re.subn(order_pattern, order_replacement, s, count=1)
          if n == 0 and not all(x in s for x in ['add("libPlayFabMultiplayer.so")', 'add("libmaesdk.so")', 'add("libminecraftpe.so")']):
              raise SystemExit('Could not update native library loading order.')

          # These two libraries are intentionally loaded by absolute path from the
          # cache extracted from Minecraft's split APKs, not with System.loadLibrary().
          load_pattern = r'(?m)^([ \t]*)\} else if \(normalizedName == "pairipcore"\) \{\n[ \t]*// Initialize through the original Minecraft package loader\.\n[ \t]*initializeOfficialPairIp\(\)\n[ \t]*\} else \{\n[ \t]*System\.loadLibrary\(normalizedName\)\n[ \t]*\}'
          def replace_load(match):
              i = match.group(1)
              return '\n'.join([
                  i + '} else if (normalizedName == "pairipcore") {',
                  i + '    // Initialize through the original Minecraft package loader.',
                  i + '    initializeOfficialPairIp()',
                  i + '} else if (normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk") {',
                  i + '    val extractedDependency = File(nativeLibDir, fileName)',
                  i + '    if (!extractedDependency.isFile || extractedDependency.length() == 0L) {',
                  i + '        throw UnsatisfiedLinkError(',
                  i + '            "$fileName was not extracted from the installed Minecraft APKs: ${extractedDependency.absolutePath}"',
                  i + '        )',
                  i + '    }',
                  i + '    ensureReadOnly(extractedDependency)',
                  i + '    System.load(extractedDependency.absolutePath)',
                  i + '} else {',
                  i + '    System.loadLibrary(normalizedName)',
                  i + '}',
              ])
          if 'normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk"' not in s:
              s, n = re.subn(load_pattern, replace_load, s, count=1)
              if n == 0:
                  raise SystemExit('Could not update the PairIP-aware native load branch.')

          # Treat missing PlayFab/Mae files as fatal and report the exact dependency.
          old_fail = 'if (libName == "pairipcore" || requiredLibs.any { normalizeLibraryName(it) == libName }) {'
          new_fail = 'if (libName == "pairipcore" || runtimeDependencyLibs.any { normalizeLibraryName(it) == libName } || requiredLibs.any { normalizeLibraryName(it) == libName }) {'
          if old_fail in s:
              s = s.replace(old_fail, new_fail, 1)
          elif new_fail not in s:
              raise SystemExit('Could not update required-library failure handling.')

          checks = [
              'requiredLibs + optionalLibs + runtimeDependencyLibs',
              'requiredLibs + runtimeDependencyLibs + optionalLibs',
              'normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk"',
              'add("libPlayFabMultiplayer.so")',
              'add("libmaesdk.so")',
              'System.load(extractedDependency.absolutePath)',
              'append("deps=").append(runtimeDependencyLibs.joinToString(","))',
          ]
          missing = [item for item in checks if item not in s]
          if missing:
              raise SystemExit('Post-patch checks failed: ' + '; '.join(missing))

          path.write_text(s, encoding='utf-8')
          print('Configured extraction and preloading for libPlayFabMultiplayer.so and libmaesdk.so.')
          PYCODE

          grep -q 'runtimeDependencyLibs' app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt
          grep -q 'System.load(extractedDependency.absolutePath)' app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt

      - name: Load the Minecraft native dependency chain with a shared game-parent classloader
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt')
          s = path.read_text(encoding='utf-8')

          # PairIP and the PlayFab/Mae libraries have DT_NEEDED links to one another.
          # Keep them in the same extracted directory and preserve PairIP's original bytes.
          dep_pattern = r'(?ms)^    private val runtimeDependencyLibs = arrayOf\(\n.*?^    \)'
          m = re.search(dep_pattern, s)
          if not m:
              raise SystemExit('runtimeDependencyLibs block not found; refusing to guess.')
          dep_block = m.group(0)
          if '"libpairipcore.so"' not in dep_block:
              needle = '        "libPlayFabMultiplayer.so",'
              if dep_block.count(needle) != 1:
                  raise SystemExit('Could not add PairIP to runtime dependency extraction.')
              dep_block = dep_block.replace(needle, '        "libpairipcore.so",\n' + needle, 1)
              s = s[:m.start()] + dep_block + s[m.end():]

          # PairIP is a protected dependency; it must be byte-identical, not passed
          # through the launcher image-rewrite shim.
          native_marker = '    private fun processNativeImage(file: File, force: Boolean = false): Boolean {\n'
          if native_marker not in s:
              raise SystemExit('processNativeImage method not found; refusing to patch.')
          if 'PairIP bytes must stay original' not in s:
              s = s.replace(
                  native_marker,
                  native_marker +
                  '        // PairIP bytes must stay original; its JNI/runtime checks are loader-sensitive.\n' +
                  '        if (file.name == "libpairipcore.so") return true\n', 1)

          # The optional HttpClient library is a DT_NEEDED dependency on recent
          # Minecraft builds, so attempt it before libminecraftpe.so as well.
          order_pattern = r'(?ms)^        val allLibs = buildList \{\n.*?^\s*\}\.distinct\(\)'
          order_replacement = '''        val allLibs = buildList {
                      add("libc++_shared.so")
                      add("libpairipcore.so")
                      add("libPlayFabMultiplayer.so")
                      add("libmaesdk.so")
                      requiredLibs.filterNot { it == "libc++_shared.so" || it == "libminecraftpe.so" }.forEach { add(it) }
                      optionalLibs.forEach { add(it) }
                      add("libminecraftpe.so")
                      systemLoadedLibs.filterNot {
                          it == "libpairipcore.so" || it == "libPlayFabMultiplayer.so" || it == "libmaesdk.so"
                      }.forEach { add(it) }
                  }.distinct()'''
          s, n = re.subn(order_pattern, order_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one allLibs order block; found {n}.')

          # Use a child DexClassLoader whose parent is Minecraft's installed loader.
          # This makes FindClass/JNI_OnLoad see Minecraft's PairIP Java classes while
          # all extracted native libraries share a linker namespace and search path.
          for import_line, anchor in [
              ('import dalvik.system.DexClassLoader\n', 'import android.util.Log\n'),
              ('import java.lang.reflect.InvocationTargetException\n', 'import java.io.InputStream\n'),
          ]:
              if import_line.strip() not in s:
                  if anchor not in s:
                      raise SystemExit(f'Import anchor not found: {anchor.strip()}')
                  s = s.replace(anchor, anchor + import_line, 1)

          field_anchor = '    private val applicationInfo: ApplicationInfo\n'
          fields = '''    private val applicationInfo: ApplicationInfo
          @Volatile private var runtimeNativeLoadMethod: java.lang.reflect.Method? = null
          @Volatile private var runtimeNativeClassLoader: ClassLoader? = null
          private val runtimeNativeLoaderLock = Any()
          '''.rstrip('\n')
          if 'runtimeNativeLoadMethod' not in s:
              if field_anchor not in s:
                  raise SystemExit('applicationInfo field anchor not found.')
              s = s.replace(field_anchor, fields + '\n', 1)

          method_anchor = '    private fun setupSecurityProvider() {\n'
          method = '''    private fun loadRuntimeNativeLibrary(file: File) {
                  if (!file.isFile || file.length() == 0L) {
                      throw UnsatisfiedLinkError("Native library is missing or empty: ${file.absolutePath}")
                  }
                  val method = synchronized(runtimeNativeLoaderLock) {
                      runtimeNativeLoadMethod ?: run {
                          val optimizedDir = File(context.codeCacheDir, "runtime-native-loader-optimized")
                          if (!optimizedDir.isDirectory && !optimizedDir.mkdirs()) {
                              throw UnsatisfiedLinkError("Cannot create runtime loader cache: ${optimizedDir.absolutePath}")
                          }
                          val dexFile = File(context.codeCacheDir, "runtime-native-loader.dex")
                          val temporaryDex = File(context.codeCacheDir, "runtime-native-loader.dex.tmp")
                          try {
                              context.assets.open("runtime-native-loader.dex").use { input ->
                                  FileOutputStream(temporaryDex).use { output ->
                                      input.copyTo(output)
                                      output.fd.sync()
                                  }
                              }
                              if (dexFile.exists() && !dexFile.delete()) {
                                  throw UnsatisfiedLinkError("Cannot replace stale runtime-loader DEX: ${dexFile.absolutePath}")
                              }
                              if (!temporaryDex.renameTo(dexFile)) {
                                  throw UnsatisfiedLinkError("Cannot install standalone runtime-loader DEX: ${dexFile.absolutePath}")
                              }
                          } catch (e: Exception) {
                              temporaryDex.delete()
                              throw UnsatisfiedLinkError("Cannot prepare standalone runtime-loader DEX: ${e.message ?: e.javaClass.simpleName}").also { it.initCause(e) }
                          }
                          val librarySearchPath = listOf(
                              nativeLibDir,
                              context.applicationInfo.nativeLibraryDir,
                              packageContext.applicationInfo.nativeLibraryDir
                          ).filter { it.isNotBlank() && File(it).isDirectory }
                              .distinct()
                              .joinToString(File.pathSeparator)
                          if (librarySearchPath.isBlank()) {
                              throw UnsatisfiedLinkError("No native library search directories are available")
                          }
                          val loader = DexClassLoader(
                              dexFile.absolutePath,
                              optimizedDir.absolutePath,
                              librarySearchPath,
                              packageContext.classLoader
                          )
                          val helper = Class.forName(
                              "org.levimc.launcher.util.RuntimeNativeLoader",
                              true,
                              loader
                          )
                          val loadMethod = helper.getMethod("load", String::class.java)
                          runtimeNativeClassLoader = loader
                          runtimeNativeLoadMethod = loadMethod
                          loadMethod
                      }
                  }
                  try {
                      method.invoke(null, file.absolutePath)
                  } catch (e: InvocationTargetException) {
                      val cause = e.targetException
                      if (cause is UnsatisfiedLinkError) throw cause
                      throw UnsatisfiedLinkError(
                          "Game-parent classloader failed to load ${file.name}: ${cause.message ?: cause.javaClass.simpleName}"
                      ).also { it.initCause(cause) }
                  } catch (e: Exception) {
                      throw UnsatisfiedLinkError(
                          "Could not load ${file.name} through the game-parent classloader: ${e.message ?: e.javaClass.simpleName}"
                      ).also { it.initCause(e) }
                  }
              }

          '''
          if 'private fun loadRuntimeNativeLibrary(file: File)' not in s:
              if method_anchor not in s:
                  raise SystemExit('setupSecurityProvider insertion point not found.')
              s = s.replace(method_anchor, method + method_anchor, 1)

          # Replace the provisional class-loader workaround. The previous workflow
          # reported PairIP initialized without verifying that it was visible to the
          # classloader actually loading libminecraftpe.so.
          branch_pattern = re.compile(
              r'(?ms)^([ \t]*)\} else if \(normalizedName == "pairipcore"\) \{\n'
              r'.*?^\1\} else \{\n\1    System\.loadLibrary\(normalizedName\)\n\1\}'
          )
          branch_match = branch_pattern.search(s)
          if branch_match:
              i = branch_match.group(1)
              branch = '\n'.join([
                  i + '} else if (normalizedName == "pairipcore" || normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk") {',
                  i + '    val dependency = File(nativeLibDir, fileName)',
                  i + '    if (!dependency.isFile || dependency.length() == 0L) {',
                  i + '        throw UnsatisfiedLinkError("Required runtime dependency was not extracted: ${dependency.absolutePath}")',
                  i + '    }',
                  i + '    ensureReadOnly(dependency)',
                  i + '    loadRuntimeNativeLibrary(dependency)',
                  i + '} else {',
                  i + '    System.loadLibrary(normalizedName)',
                  i + '}'
              ])
              s = s[:branch_match.start()] + branch + s[branch_match.end():]
          elif 'normalizedName == "pairipcore" || normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk"' not in s:
              raise SystemExit('Could not replace provisional PairIP/PlayFab/Mae load branch.')

          # All regular extracted Minecraft libraries must be loaded by the same
          # helper classloader too; otherwise PairIP would be invisible across linker namespaces.
          if 'System.load(libFile.absolutePath)' in s:
              s = s.replace('System.load(libFile.absolutePath)', 'loadRuntimeNativeLibrary(libFile)', 1)
          elif 'loadRuntimeNativeLibrary(libFile)' not in s:
              raise SystemExit('Could not route extracted libraries through the shared classloader.')

          # Prevent any generic directory scan from ever rewriting PairIP as well.
          guard_path = Path('app/src/main/java/org/levimc/launcher/util/NativeImageGuard.java')
          guard = guard_path.read_text(encoding='utf-8')
          should_marker = '    public static boolean shouldProcess(File soFile) {\n'
          if should_marker not in guard:
              raise SystemExit('NativeImageGuard.shouldProcess insertion point not found.')
          if 'PairIP must remain byte-identical' not in guard:
              guard = guard.replace(
                  should_marker,
                  should_marker +
                  '        // PairIP must remain byte-identical; do not scan or rewrite this dependency.\n' +
                  '        if (soFile != null && "libpairipcore.so".equals(soFile.getName())) return false;\n', 1)
          process_marker = '    private static boolean process(File soFile, boolean ignoreMarker) {\n'
          if process_marker not in guard:
              raise SystemExit('NativeImageGuard.process insertion point not found.')
          start = guard.index(process_marker) + len(process_marker)
          invalid_guard = '''        if (soFile == null || !soFile.isFile() || soFile.length() == 0) {
                      return false;
                  }
          '''
          invalid_at = guard.find(invalid_guard, start)
          if invalid_at < 0:
              raise SystemExit('NativeImageGuard.process input validation block changed.')
          after_invalid = invalid_at + len(invalid_guard)
          if 'if ("libpairipcore.so".equals(soFile.getName()))' not in guard[after_invalid:after_invalid + 500]:
              pairip_guard = '''        if ("libpairipcore.so".equals(soFile.getName())) {
                      markClean(soFile);
                      return true;
                  }
          '''
              guard = guard[:after_invalid] + pairip_guard + guard[after_invalid:]
          if 'PairIP must remain byte-identical' not in guard or 'markClean(soFile);' not in guard:
              raise SystemExit('PairIP exclusion failed in NativeImageGuard.')
          guard_path.write_text(guard, encoding='utf-8')

          # Force one clean extraction after changing dependency membership and load namespace.
          old_extractor = 'private const val EXTRACTOR_VERSION = 2'
          new_extractor = 'private const val EXTRACTOR_VERSION = 3'
          if old_extractor in s:
              s = s.replace(old_extractor, new_extractor, 1)
          elif new_extractor not in s:
              raise SystemExit('Could not bump the native extraction cache version.')

          # Confirm final state and save atomically only after every guard passes.
          checks = [
              '"libpairipcore.so"',
              'PairIP bytes must stay original',
              'DexClassLoader(',
              'Class.forName(',
              'loadRuntimeNativeLibrary(dependency)',
              'loadRuntimeNativeLibrary(libFile)',
              'optionalLibs.forEach { add(it) }',
          ]
          missing = [item for item in checks if item not in s]
          if missing:
              raise SystemExit('Final native loader checks failed: ' + ', '.join(missing))
          path.write_text(s, encoding='utf-8')
          print('Patched one Minecraft-parent DexClassLoader for PairIP, PlayFab, Mae, and the game libraries; standalone DEX is built after SDK setup.')
          PY

          grep -q 'private fun loadRuntimeNativeLibrary(file: File)' app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt
          grep -q 'loadRuntimeNativeLibrary(libFile)' app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt
          grep -q 'libpairipcore.so' app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt

      - name: Ensure the deliberate CMake blocker is absent
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'ARMV7_REQUIRE_REAL_GXCORE' app/src/main/cpp/CMakeLists.txt; then
            echo 'The old forced CMake failure guard must not be present in this build workflow.' >&2
            exit 1
          fi
          grep -q 'ARMV7_GXCORE_COMPAT_SHIM' app/src/main/cpp/CMakeLists.txt

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, matching NDK 28.2, and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Compile standalone DEX entrypoint for the game-parent native loader
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/runtime-native-loader"
          mkdir -p "$WORK/src/org/levimc/launcher/util" "$WORK/classes" "$WORK/dex"
          cat > "$WORK/src/org/levimc/launcher/util/RuntimeNativeLoader.java" <<'JAVA'
          package org.levimc.launcher.util;
          public final class RuntimeNativeLoader {
              private RuntimeNativeLoader() { }
              public static void load(String absolutePath) {
                  System.load(absolutePath);
              }
          }
          JAVA
          javac --release 8 -d "$WORK/classes" "$WORK/src/org/levimc/launcher/util/RuntimeNativeLoader.java"
          "$ANDROID_HOME/build-tools/36.0.0/d8" \
            --min-api 28 \
            --lib "$ANDROID_HOME/platforms/android-36/android.jar" \
            --output "$WORK/dex" \
            "$WORK/classes/org/levimc/launcher/util/RuntimeNativeLoader.class"
          test -s "$WORK/dex/classes.dex"
          mkdir -p source/app/src/main/assets
          install -m 0644 "$WORK/dex/classes.dex" source/app/src/main/assets/runtime-native-loader.dex
          sha256sum source/app/src/main/assets/runtime-native-loader.dex

      - name: Build debug APK for ARMv7 and capture all output
        id: build
        working-directory: source
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/gradle-native-build.log"
          echo "Full build log: $LOG"
          ./gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Summarize native errors if the build failed
        if: failure() || steps.build.outcome == 'failure'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/gradle-native-build.log"
          {
            echo '## Native build diagnostics'
            echo
            if [ -s "$LOG" ]; then
              echo 'First matching compiler/linker/Ninja diagnostics (the full log is attached as an artifact):'
              echo '```text'
              grep -n -E 'fatal error:|(^|[[:space:]])error:|undefined reference|cannot find|No such file or directory|FAILED:|ninja: build stopped|CMake Error' "$LOG" | head -n 100 || true
              echo '```'
            else
              echo 'No build log was created; check the preceding setup step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-build-log-v5
          path: ${{ runner.temp }}/gradle-native-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the APK targets ARMv7
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "native-code: 'armeabi-v7a'" /tmp/apk-badging.txt
          cp "$APK" 'LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk'
          python3 - 'LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk' 'source/app/src/main/jniLibs/armeabi-v7a/libpairipcore.so' <<'PY'
          import sys, zipfile, pathlib
          apk = sys.argv[1]
          expected_pairip = pathlib.Path(sys.argv[2]).read_bytes()
          required = {
              'lib/armeabi-v7a/libgxcore.so',
              'lib/armeabi-v7a/libc++_shared.so',
              'lib/armeabi-v7a/libpairipcore.so',
              'assets/runtime-native-loader.dex',
          }
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Missing required ARMv7 entries: ' + ', '.join(missing))
              so = z.read('lib/armeabi-v7a/libgxcore.so')
              if so[:4] != b'\x7fELF' or so[4] != 1 or int.from_bytes(so[18:20], 'little') != 40:
                  raise SystemExit('libgxcore.so is not a 32-bit ARM ELF')
              packaged_pairip = z.read('lib/armeabi-v7a/libpairipcore.so')
              if packaged_pairip != expected_pairip:
                  raise SystemExit('Packaged libpairipcore.so differs from the verified source; check that stripping/rewriting is disabled.')
              if packaged_pairip[:4] != b'\x7fELF' or packaged_pairip[4] != 1 or int.from_bytes(packaged_pairip[18:20], 'little') != 40:
                  raise SystemExit('Packaged libpairipcore.so is not a 32-bit ARM ELF')
              for symbol in (
                  b'Java_org_levimc_launcher_util_NativeBridgeHelper_nativeScanImage',
                  b'Java_org_levimc_launcher_util_NativeBridgeHelper_nativeBootstrapGxCore',
              ):
                  if symbol not in so:
                      raise SystemExit('Missing shim JNI symbol: ' + symbol.decode())
          loader_dex = z.read('assets/runtime-native-loader.dex')
          if not loader_dex.startswith(b'dex\n') or len(loader_dex) < 100:
              raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')
          print('Verified ARMv7 gxcore, libc++, byte-identical PairIP, and runtime-loader DEX in', apk)
          PY
          sha256sum 'LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk'

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v5
          path: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk
          if-no-files-found: error
          retention-days: 7
