name: REA PlayFab ARM64-to-ARMv7 Investigation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/REA-PlayFab-ARM64-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REA_GHIDRA_STARTUP_TIMEOUT_MS: "300000"
    steps:
      - name: Checkout Mcpe
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils file jq unzip

      - name: Download maintained ARM64 reference and official PlayFab SDK package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference" report
          cd "$RUNNER_TEMP/reference"

          curl --fail --location --retry 3 --retry-all-errors -o mcpelauncher-updates-arm64-release.zip "https://github.com/minecraft-linux/mcpelauncher-updates/releases/download/v26.40.1/mcpelauncher-updates-arm64-release.zip"
          echo "5e3050816ba49c6a94dc119ccd5d38a3fd8fb2924da511bfb1b63a5bffd5c880  mcpelauncher-updates-arm64-release.zip" | sha256sum --check
          unzip -q mcpelauncher-updates-arm64-release.zip -d maintained

          curl --fail --location --retry 3 --retry-all-errors -o playfab-v1.8.4-android-dynlhc.zip "https://github.com/PlayFab/PlayFabMultiplayer/releases/download/v1.8.4/Microsoft.PlayFab.PlayFabMultiplayer.Cpp.AndroidRelease.DynLHC.zip"
          echo "a3ce82eaffe52bd11499c57de9324f41f6d0566ee6c37c004f80c6e38dc8e0d3  playfab-v1.8.4-android-dynlhc.zip" | sha256sum --check
          unzip -q playfab-v1.8.4-android-dynlhc.zip -d official

          find maintained official -type f -name 'libPlayFabMultiplayer.so' -print | sort > "$GITHUB_WORKSPACE/report/playfab-candidates.txt"
          : > "$GITHUB_WORKSPACE/report/playfab-candidate-architectures.txt"
          ARM64_SO=""
          ARMV7_SO=""
          while IFS= read -r candidate; do
            [ -f "$candidate" ] || continue
            file "$candidate" >> "$GITHUB_WORKSPACE/report/playfab-candidate-architectures.txt"
            machine="$(readelf -h "$candidate" 2>/dev/null | sed -n 's/.*Machine:[[:space:]]*//p' | head -n1)"
            case "$machine" in
              AArch64)
                if [ -z "$ARM64_SO" ]; then ARM64_SO="$candidate"; fi
                ;;
              ARM)
                if readelf -h "$candidate" | grep -q 'Class:[[:space:]]*ELF32'; then
                  if [ -z "$ARMV7_SO" ]; then ARMV7_SO="$candidate"; fi
                fi
                ;;
            esac
          done < "$GITHUB_WORKSPACE/report/playfab-candidates.txt"

          if [ -n "$ARMV7_SO" ]; then
            cp "$ARMV7_SO" "$GITHUB_WORKSPACE/report/libPlayFabMultiplayer-armv7-official-candidate.so"
            echo "Present: $ARMV7_SO" > "$GITHUB_WORKSPACE/report/armv7-candidate-status.txt"
            file "$ARMV7_SO" >> "$GITHUB_WORKSPACE/report/armv7-candidate-status.txt"
            sha256sum "$ARMV7_SO" >> "$GITHUB_WORKSPACE/report/armv7-candidate-status.txt"
          else
            echo "No ELF32 ARM libPlayFabMultiplayer.so was found in either downloaded package." > "$GITHUB_WORKSPACE/report/armv7-candidate-status.txt"
          fi

          if [ -z "$ARM64_SO" ]; then
            echo "No AArch64 libPlayFabMultiplayer.so was found in the maintained reference package." >&2
            find maintained official -maxdepth 7 -type f | sort > "$GITHUB_WORKSPACE/report/archive-file-list.txt"
            exit 1
          fi
          cp "$ARM64_SO" "$GITHUB_WORKSPACE/report/libPlayFabMultiplayer-arm64-reference.so"
          echo "$ARM64_SO" > "$GITHUB_WORKSPACE/report/selected-reference-path.txt"
          file "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-file-type.txt"
          sha256sum "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-sha256.txt"
          readelf -h "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-elf-header.txt"
          readelf -W -d "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-dynamic-section.txt"
          readelf -W -l "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-program-headers.txt"
          readelf -W -S "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-sections.txt"
          readelf -W --dyn-syms "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-dynamic-symbols.txt"
          readelf -W -r "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-relocations.txt"
          nm -D --defined-only -C "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-exports-demangled.txt"
          strings -a "$ARM64_SO" > "$GITHUB_WORKSPACE/report/reference-strings.txt"
          unzip -l mcpelauncher-updates-arm64-release.zip > "$GITHUB_WORKSPACE/report/maintained-archive-list.txt"
          unzip -l playfab-v1.8.4-android-dynlhc.zip > "$GITHUB_WORKSPACE/report/official-archive-list.txt"

      - name: Download and verify Ghidra
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --retry-all-errors -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip"
          echo "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db  ghidra.zip" | sha256sum --check
          unzip -q ghidra.zip -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ghidra_12.1.4_PUBLIC/support/analyzeHeadless"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"
          java -version 2> "$GITHUB_WORKSPACE/report/java-version.txt"

      - name: Install REA
        shell: bash
        run: |
          set -euo pipefail
          npm install --global rea-agents@latest
          rea --help > "$GITHUB_WORKSPACE/report/rea-help.txt"
          rea analyze --help > "$GITHUB_WORKSPACE/report/rea-analyze-help.txt" 2>&1 || true
          rea function --help > "$GITHUB_WORKSPACE/report/rea-function-help.txt" 2>&1 || true

      - name: Analyze the working ARM64 reference with REA and Ghidra
        shell: bash
        run: |
          set -euo pipefail
          ARM64_SO="$GITHUB_WORKSPACE/report/libPlayFabMultiplayer-arm64-reference.so"
          rea analyze "$ARM64_SO" --provider ghidra --json > "$GITHUB_WORKSPACE/report/rea-analysis.json" 2> "$GITHUB_WORKSPACE/report/rea-analysis.stderr"

      - name: Decompile key exported PlayFab entry points with REA
        shell: bash
        run: |
          set -u
          ARM64_SO="$GITHUB_WORKSPACE/report/libPlayFabMultiplayer-arm64-reference.so"
          SYMBOLS="PFMultiplayerInitialize PFMultiplayerUninitialize PFMultiplayerCreateAndJoinLobby PFMultiplayerConnectToLobby PFMultiplayerFindLobbies PFMultiplayerCreateMatchmakingTicket PFLobbyPostUpdate PFPubSubCreateAndBeginSubscription JNI_OnLoad"
          : > "$GITHUB_WORKSPACE/report/rea-function-results.txt"
          for symbol in $SYMBOLS; do
            if nm -D --defined-only "$ARM64_SO" | awk '{print $3}' | grep -Fxq "$symbol"; then
              echo "Decompiling $symbol" >> "$GITHUB_WORKSPACE/report/rea-function-results.txt"
              rea function "$ARM64_SO" "$symbol" --provider ghidra --json > "$GITHUB_WORKSPACE/report/function-$symbol.json" 2> "$GITHUB_WORKSPACE/report/function-$symbol.stderr" || echo "REA function query failed for $symbol" >> "$GITHUB_WORKSPACE/report/rea-function-results.txt"
            else
              echo "Symbol not exported by reference: $symbol" >> "$GITHUB_WORKSPACE/report/rea-function-results.txt"
            fi
          done

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          {
            echo "Reference: mcpelauncher-updates v26.40.1 ARM64 release"
            echo "Official SDK checked: PlayFab v1.8.4 Android DynLHC release"
            echo "The ARMv7 candidate status file records whether an existing 32-bit official binary was found."
            echo "REA/Ghidra analysis is evidence for a later ARMv7 implementation; it is not itself an ARMv7 binary."
            echo "No APK was built or modified by this workflow."
          } > report/REPORT.txt
          ls -lh report > report/FILES.txt

      - name: Upload REA analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-playfab-arm64-armv7-investigation
          path: report/
          if-no-files-found: error
          retention-days: 14
