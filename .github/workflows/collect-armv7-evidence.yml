name: Collect ARMv7 PlayFab evidence
# Put elfcheck.py and collect_evidence.sh in tools/ of the repo, then run this workflow manually.
on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Repo-relative path of the APK (or zip) that contains lib/armeabi-v7a/libPlayFabMultiplayer.so"
        required: true
      tombstone_path:
        description: "Repo-relative path of the tombstone text file (optional)"
        required: false
      crash_addr:
        description: "Raw crash address, e.g. 0x1b5780 (optional)"
        required: false
      arm64_reference:
        description: "Repo-relative path of the arm64 reference .so (optional, enables side-by-side compare)"
        required: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: |
          chmod +x tools/collect_evidence.sh
          tools/collect_evidence.sh \
            "${{ inputs.apk_path }}" \
            "${{ inputs.tombstone_path }}" \
            "${{ inputs.crash_addr }}" \
            "${{ inputs.arm64_reference }}"
      - uses: actions/upload-artifact@v4
        with:
          name: armv7-playfab-evidence
          path: evidence/
