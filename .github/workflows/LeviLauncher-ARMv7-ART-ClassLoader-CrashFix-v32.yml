name: Build LeviLauncher ARMv7 ART class-resolution crash fix v32

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/LeviLauncher-ARMv7-ART-ClassLoader-CrashFix-v32.yml"

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out Mcpe workflows
        uses: actions/checkout@v4

      - name: Check out pinned LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: 38764ca77b4fcb9c27ab3cec688e67e5166141df
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Apply dedicated-loader ART crash fix from validated V31 recipe (v32 artifact)
        id: build
        shell: bash
        env:
          TEMPLATE_COMMIT: a4ac407be409c912c7450335d9852885d831dfd4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "PyYAML"],
                  check=True,
              )
              import yaml

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          recipe_path = workspace / ".github/workflows/LeviLauncher-ARMv7-GameRuntime-ClassLoader-v31-official-pairip-loader.yml"
          if not recipe_path.is_file():
              raise SystemExit(
                  "Required V31 build recipe is missing from the checked-out Mcpe branch: " + str(recipe_path) +
                  ". This v32 workflow must be committed inside .github/workflows/ on main, alongside the existing V31 recipe."
              )

          document = yaml.safe_load(recipe_path.read_text(encoding="utf-8"))
          jobs = document.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"Expected exactly one V31 job, found {len(jobs)}")
          steps = next(iter(jobs.values())).get("steps", [])
          recipe = next((step for step in steps if step.get("id") == "build" and "run" in step), None)
          if recipe is None:
              raise SystemExit("Could not find the V31 build step; refusing to build from a guessed recipe")

          script = recipe["run"]
          required = (
              "GameRuntimeAppComponentFactory",
              "instantiateClassLoader(ClassLoader appLoader, ApplicationInfo info)",
              "GameRuntimeDexClassLoader",
              "prepareLauncherClassLoaderForMinecraft",
              "Class.forName(\"com.pairip.VMRunner\", true, packageContext.classLoader)",
          )
          missing = [marker for marker in required if marker not in script]
          if missing:
              raise SystemExit("V31 ART-fix recipe is incomplete: " + ", ".join(missing))

          # The actual crash is ART method resolution while the v21 bridge mutates
          # Minecraft's already-running ClassLoader. The V31 recipe installs a dedicated
          # loader through AppComponentFactory before app/activity creation, and removes
          # that in-place mutation. Rename only generated artifact labels, not loader logic.
          script = script.replace("v31-official-pairip-loader", "v32-art-classloader-crashfix")

          child_env = os.environ.copy()
          for key, value in (recipe.get("env") or {}).items():
              child_env[str(key)] = str(value)
          child_env["TEMPLATE_COMMIT"] = "a4ac407be409c912c7450335d9852885d831dfd4"
          result = subprocess.run(script, shell=True, executable="/bin/bash", cwd=workspace, env=child_env)
          if result.returncode != 0:
              raise SystemExit(result.returncode)

          apk = workspace / "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v32-art-classloader-crashfix.apk"
          if not apk.is_file() or apk.stat().st_size < 1_000_000:
              raise SystemExit(f"Expected output APK is missing or implausibly small: {apk}")
          print(f"Verified v32 output artifact exists: {apk.name} ({apk.stat().st_size} bytes)")
          PY

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-build-log-v32-art-classloader-crashfix
          path: ${{ runner.temp }}/gradle-native-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ARMv7 crash-fix APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v32-art-classloader-crashfix
          path: LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v32-art-classloader-crashfix.apk
          if-no-files-found: error
          retention-days: 7
