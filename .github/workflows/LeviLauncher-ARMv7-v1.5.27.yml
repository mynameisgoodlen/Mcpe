name: LeviLauncher v1.5.27 ARMv7 build and runtime audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/LeviLauncher-ARMv7-v1.5.27.yml'

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: LiteLDev/LeviLaunchroid
  UPSTREAM_REVISION: a8531393d3a336812748a9bb45582a3d9791af7b
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: 36.0.0
  CMAKE_VERSION: 3.22.1

jobs:
  armv7-build:
    name: Build and verify the real LeviLauncher app
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Check out the Mcpe workflow repository
        uses: actions/checkout@v4

      - name: Check out pinned LeviLaunchroid v1.5.27 and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: a8531393d3a336812748a9bb45582a3d9791af7b
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install the exact Android SDK, NDK, and CMake versions
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          echo "Installed NDK: ${ANDROID_NDK_VERSION}"
          echo "Installed platform: ${ANDROID_PLATFORM}"

      - name: Verify pinned source and configure ARMv7
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import json

          expected = "a8531393d3a336812748a9bb45582a3d9791af7b"
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if actual != expected:
              raise SystemExit(f"Wrong upstream revision: {actual}; expected {expected}")

          gradle = Path("app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          arm64_filter = "abiFilters 'arm64-v8a'"
          armv7_filter = "abiFilters 'armeabi-v7a'"
          if text.count(arm64_filter) != 1:
              raise SystemExit(
                  f"Expected exactly one {arm64_filter!r}; found {text.count(arm64_filter)}."
              )
          if "ndkVersion = \"28.2.13676358\"" not in text:
              raise SystemExit("Pinned Gradle file no longer declares NDK 28.2.13676358.")

          text = text.replace(arm64_filter, armv7_filter, 1)
          # CI must not attempt to upload native symbols to a Firebase project.
          text = text.replace("nativeSymbolUploadEnabled true", "nativeSymbolUploadEnabled false")
          text = text.replace("mappingFileUploadEnabled true", "mappingFileUploadEnabled false")
          gradle.write_text(text, encoding="utf-8")

          # The upstream build applies Google Services. Supply a deliberately
          # non-production CI config so the Gradle task can generate resources.
          # It does not provide working Firebase credentials or alter app code.
          google_services = {
              "project_info": {
                  "project_number": "000000000000",
                  "project_id": "ci-placeholder",
                  "storage_bucket": "ci-placeholder.appspot.com"
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                      "android_client_info": {"package_name": "org.levimc.launcher"}
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "CI_ONLY_NOT_A_REAL_KEY"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}}
              }],
              "configuration_version": "1"
          }
          Path("app/google-services.json").write_text(
              json.dumps(google_services, indent=2) + "\n", encoding="utf-8"
          )

          wrapper = Path("gradlew")
          if not wrapper.is_file():
              raise SystemExit("Gradle wrapper is missing from pinned upstream source.")
          wrapper.chmod(0o755)

          cmake = Path("app/src/main/cpp/CMakeLists.txt").read_text(encoding="utf-8")
          if "add_subdirectory(preloader)" not in cmake:
              raise SystemExit("Expected upstream Preloader target was not found.")
          if "add_subdirectory(libHttpClient/Build/libHttpClient.Android)" not in cmake:
              raise SystemExit("Expected upstream libHttpClient target was not found.")

          print("Pinned source revision verified:", actual)
          print("Application ABI configured as armeabi-v7a.")
          print("The app's own CMake native targets remain enabled.")
          PY

      - name: Verify the ARMv7 Preloader source path
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/cpp/preloader/CMakeLists.txt
          grep -q 'armeabi-v7a' app/src/main/cpp/preloader/CMakeLists.txt
          test -f app/src/main/cpp/preloader/lib/ARM/libGlossHook.a
          echo 'ARMv7 Preloader CMake branch and ARM hook archive are present.'

      - name: Build the actual LeviLauncher debug APK
        id: gradle_build
        working-directory: source
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/levilauncher-armv7-gradle.log"
          ./gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee "$LOG"

      - name: Summarize Gradle or native build failure
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/levilauncher-armv7-gradle.log"
          {
            echo '## ARMv7 build failure details'
            echo
            if [ -s "$LOG" ]; then
              echo '```text'
              grep -n -E 'FAILURE:|What went wrong:|fatal error:|error:|undefined reference|cannot find|No such file|CMake Error|FAILED:|ninja: build stopped' "$LOG" | tail -n 100 || true
              echo '```'
            else
              echo 'Gradle did not create a log; inspect SDK setup and source-checkout steps.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK architecture and actual runtime readiness
        id: runtime_audit
        if: success()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          BADGING="$RUNNER_TEMP/levilauncher-badging.txt"
          LIBLIST="$RUNNER_TEMP/levilauncher-armv7-libraries.txt"
          REPORT="$RUNNER_TEMP/levilauncher-armv7-runtime-report.txt"
          READELF="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt" dump badging "$APK" > "$BADGING"
          grep -q "native-code: 'armeabi-v7a'" "$BADGING"
          if grep -q 'arm64-v8a' "$BADGING"; then
            echo 'Unexpected arm64-v8a ABI declaration.' | tee "$REPORT"
            exit 1
          fi

          unzip -Z1 "$APK" | grep '^lib/armeabi-v7a/.*\.so$' | sort > "$LIBLIST" || true
          if [ ! -s "$LIBLIST" ]; then
            echo 'No armeabi-v7a native libraries were packaged.' | tee "$REPORT"
            exit 1
          fi

          # Every packaged shared object must actually be ELF32/EM_ARM.
          while IFS= read -r entry; do
            tmp="$RUNNER_TEMP/check-native.so"
            unzip -p "$APK" "$entry" > "$tmp"
            header="$("$READELF" -h "$tmp")"
            printf '%s\n' "$header" | grep -q 'Class:.*ELF32'
            printf '%s\n' "$header" | grep -q 'Machine:.*ARM'
          done < "$LIBLIST"

          missing=()
          for lib in \
            libpreloader.so \
            libgxcore.so \
            libmaesdk.so \
            libPlayFabMultiplayer.so \
            libinbuiltmods.so; do
            if ! grep -q "^lib/armeabi-v7a/${lib}$" "$LIBLIST"; then
              missing+=("$lib")
            fi
          done

          {
            echo '## ARMv7 APK audit'
            echo
            echo 'PASS: APK manifest advertises armeabi-v7a.'
            echo 'PASS: every packaged armeabi-v7a .so is ELF32 / EM_ARM.'
            echo
            echo 'Packaged ARMv7 libraries:'
            sed 's#^#- #' "$LIBLIST"
            echo
          } | tee "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          if ((${#missing[@]})); then
            {
              echo 'RUNTIME_READY=false'
              echo
              echo 'No installable APK will be published. Required ARMv7 native components are missing:'
              for lib in "${missing[@]}"; do echo "- ${lib}"; done
              echo
              echo 'A green workflow status means the ARMv7 compile/audit completed; it does not mean Minecraft can launch.'
            } | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'RUNTIME_READY=true' | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            cp "$APK" "$RUNNER_TEMP/LeviLauncher-v1.5.27-ARMv7-debug.apk"
          fi

      - name: Upload installable APK only when runtime dependencies are complete
        if: success() && steps.runtime_audit.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-v1.5.27-ARMv7-debug-APK
          path: ${{ runner.temp }}/LeviLauncher-v1.5.27-ARMv7-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-v1.5.27-ARMv7-build-diagnostics
          path: |
            ${{ runner.temp }}/levilauncher-armv7-gradle.log
            ${{ runner.temp }}/levilauncher-badging.txt
            ${{ runner.temp }}/levilauncher-armv7-libraries.txt
            ${{ runner.temp }}/levilauncher-armv7-runtime-report.txt
          if-no-files-found: ignore
          retention-days: 14
