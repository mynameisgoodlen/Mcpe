                          ZipEntry e = entries.nextElement();
                          count++;
                          String name = e.getName();
                          if (name.startsWith("lib/")) {
                              libLines.add("    " + name + " size=" + e.getSize() + " compressed=" + e.getCompressedSize()
                                      + (e.getMethod() == ZipEntry.STORED ? " STORED" : " deflated"));
                          }
                      }
                      sb.append("  entries=").append(count).append('\n');
                      for (String l : libLines) sb.append(l).append('\n');
                  } catch (Throwable t) {
                      sb.append("  zip listing failed: ").append(t).append('\n');
                  } finally {
                      if (zf != null) {
                          try {
                              zf.close();
                          } catch (Throwable ignored) {
                          }
                      }
                  }
                  return sb.toString();
              }

              private static void collectFiles(File dir, String suffix, int depth, int maxDepth, List<File> into, int limit) {
                  if (dir == null || depth > maxDepth || into.size() >= limit) return;
                  File[] files = dir.listFiles();
                  if (files == null) return;
                  for (File f : files) {
                      if (into.size() >= limit) return;
                      if (f.isDirectory()) {
                          collectFiles(f, suffix, depth + 1, maxDepth, into, limit);
                      } else if (f.getName().endsWith(suffix)) {
                          into.add(f);
                      }
                  }
              }

              public static String elfSummary(File f) {
                  RandomAccessFile raf = null;
                  try {
                      raf = new RandomAccessFile(f, "r");
                      byte[] ident = new byte[16];
                      raf.readFully(ident);
                      if (ident[0] != 0x7f || ident[1] != 'E' || ident[2] != 'L' || ident[3] != 'F') return "NOT-ELF";
                      int cls = ident[4];
                      ByteOrder order = ident[5] == 1 ? ByteOrder.LITTLE_ENDIAN : ByteOrder.BIG_ENDIAN;
                      if (cls != 1) return "ELF" + (cls == 2 ? "64" : "?") + " (not 32-bit)";
                      byte[] hb = new byte[52];
                      raf.seek(0);
                      raf.readFully(hb);
                      ByteBuffer h = ByteBuffer.wrap(hb).order(order);
                      int machine = h.getShort(18) & 0xffff;
                      long phoff = h.getInt(28) & 0xffffffffL;
                      int phentsize = h.getShort(42) & 0xffff;
                      int phnum = h.getShort(44) & 0xffff;
                      StringBuilder sb = new StringBuilder();
                      sb.append("ELF32 machine=").append(machine == 40 ? "ARM" : String.valueOf(machine));
                      long[][] loads = new long[Math.max(phnum, 1)][3];
                      int loadCount = 0;
                      long dynOff = -1;
                      long dynSize = 0;
                      for (int i = 0; i < phnum && phentsize >= 32; i++) {
                          byte[] pb = new byte[32];
                          raf.seek(phoff + (long) i * phentsize);
                          raf.readFully(pb);
                          ByteBuffer p = ByteBuffer.wrap(pb).order(order);
                          int type = p.getInt(0);
                          long offset = p.getInt(4) & 0xffffffffL;
                          long vaddr = p.getInt(8) & 0xffffffffL;
                          long filesz = p.getInt(16) & 0xffffffffL;
                          if (type == 1) {
                              loads[loadCount][0] = vaddr;
                              loads[loadCount][1] = offset;
                              loads[loadCount][2] = filesz;
                              loadCount++;
                          } else if (type == 2) {
                              dynOff = offset;
                              dynSize = filesz;
                          }
                      }
                      if (dynOff < 0 || dynSize <= 0 || dynSize > 1024 * 1024) return sb.toString() + " (no dynamic section)";
                      byte[] db = new byte[(int) dynSize];
                      raf.seek(dynOff);
                      raf.readFully(db);
                      ByteBuffer d = ByteBuffer.wrap(db).order(order);
                      long strtab = 0;
                      List<Long> needed = new ArrayList<Long>();
                      long soname = -1;
                      for (int i = 0; i + 8 <= db.length; i += 8) {
                          int tag = d.getInt(i);
                          long val = d.getInt(i + 4) & 0xffffffffL;
                          if (tag == 0) break;
                          if (tag == 1) needed.add(val);
                          else if (tag == 5) strtab = val;
                          else if (tag == 14) soname = val;
                      }
                      long strOff = -1;
                      for (int i = 0; i < loadCount; i++) {
                          if (strtab >= loads[i][0] && strtab < loads[i][0] + loads[i][2]) {
                              strOff = loads[i][1] + (strtab - loads[i][0]);
                              break;
                          }
                      }
                      if (strOff < 0) return sb.toString() + " (string table not found)";
                      if (soname >= 0) sb.append(" soname=").append(readCString(raf, strOff + soname));
                      sb.append(" needed=[");
                      int shown = 0;
                      for (Long n : needed) {
                          if (shown++ >= 40) break;
                          if (shown > 1) sb.append(", ");
                          sb.append(readCString(raf, strOff + n));
                      }
                      sb.append(']');
                      return sb.toString();
                  } catch (Throwable t) {
                      return "elf-read-failed(" + t.getClass().getSimpleName() + ")";
                  } finally {
                      if (raf != null) {
                          try {
                              raf.close();
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }

              private static String readCString(RandomAccessFile raf, long offset) throws java.io.IOException {
                  raf.seek(offset);
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < 256; i++) {
                      int b = raf.read();
                      if (b <= 0) break;
                      sb.append((char) b);
                  }
                  return sb.toString();
              }

              private static void appendDexLoaderDetails(StringBuilder sb, ClassLoader cl) {
                  try {
                      Class<?> base = Class.forName("dalvik.system.BaseDexClassLoader");
                      if (!base.isInstance(cl)) return;
                      Field pathListField = base.getDeclaredField("pathList");
                      pathListField.setAccessible(true);
                      Object pathList = pathListField.get(cl);
                      if (pathList == null) return;
                      Field elementsField = pathList.getClass().getDeclaredField("dexElements");
                      elementsField.setAccessible(true);
                      Object[] elements = (Object[]) elementsField.get(pathList);
                      sb.append("      dexElements=").append(elements == null ? 0 : elements.length).append('\n');
                      if (elements != null) {
                          for (int i = 0; i < elements.length && i < 24; i++) {
                              Object e = elements[i];
                              String dexName = "null";
                              String pathText = "null";
                              try {
                                  Field dexFile = e.getClass().getDeclaredField("dexFile");
                                  dexFile.setAccessible(true);
                                  Object df = dexFile.get(e);
                                  if (df != null) dexName = String.valueOf(df.getClass().getMethod("getName").invoke(df));
                              } catch (Throwable ignored) {
                              }
                              try {
                                  Field p = e.getClass().getDeclaredField("path");
                                  p.setAccessible(true);
                                  pathText = String.valueOf(p.get(e));
                              } catch (Throwable ignored) {
                              }
                              sb.append("        element[").append(i).append("] dex=").append(dexName)
                                      .append(" path=").append(pathText).append('\n');
                          }
                      }
                      try {
                          Field nativeDirs = pathList.getClass().getDeclaredField("nativeLibraryDirectories");
                          nativeDirs.setAccessible(true);
                          sb.append("      nativeLibraryDirectories=").append(nativeDirs.get(pathList)).append('\n');
                      } catch (Throwable ignored) {
                      }
                  } catch (Throwable t) {
                      sb.append("      (could not read dex details: ").append(t.getClass().getSimpleName()).append(")\n");
                  }
              }

              private static String snapshotText(String reason) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("reason: ").append(reason).append('\n');
                  sb.append("key stages so far:\n");
                  synchronized (STAGES) {
                      for (Map.Entry<String, String> e : STAGES.entrySet()) {
                          sb.append("  ").append(e.getKey()).append(" -> ").append(e.getValue()).append('\n');
                      }
                  }
                  sb.append("mapped game/launcher files (from /proc/self/maps):\n").append(mapsSummary());
                  Context ctx = appContext;
                  if (ctx != null) sb.append(memoryText(ctx));
                  return sb.toString();
              }

              private static final String[] MAP_KEYWORDS = {"minecraft", "levimc", "pairip", "PlayFab", "maesdk", "fmod",
                      "HttpClient", "libc++", "preloader", "gxcore", "leviworld", "renderD", "MediaDecoders", "MallocRedirect",
                      ".odex", ".vdex", ".apk", "split_"};

              private static String mapsSummary() {
                  StringBuilder sb = new StringBuilder();
                  BufferedReader reader = null;
                  try {
                      reader = new BufferedReader(new FileReader("/proc/self/maps"));
                      LinkedHashMap<String, long[]> perFile = new LinkedHashMap<String, long[]>();
                      LinkedHashMap<String, String> perms = new LinkedHashMap<String, String>();
                      String l;
                      while ((l = reader.readLine()) != null) {
                          String[] p = l.trim().split("\s+", 6);
                          if (p.length < 6) continue;
                          String file = p[5];
                          boolean interesting = false;
                          for (String k : MAP_KEYWORDS) {
                              if (file.contains(k)) {
                                  interesting = true;
                                  break;
                              }
                          }
                          if (!interesting) continue;
                          String[] range = p[0].split("-");
                          long start = Long.parseLong(range[0], 16);
                          long end = Long.parseLong(range[1], 16);
                          long[] acc = perFile.get(file);
                          if (acc == null) {
                              acc = new long[]{0, start, 0};
                              perFile.put(file, acc);
                          }
                          acc[0] += end - start;
                          acc[2]++;
                          String have = perms.get(file);
                          perms.put(file, have == null ? p[1] : (have.contains(p[1]) ? have : have + "," + p[1]));
                      }
                      for (Map.Entry<String, long[]> e : perFile.entrySet()) {
                          long[] v = e.getValue();
                          sb.append("  ").append(e.getKey()).append("  ").append(v[0] / 1024).append("KB  maps=").append(v[2])
                                  .append(" first=0x").append(Long.toHexString(v[1])).append(" perms=").append(perms.get(e.getKey()))
                                  .append('\n');
                      }
                      if (perFile.isEmpty()) sb.append("  (none)\n");
                  } catch (Throwable t) {
                      sb.append("  maps read failed: ").append(t).append('\n');
                  } finally {
                      if (reader != null) {
                          try {
                              reader.close();
                          } catch (Throwable ignored) {
                          }
                      }
                  }
                  return sb.toString();
              }

              private static int mappedCount(String libName) {
                  int count = 0;
                  BufferedReader reader = null;
                  try {
                      reader = new BufferedReader(new FileReader("/proc/self/maps"));
                      String l;
                      while ((l = reader.readLine()) != null) {
                          if (l.endsWith("/" + libName)) count++;
                      }
                  } catch (Throwable ignored) {
                  } finally {
                      if (reader != null) {
                          try {
                              reader.close();
                          } catch (Throwable ignored) {
                          }
                      }
                  }
                  return count;
              }

              public static String stackToString(Throwable t) {
                  StringWriter sw = new StringWriter();
                  PrintWriter pw = new PrintWriter(sw);
                  t.printStackTrace(pw);
                  pw.flush();
                  return sw.toString();
              }

              private static String stackText(StackTraceElement[] st, int max) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < st.length && i < max; i++) sb.append("      at ").append(st[i]).append('\n');
                  if (st.length > max) sb.append("      ... ").append(st.length - max).append(" more\n");
                  return sb.toString();
              }

              private static String allThreadStacks(int maxFrames) {
                  StringBuilder sb = new StringBuilder();
                  try {
                      Map<Thread, StackTraceElement[]> all = Thread.getAllStackTraces();
                      List<Thread> threads = new ArrayList<Thread>(all.keySet());
                      Collections.sort(threads, new Comparator<Thread>() {
                          @Override
                          public int compare(Thread a, Thread b) {
                              return a.getName().compareTo(b.getName());
                          }
                      });
                      for (Thread t : threads) {
                          StackTraceElement[] st = all.get(t);
                          sb.append("  thread \"").append(t.getName()).append("\" id=").append(t.getId()).append(" state=")
                                  .append(t.getState()).append(t.isDaemon() ? " daemon" : "").append('\n');
                          if (st != null) sb.append(stackText(st, maxFrames));
                      }
                  } catch (Throwable t) {
                      sb.append("  thread dump failed: ").append(t).append('\n');
                  }
                  return sb.toString();
              }

              private static void installCrashHooks() {
                  try {
                      final Thread.UncaughtExceptionHandler previous = Thread.getDefaultUncaughtExceptionHandler();
                      Thread.setDefaultUncaughtExceptionHandler(new Thread.UncaughtExceptionHandler() {
                          @Override
                          public void uncaughtException(Thread thread, Throwable error) {
                              try {
                                  failure("UNCAUGHT JAVA EXCEPTION on thread " + thread.getName(), error, "process is about to die");
                              } catch (Throwable ignored) {
                              }
                              if (previous != null) {
                                  previous.uncaughtException(thread, error);
                                  try {
                                      injectIntoLatestTombstones("after previous uncaughtException handler");
                                  } catch (Throwable ignored) {
                                  }
                              }
                          }
                      });
                      line("installed uncaught-exception hook (previous=" + previous + ")");
                  } catch (Throwable t) {
                      line("could not install uncaught-exception hook: " + t);
                  }
                  hookXcrashCallback("xcrash.NativeHandler", "native");
                  hookXcrashCallback("xcrash.JavaCrashHandler", "java");
              }

              private static void hookXcrashCallback(String handlerClassName, final String typeLabel) {
                  try {
                      final Class<?> callbackType = Class.forName("xcrash.ICrashCallback");
                      Class<?> handlerClass = Class.forName(handlerClassName);
                      Method getInstance = handlerClass.getDeclaredMethod("getInstance");
                      getInstance.setAccessible(true);
                      Object instance = getInstance.invoke(null);
                      int hookedCount = 0;
                      for (Field f : handlerClass.getDeclaredFields()) {
                          if (!callbackType.isAssignableFrom(f.getType())) continue;
                          f.setAccessible(true);
                          final Object previousCallback = f.get(instance);
                          InvocationHandler handler = new InvocationHandler() {
                              @Override
                              public Object invoke(Object proxy, Method method, Object[] args) throws Throwable {
                                  String name = method.getName();
                                  if ("onCrash".equals(name) && args != null && args.length >= 1) {
                                      try {
                                          String logPath = String.valueOf(args[0]);
                                          String emergency = args.length > 1 ? String.valueOf(args[1]) : "";
                                          onXcrashFired(typeLabel, logPath, emergency);
                                      } catch (Throwable ignored) {
                                      }
                                  }
                                  if ("toString".equals(name)) return "GameDiagnostics " + typeLabel + " crash callback";
                                  if ("hashCode".equals(name)) return System.identityHashCode(proxy);
                                  if ("equals".equals(name)) return args != null && args.length == 1 && proxy == args[0];
                                  if (previousCallback != null) {
                                      try {
                                          return method.invoke(previousCallback, args);
                                      } catch (InvocationTargetException e) {
                                          throw e.getCause() != null ? e.getCause() : e;
                                      }
                                  }
                                  return null;
                              }
                          };
                          Object proxy = Proxy.newProxyInstance(callbackType.getClassLoader(), new Class<?>[]{callbackType}, handler);
                          f.set(instance, proxy);
                          hookedCount++;
                      }
                      line("hooked " + hookedCount + " ICrashCallback field(s) on " + handlerClassName);
                  } catch (Throwable t) {
                      line("could not hook " + handlerClassName + ": " + t);
                  }
              }

              private static void onXcrashFired(String typeLabel, String logPath, String emergency) {
                  StringBuilder sb = new StringBuilder();
                  sb.append("\n===== XCRASH ").append(typeLabel.toUpperCase(Locale.US)).append(" CALLBACK (").append(stamp()).append(") =====\n");
                  sb.append("tombstone file: ").append(logPath).append('\n');
                  sb.append("emergency: ").append(emergency).append('\n');
                  sb.append("--- state snapshot ---\n").append(snapshotText(typeLabel + " crash")).append('\n');
                  write(sb.toString(), true);

                  try {
                      File f = new File(logPath);
                      injectFullDiagnosticsIntoTombstone(f, "live xCrash " + typeLabel + " callback");
                      appendTombstone(f, "copied live from xCrash " + typeLabel + " callback");
                      Context ctx = appContext;
                      if (ctx != null) rememberAttached(ctx, f.getName());
                  } catch (Throwable t) {
                      write("could not process tombstone " + logPath + ": " + t + "\n", true);
                  }
              }

              private static void injectFullDiagnosticsIntoTombstone(File tombstone, String trigger) {
                  if (tombstone == null || !tombstone.isFile() || !tombstone.canWrite()) return;
                  try {
                      String existing = readText(tombstone.getAbsolutePath(), 64 * 1024);
                      if (existing.contains("===== EMBEDDED LEVILAUNCHER DIAGNOSTICS")) return;
                      FileOutputStream fos = new FileOutputStream(tombstone, true);
                      try {
                          StringBuilder payload = new StringBuilder();
                          payload.append("\n\n================================================================================\n");
                          payload.append("===== EMBEDDED LEVILAUNCHER DIAGNOSTICS ").append(VERSION).append(" (").append(trigger).append(") =====\n");
                          payload.append("================================================================================\n");
                          payload.append(snapshotText("embedded into tombstone")).append("\n");
                          synchronized (LOCK) {
                              payload.append(SESSION_BUFFER.toString());
                          }
                          payload.append("\n===== END EMBEDDED LEVILAUNCHER DIAGNOSTICS =====\n");
                          fos.write(payload.toString().getBytes("UTF-8"));
                          fos.flush();
                      } finally {
                          fos.close();
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private static void injectIntoLatestTombstones(String trigger) {
                  Context ctx = appContext;
                  if (ctx == null) return;
                  List<File> dirs = new ArrayList<File>();
                  try {
                      File media = new File(Environment.getExternalStorageDirectory(), "Android/media/" + ctx.getPackageName() + "/crash_logs");
                      if (media.isDirectory()) dirs.add(media);
                  } catch (Throwable ignored) {
                  }
                  try {
                      File ext = ctx.getExternalFilesDir(null);
                      if (ext != null) dirs.add(ext);
                  } catch (Throwable ignored) {
                  }
                  dirs.add(ctx.getFilesDir());
                  List<File> found = new ArrayList<File>();
                  for (File d : dirs) collectFiles(d, ".xcrash", 0, 4, found, 30);
                  long recentCutoff = System.currentTimeMillis() - 120 * 1000L;
                  for (File f : found) {
                      if (f.lastModified() >= recentCutoff) {
                          injectFullDiagnosticsIntoTombstone(f, trigger);
                      }
                  }
              }

              private static void appendTombstone(File f, String why) {
                  try {
                      if (f == null || !f.isFile()) {
                          write("===== CRASH TOMBSTONE " + f + " not readable (" + why + ") =====\n", true);
                          return;
                      }
                      long len = f.length();
                      long cap = 512L * 1024;
                      byte[] data = new byte[(int) Math.min(len, cap)];
                      RandomAccessFile raf = new RandomAccessFile(f, "r");
                      try {
                          raf.readFully(data);
                      } finally {
                          raf.close();
                      }
                      write("\n===== CRASH TOMBSTONE " + f.getName() + " size=" + len + " (" + why + ") =====\n"
                              + new String(data, "UTF-8") + "\n===== end CRASH TOMBSTONE =====\n", true);
                  } catch (Throwable t) {
                      write("appending tombstone failed: " + t + "\n", true);
                  }
              }

              private static File attachedStateFile(Context ctx) {
                  return new File(ctx.getFilesDir(), "levi-diagnostics-attached.txt");
              }

              private static Set<String> readAttached(Context ctx) {
                  Set<String> names = new HashSet<String>();
                  String text = readText(attachedStateFile(ctx).getAbsolutePath(), 200000);
                  for (String l : text.split("\n")) {
                      if (l.trim().length() > 0) names.add(l.trim());
                  }
                  return names;
              }

              private static void rememberAttached(Context ctx, String name) {
                  try {
                      FileOutputStream s = new FileOutputStream(attachedStateFile(ctx), true);
                      s.write((name + "\n").getBytes("UTF-8"));
                      s.close();
                  } catch (Throwable ignored) {
                  }
              }

              private static void attachPreviousCrashes(Context ctx) {
                  Set<String> attached = readAttached(ctx);
                  List<File> roots = new ArrayList<File>();
                  roots.add(ctx.getFilesDir());
                  try {
                      File external = ctx.getExternalFilesDir(null);
                      if (external != null) roots.add(external);
                  } catch (Throwable ignored) {
                  }
                  try {
                      File media = new File(Environment.getExternalStorageDirectory(), "Android/media/" + ctx.getPackageName() + "/crash_logs");
                      if (media.isDirectory()) roots.add(media);
                  } catch (Throwable ignored) {
                  }
                  List<File> tombstones = new ArrayList<File>();
                  for (File root : roots) collectFiles(root, ".xcrash", 0, 4, tombstones, 60);
                  Collections.sort(tombstones, new Comparator<File>() {
                      @Override
                      public int compare(File a, File b) {
                          return Long.valueOf(a.lastModified()).compareTo(Long.valueOf(b.lastModified()));
                      }
                  });
                  long cutoff = System.currentTimeMillis() - 4L * 24 * 3600 * 1000;
                  List<File> fresh = new ArrayList<File>();
                  for (File f : tombstones) {
                      if (f.lastModified() >= cutoff && !attached.contains(f.getName())) fresh.add(f);
                  }
                  int from = Math.max(0, fresh.size() - 3);
                  for (int i = from; i < fresh.size(); i++) {
                      appendTombstone(fresh.get(i), "found at start-up; belongs to an earlier session");
                      rememberAttached(ctx, fresh.get(i).getName());
                  }
              }

              private static void startLogcatTee() {
                  Thread t = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          java.lang.Process proc = null;
                          long written = 0;
                          boolean capNoted = false;
                          try {
                              proc = new ProcessBuilder("logcat", "-v", "threadtime").redirectErrorStream(true).start();
                              BufferedReader reader = new BufferedReader(new InputStreamReader(proc.getInputStream(), "UTF-8"), 32768);
                              String pidToken = String.valueOf(myPid);
                              String l;
                              while ((l = reader.readLine()) != null) {
                                  String[] p = l.split("\s+", 7);
                                  if (p.length < 6 || !p[2].equals(pidToken)) continue;
                                  if (p[5].startsWith("GameClassLoaderBridge") || p[5].startsWith("GameDiagnostics")) continue;
                                  String level = p[4];
                                  boolean important = "W".equals(level) || "E".equals(level) || "F".equals(level) || "A".equals(level);
                                  if (!important && !LOGCAT_KEYWORDS.matcher(l).find()) continue;
                                  fireTriggers(l);
                                  if (written + l.length() + 4 > LOGCAT_CAP) {
                                      if (!capNoted) {
                                          capNoted = true;
                                          write("LC [logcat capture cap reached; further lines dropped]\n", false);
                                      }
                                      continue;
                                  }
                                  written += l.length() + 4;
                                  write("LC " + l + "\n", false);
                              }
                          } catch (Throwable ignored) {
                          } finally {
                              if (proc != null) {
                                  try {
                                      proc.destroy();
                                  } catch (Throwable ignored) {
                                  }
                              }
                          }
                      }
                  }, "LeviDiag-logcat");
                  t.setDaemon(true);
                  t.start();
              }

              private static void fireTriggers(String logLine) {
                  String reason = null;
                  if (logLine.contains("super.onCreate starting")) reason = "Mojang MainActivity.onCreate starting";
                  else if (logLine.contains("super.onCreate failed")) reason = "Mojang MainActivity.onCreate failed";
                  else if (logLine.contains("Initialized official PairIP")) reason = "PairIP initialized";
                  else if (logLine.contains("Abort message")) reason = "abort message in logcat";
                  if (reason != null && FIRED_TRIGGERS.add(reason)) {
                      snapshot("logcat trigger: " + reason);
                      extendWatch(60000L);
                  }
              }

              private static void extendWatch(long ms) {
                  long until = SystemClock.elapsedRealtime() + ms;
                  if (until > watchUntil) watchUntil = until;
              }

              private static boolean isIdleTop(StackTraceElement top) {
                  String s = top.getClassName() + "." + top.getMethodName();
                  return s.contains("Object.wait") || s.contains("Unsafe.park") || s.contains("nativePollOnce")
                          || s.contains("Thread.sleep") || s.contains("LockSupport.park") || s.contains("Linux.poll")
                          || s.contains("Linux.epoll");
              }

              private static boolean skipThread(String name) {
                  return name.startsWith("LeviDiag") || name.startsWith("Binder:") || name.startsWith("Jit thread")
                          || name.startsWith("Profile Saver") || name.startsWith("Signal Catcher") || name.contains("Daemon")
                          || name.startsWith("RenderThread") || name.startsWith("HeapTaskDaemon");
              }

              private static void startThreadWatcher() {
                  Thread t = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          while (true) {
                              try {
                                  Thread.sleep(450);
                                  if (SystemClock.elapsedRealtime() > watchUntil) continue;
                                  sampleThreads();
                              } catch (Throwable ignored) {
