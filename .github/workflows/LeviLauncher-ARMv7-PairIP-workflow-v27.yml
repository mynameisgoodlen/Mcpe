              private static void trimIfHuge(File f) {
                  try {
                      if (!f.isFile() || f.length() <= FILE_TRIM_AT) return;
                      RandomAccessFile raf = new RandomAccessFile(f, "r");
                      byte[] tail = new byte[(int) FILE_KEEP];
                      raf.seek(f.length() - FILE_KEEP);
                      raf.readFully(tail);
                      raf.close();
                      FileOutputStream rewrite = new FileOutputStream(f, false);
                      rewrite.write("[older diagnostics trimmed to keep the file small]\n".getBytes("UTF-8"));
                      rewrite.write(tail);
                      rewrite.close();
                  } catch (Throwable ignored) {
                  }
              }

