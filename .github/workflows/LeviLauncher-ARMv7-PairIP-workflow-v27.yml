              private static void hookActivityCreation(Context context, ClassLoader game) {
                  Object loadedApk = null;
                  try {
                      Class<?> activityThreadClass = Class.forName("android.app.ActivityThread");
                      Object thread = activityThreadClass.getMethod("currentActivityThread").invoke(null);
                      if (thread == null) throw new IllegalStateException("No ActivityThread");
                      loadedApk = activityThreadClass.getMethod("peekPackageInfo", String.class, Boolean.TRUE.getClass() == Class.class ? Boolean.class : Boolean.TYPE)
                              .invoke(thread, context.getPackageName(), Boolean.TRUE);
                      if (loadedApk == null) throw new IllegalStateException("No LoadedApk for " + context.getPackageName());
                      Field field = loadedApk.getClass().getDeclaredField("mAppComponentFactory");
                      field.setAccessible(true);
                      Object existing = field.get(loadedApk);
                      if (existing instanceof GameComponentFactory) {
                          factoryHook = "already GameComponentFactory";
                      } else {
                          field.set(loadedApk, new GameComponentFactory());
                          factoryHook = "hooked (previous factory: " + (existing == null ? "null" : existing.getClass().getName()) + ")";
                      }
                  } catch (Throwable t) {
                      factoryHook = "FAILED: " + t;
                  }
                  trace("AppComponentFactory: " + factoryHook);

                  try {
                      if (loadedApk == null) throw new IllegalStateException("No LoadedApk");
                      Field classLoaderField = loadedApk.getClass().getDeclaredField("mClassLoader");
                      classLoaderField.setAccessible(true);
                      Object current = classLoaderField.get(loadedApk);
                      if (!(current instanceof ClassLoader)) throw new IllegalStateException("LoadedApk has no ClassLoader");
                      ClassLoader base = (ClassLoader) current;
                      if (base instanceof ActivityRoutingLoader && base.getParent() != null) base = base.getParent();
                      classLoaderField.set(loadedApk, new ActivityRoutingLoader(base, game));
                      routerHook = "installed (base loader: " + base.getClass().getSimpleName() + ")";
                  } catch (Throwable t) {
                      routerHook = "FAILED: " + t;
                  }
                  trace("Activity class-loader router: " + routerHook);
              }

              private static void installFromApplication() throws Exception {
                  Object application = Class.forName("android.app.ActivityThread")
                          .getMethod("currentApplication").invoke(null);
                  if (!(application instanceof Context)) throw new IllegalStateException("No current application");
                  obtainGameLoader((Context) application);
              }

              public static Activity newGameActivity(String className) {
                  if (!ACTIVITY_CLASS.equals(className)) return null;
                  factoryRequests++;
                  if (gameLoader == null) {
                      trace("GameComponentFactory: game loader not created yet, creating it from the application context");
                      try {
                          installFromApplication();
                      } catch (Throwable t) {
                          trace("On-demand game loader creation failed: " + GameDiagnostics.stackToString(t));
                      }
                  }
                  ClassLoader loader = gameLoader;
                  if (loader == null) {
                      factoryResult = "game loader unavailable, default launcher-loader activity used";
                      trace("GameComponentFactory: " + factoryResult);
                      return null;
                  }
                  trace("GameComponentFactory: creating MinecraftActivity through the game ClassLoader");
                  try {
                      Constructor<?> constructor = loader.loadClass(className).getDeclaredConstructor();
                      Activity created = (Activity) constructor.newInstance();
                      factoryResult = "created through the game loader";
                      return created;
                  } catch (Throwable t) {
                      factoryResult = "failed: " + t;
                      trace("Could not instantiate " + className + " through the game ClassLoader: " + GameDiagnostics.stackToString(t));
                      return null;
                  }
              }

              private static final class ActivityRoutingLoader extends PathClassLoader {
                  private final ClassLoader game;
                  private final ClassLoader base;

                  ActivityRoutingLoader(ClassLoader parent, ClassLoader game) {
                      super("", null, parent);
                      this.base = parent;
                      this.game = game;
                  }

                  @Override
                  protected Class<?> loadClass(String name, boolean resolve) throws ClassNotFoundException {
                      if (ACTIVITY_CLASS.equals(name)) {
                          noteRouted();
                          return game.loadClass(name);
                      }
                      return super.loadClass(name, resolve);
                  }

                  @Override
                  public String findLibrary(String name) {
                      if (game instanceof BaseDexClassLoader) {
                          String found = ((BaseDexClassLoader) game).findLibrary(name);
                          if (found != null) return found;
                      }
                      if (base instanceof BaseDexClassLoader) return ((BaseDexClassLoader) base).findLibrary(name);
                      return null;
                  }
              }

              private static final class LauncherDelegatingParent extends ClassLoader {
                  private final ClassLoader launcherLoader;

                  LauncherDelegatingParent(ClassLoader launcherLoader) {
                      super((ClassLoader) null);
                      this.launcherLoader = launcherLoader;
                  }

                  @Override
                  protected Class<?> loadClass(String name, boolean resolve) throws ClassNotFoundException {
                      if (isGameClass(name)) {
                          boolean launcherHasCopy;
                          try {
                              Class.forName(name, false, launcherLoader);
                              launcherHasCopy = true;
                          } catch (Throwable ignored) {
                              launcherHasCopy = false;
                          }
                          noteRequest(name, launcherHasCopy);
                          throw new ClassNotFoundException(name);
                      }
                      try {
                          return launcherLoader.loadClass(name);
                      } catch (ClassNotFoundException e) {
                          noteRequest(name, false);
                          throw e;
                      }
                  }
              }
          }
