          def patch_manifest_for_game_component_factory(manifest_path):
              factory = "org.levimc.launcher.core.minecraft.GameComponentFactory"
              text = manifest_path.read_text(encoding="utf-8")

              manifest_match = re.search(r'<manifest\b[^>]*>', text)
              if not manifest_match:
                  raise SystemExit("AndroidManifest.xml has no <manifest> tag; refusing to guess")
              manifest_tag = manifest_match.group(0)
              if "xmlns:tools=" not in manifest_tag:
                  new_manifest_tag = manifest_tag[:-1].rstrip() + ' xmlns:tools="http://schemas.android.com/tools">'
                  text = text[:manifest_match.start()] + new_manifest_tag + text[manifest_match.end():]

              app_match = re.search(r'<application\b[^>]*>', text)
              if not app_match:
                  raise SystemExit("AndroidManifest.xml has no <application> tag; refusing to guess")
              tag = app_match.group(0)
              if tag.endswith("/>"):
                  raise SystemExit("Unexpected self-closing <application> tag")

              if re.search(r'android:appComponentFactory\s*=', tag):
                  new_tag = re.sub(
                      r'android:appComponentFactory\s*=\s*"[^"]*"',
                      'android:appComponentFactory="' + factory + '"',
                      tag,
                      count=1,
                  )
              else:
                  new_tag = tag[:-1].rstrip() + '\n        android:appComponentFactory="' + factory + '">'

              replace_match = re.search(r'tools:replace\s*=\s*"([^"]*)"', new_tag)
              if replace_match:
                  items = [i.strip() for i in replace_match.group(1).split(",") if i.strip()]
                  if "android:appComponentFactory" not in items:
                      items.append("android:appComponentFactory")
                      new_tag = (
                          new_tag[:replace_match.start()]
                          + 'tools:replace="' + ",".join(items) + '"'
                          + new_tag[replace_match.end():]
                      )
              else:
                  new_tag = new_tag[:-1].rstrip() + '\n        tools:replace="android:appComponentFactory">'

              text = text[:app_match.start()] + new_tag + text[app_match.end():]
              manifest_path.write_text(text, encoding="utf-8")


          def patch_minecraft_activity_super_failure(activity_path):
              text = activity_path.read_text(encoding="utf-8")
              marker = '"Mojang MainActivity super.onCreate failed"'
              if text.count(marker) != 1:
                  raise SystemExit("Could not find the unique 'super.onCreate failed' trace line in MinecraftActivity.kt")
              idx = text.index(marker)
              catches = list(re.finditer(r'catch\s*\(\s*(\w+)\s*:\s*Throwable\s*\)', text[:idx]))
              if not catches:
                  raise SystemExit("Could not find the Throwable catch that owns the 'super.onCreate failed' trace line")
              var = catches[-1].group(1)
              call = "returnToLauncherAfterLaunchFailure()"
              cpos = text.find(call, idx)
              if cpos < 0 or cpos - idx > 400:
                  raise SystemExit("Could not find returnToLauncherAfterLaunchFailure() right after the 'super.onCreate failed' trace line")
              line_start = text.rfind("\n", 0, cpos) + 1
              indent = text[line_start:cpos]
              if indent.strip():
                  raise SystemExit("Unexpected layout around returnToLauncherAfterLaunchFailure(); refusing to patch")
              replacement = (
                  "GameClassLoaderBridge.reportActivityFailure(this, " + var + ")\n"
                  + indent + "throw RuntimeException(\"Mojang MainActivity.onCreate failed [\" + GameClassLoaderBridge.describeActivity(this) + \"]: \" + " + var + ", " + var + ")"
              )
              text = text[:cpos] + replacement + text[cpos + len(call):]
              if text.count("GameClassLoaderBridge.reportActivityFailure(this, ") != 1:
                  raise SystemExit("MinecraftActivity failure rethrow patch was not applied exactly once")
              activity_path.write_text(text, encoding="utf-8")


          def install_game_loader_bridge(workspace, kotlin_text):
              package_dir = workspace / "source/app/src/main/java/org/levimc/launcher/core/minecraft"
              manifest = workspace / "source/app/src/main/AndroidManifest.xml"
              if not package_dir.is_dir():
                  raise SystemExit(f"Launcher package directory missing: {package_dir}")
              if not manifest.is_file():
                  raise SystemExit(f"AndroidManifest.xml missing: {manifest}")
              for name in ("GameClassLoaderBridge.java", "GameComponentFactory.kt", "GameDiagnostics.java"):
                  if (package_dir / name).exists():
                      raise SystemExit(f"{name} already exists in the pinned source; refusing to overwrite it")

              (package_dir / "GameClassLoaderBridge.java").write_text(GAME_CLASS_LOADER_BRIDGE_KT, encoding="utf-8")
              (package_dir / "GameComponentFactory.kt").write_text(GAME_COMPONENT_FACTORY_KT, encoding="utf-8")
              (package_dir / "GameDiagnostics.java").write_text(GAME_DIAGNOSTICS_JAVA, encoding="utf-8")

              anchor = "        val targetLoader = packageContext.classLoader\n"
              if kotlin_text.count(anchor) != 1:
                  raise SystemExit("Could not find the unique targetLoader line inside loadRuntimeNativeLibrary")
              kotlin_text = kotlin_text.replace(
                  anchor,
                  "        val targetLoader: ClassLoader = GameClassLoaderBridge.obtainGameLoader(context)\n",
                  1,
              )

              pairip_route = re.search(
                  r'(?ms)^(?P<head>[ \t]*\}\s*else if \(normalizedName == "pairipcore"\) \{\n)'
                  r'(?P<body>.*?)'
                  r'(?P<tail>^[ \t]*\}\s*else if \(normalizedName == "PlayFabMultiplayer" \|\| normalizedName == "maesdk"\) \{)',
                  kotlin_text,
              )
              if not pairip_route:
                  raise SystemExit("Could not find the pairipcore route")
              route_body = pairip_route.group("body")
              pairip_call = re.compile(r'(?m)^([ \t]*)initializeOfficialPairIp\(\)[ \t]*$')
              if len(pairip_call.findall(route_body)) != 1:
                  raise SystemExit("Could not find exactly one initializeOfficialPairIp() call in the pairipcore route")
              new_body = pairip_call.sub(
                  lambda m: m.group(1) + "GameClassLoaderBridge.initializePairIp(context)", route_body, count=1
              )
              kotlin_text = kotlin_text[:pairip_route.start("body")] + new_body + kotlin_text[pairip_route.end("body"):]

              begin_pat = re.compile(r'(?m)^([ \t]*)report\("Loading \$\{file\.name\} through Minecraft ClassLoader')
              if len(begin_pat.findall(kotlin_text)) == 1:
                  kotlin_text = begin_pat.sub(lambda m: m.group(1) + "GameDiagnostics.libLoadBegin(file)\n" + m.group(0), kotlin_text, count=1)
              end_pat = re.compile(r'(?m)^([ \t]*)report\("Loaded \$\{file\.name\} through Minecraft ClassLoader namespace"\)[ \t]*$')
              if len(end_pat.findall(kotlin_text)) == 1:
                  kotlin_text = end_pat.sub(lambda m: m.group(0) + "\n" + m.group(1) + "GameDiagnostics.libLoadEnd(file)", kotlin_text, count=1)

              patch_manifest_for_game_component_factory(manifest)
              activity_file = package_dir / "MinecraftActivity.kt"
              if not activity_file.is_file():
                  raise SystemExit(f"MinecraftActivity.kt missing: {activity_file}")
              patch_minecraft_activity_super_failure(activity_file)
              print("v27: dedicated game loader (with launcher nativeLibraryDir for libpreloader.so) + tombstone diagnostics injector written.")
              return kotlin_text


          def verify_game_loader_bridge_in_apk(apk_path):
              import zipfile

              if not apk_path.is_file():
                  raise SystemExit(f"Built APK not found for v27 verification: {apk_path}")
              with zipfile.ZipFile(apk_path) as z:
                  dex_blob = b"".join(
                      z.read(n) for n in z.namelist() if re.fullmatch(r"classes\d*\.dex", n)
                  )
                  manifest_blob = z.read("AndroidManifest.xml")
                  if "lib/armeabi-v7a/libpreloader.so" not in z.namelist():
                      raise SystemExit("APK is missing lib/armeabi-v7a/libpreloader.so")
              for descriptor in (
                  b"Lorg/levimc/launcher/core/minecraft/GameClassLoaderBridge;",
                  b"Lorg/levimc/launcher/core/minecraft/GameComponentFactory;",
                  b"Lorg/levimc/launcher/core/minecraft/GameDiagnostics;",
                  b"EMBEDDED LEVILAUNCHER DIAGNOSTICS",
                  b"findLib(preloader)=",
              ):
                  if descriptor not in dex_blob:
                      raise SystemExit("APK is missing " + descriptor.decode())
              if b"GameComponentFactory" not in manifest_blob and "GameComponentFactory".encode("utf-16-le") not in manifest_blob:
                  raise SystemExit("APK manifest does not reference GameComponentFactory")
              print("v27 verification: GameClassLoaderBridge + libpreloader.so path fix + Tombstone diagnostics injector verified in APK.")


          def prebuild_checks_and_safe_order():
