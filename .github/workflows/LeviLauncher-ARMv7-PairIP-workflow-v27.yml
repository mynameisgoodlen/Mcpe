name: Build LeviLauncher ARMv7 game-class-loader bridge + Full Crash Log Injector APK v27 (Android 10)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this builder workflow
        uses: actions/checkout@v4

      - name: Check out LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: 38764ca77b4fcb9c27ab3cec688e67e5166141df
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Fetch pinned recipe and build v27 candidate with libpreloader fix + full crash log injection
        id: build
        shell: bash
        env:
          TEMPLATE_COMMIT: a4ac407be409c912c7450335d9852885d831dfd4
        run: |
          set -euo pipefail
          TEMPLATE="$RUNNER_TEMP/LeviLauncher-ARMv7-PairIP-workflow-v5-template.yml"
          URL="https://raw.githubusercontent.com/mynameisgoodlen/Mcpe/${TEMPLATE_COMMIT}/.github/workflows/LeviLauncher-ARMv7-PairIP-workflow-v5.yml"
          curl --fail --silent --show-error --location "$URL" --retry 3 --retry-delay 2 -o "$TEMPLATE"
          test -s "$TEMPLATE"
          echo "Pinned recipe downloaded: $(wc -c < "$TEMPLATE") bytes"
          python3 - "$TEMPLATE" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          try:
              import yaml
          except ImportError:
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "--user", "--break-system-packages", "PyYAML"],
                  check=True,
              )
              import yaml

          template_path = Path(sys.argv[1])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          document = yaml.safe_load(template_path.read_text(encoding="utf-8"))
          jobs = document.get("jobs", {})
          if len(jobs) != 1:
              raise SystemExit(f"Expected one job in pinned recipe; got {len(jobs)}")
          steps = next(iter(jobs.values())).get("steps", [])
          if not steps:
              raise SystemExit("Pinned build recipe has no steps")

          old_pairip_line = "i + '} else if (normalizedName == "pairipcore" || normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk") {',"
          new_pairip_lines = "\n".join([
              "i + '} else if (normalizedName == "pairipcore") {',",
              "                  i + '    initializeOfficialPairIp()',",
              "                  i + '} else if (normalizedName == "PlayFabMultiplayer" || normalizedName == "maesdk") {',",
          ])
          old_dex_check = (
              "loader_dex = z.read('assets/runtime-native-loader.dex')\n"
              "if not loader_dex.startswith(b'dex\n') or len(loader_dex) < 100:\n"
              "    raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')"
          )
          new_dex_check = (
              "    loader_dex = z.read('assets/runtime-native-loader.dex')\n"
              "    if not loader_dex.startswith(b'dex\n') or len(loader_dex) < 100:\n"
              "        raise SystemExit('Standalone native-loader DEX asset is missing or invalid.')"
          )

          recipe_run_steps = []
          pairip_fix_count = 0
          dex_fix_count = 0
          for step in steps:
              if "run" not in step:
                  continue
              script = step["run"]
              if old_pairip_line in script:
                  if script.count(old_pairip_line) != 1:
                      raise SystemExit("PairIP branch patch was ambiguous; refusing to build")
                  script = script.replace(old_pairip_line, new_pairip_lines, 1)
                  pairip_fix_count += 1
              if old_dex_check in script:
                  if script.count(old_dex_check) != 1:
                      raise SystemExit("ZIP verifier patch was ambiguous; refusing to build")
                  script = script.replace(old_dex_check, new_dex_check, 1)
                  dex_fix_count += 1

              script = script.replace(
                  "LeviLauncher-ARMv7-build-log-v5", "LeviLauncher-ARMv7-build-log-v27"
              )
              script = script.replace(
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v5.apk",
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-v27.apk",
              )
              script = script.replace(
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v5",
                  "LeviLauncher-ARMv7-PAIRIP-CLASSLOADER-debug-APK-v27",
              )
              recipe_run_steps.append((step, script))

          if pairip_fix_count != 1:
              raise SystemExit(f"Expected exactly one PairIP loader patch; found {pairip_fix_count}")
          if dex_fix_count != 1:
              raise SystemExit(f"Expected exactly one ZIP verifier patch; found {dex_fix_count}")

          required_recipe_markers = (
              "PAIRIP_B64_00",
              "Bundle compressed ARMv7 PairIP dependency",
              "Extract and preload PlayFab and Mae dependencies before Minecraft",
              "Load the Minecraft native dependency chain with a shared game-parent classloader",
              "Compile standalone DEX entrypoint for the game-parent native loader",
              "Verify the APK targets ARMv7",
          )
          original_text = template_path.read_text(encoding="utf-8")
          missing = [marker for marker in required_recipe_markers if marker not in original_text]
          if missing:
              raise SystemExit("Pinned recipe is missing required sections: " + ", ".join(missing))

          any_failed = False
          build_failed = False
          run_count = 0

          def condition_allows(step):
              condition = str(step.get("if", "")).strip()
              if "always()" in condition:
                  return True
              if "failure()" in condition or "steps.build.outcome == 'failure'" in condition:
                  return any_failed or build_failed
              if "success()" in condition:
                  return not any_failed
              return not any_failed

          GAME_CLASS_LOADER_BRIDGE_KT = r'''package org.levimc.launcher.core.minecraft;

          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.util.Log;

          import dalvik.system.BaseDexClassLoader;
          import dalvik.system.DexFile;
          import dalvik.system.PathClassLoader;

          import java.io.File;
          import java.lang.reflect.Constructor;
          import java.lang.reflect.Field;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Enumeration;
          import java.util.HashSet;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Set;
          import java.util.zip.ZipFile;

          public final class GameClassLoaderBridge {
              private static final String TAG = "GameClassLoaderBridge";
              static final String ACTIVITY_CLASS = "org.levimc.launcher.core.minecraft.MinecraftActivity";
              private static final String GMS_NATIVE_LISTENER = "com.google.android.gms.tasks.NativeOnCompleteListener";
              private static final String MINECRAFT_PACKAGE = "com.mojang.minecraftpe";

              private static final String[] GAME_PACKAGES = {
                      "com.mojang.minecraftpe.",
                      "com.google.androidgamesdk.",
                      "com.microsoft.applications.events.",
                      "com.microsoft.playfab.",
                      "com.microsoft.xal.",
                      "com.microsoft.xbox.",
                      "com.microsoft.xboxtcui.",
                      "com.xbox.httpclient.",
                      "org.fmod."
              };

              private static volatile ClassLoader gameLoader;
              private static final Set<String> REPORTED_NAMES = Collections.synchronizedSet(new HashSet<String>());

              private static volatile String factoryHook = "not attempted";
              private static volatile String routerHook = "not attempted";
              private static volatile int routerRequests = 0;
              private static volatile int factoryAllCalls = 0;
              private static volatile int factoryRequests = 0;
              private static volatile String factoryResult = "factory never asked for MinecraftActivity";
              private static volatile String factoryLastNames = "";
              private static volatile String factoryLastLoader = "none";
              private static volatile String libraryResolutionSummary = "not probed";

              private GameClassLoaderBridge() {
              }

              private static void trace(String line) {
                  try {
                      Log.w(TAG, line);
                      GameDiagnostics.line("[bridge] " + line);
                  } catch (Throwable ignored) {
                  }
              }

              private static String callerStack() {
                  try {
                      String text = GameDiagnostics.stackToString(new Throwable("class load requested here"));
                      return text.length() > 3500 ? text.substring(0, 3500) : text;
                  } catch (Throwable ignored) {
                      return "(stack unavailable)";
                  }
              }

              static void noteRequest(String name, boolean launcherHasIt) {
                  try {
                      if (launcherHasIt) return;
                      if (!REPORTED_NAMES.add(name)) return;
                      boolean pairip = name.startsWith("com.pairip.") || name.toLowerCase(java.util.Locale.US).contains("licens");
                      if (pairip) {
                          trace("MINECRAFT-OWN class (PairIP/license related): " + name + "\n" + callerStack());
                      } else {
                          trace("MINECRAFT-OWN class: " + name);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              static void noteRouted() {
                  routerRequests++;
              }

              public static void noteFactoryCall(String className, ClassLoader loader) {
                  factoryAllCalls++;
                  String names = factoryLastNames + " " + className.substring(className.lastIndexOf('.') + 1);
                  factoryLastNames = names.length() > 160 ? names.substring(names.length() - 160) : names;
                  factoryLastLoader = loaderLabel(loader, GameClassLoaderBridge.class.getClassLoader());
              }

              public static boolean isGameClass(String name) {
                  if (name.equals(ACTIVITY_CLASS) || name.equals(GMS_NATIVE_LISTENER)) return true;
                  if (name.startsWith(ACTIVITY_CLASS + "$")) return true;
                  for (String prefix : GAME_PACKAGES) {
                      if (name.startsWith(prefix)) return true;
                  }
                  return false;
              }

              public static synchronized ClassLoader obtainGameLoader(Context context) {
                  ClassLoader existing = gameLoader;
                  if (existing != null) return existing;
                  ClassLoader launcherLoader = GameClassLoaderBridge.class.getClassLoader();
                  if (launcherLoader == null) throw new UnsatisfiedLinkError("Launcher ClassLoader is unavailable");
                  GameDiagnostics.ensureStarted(context);
                  GameDiagnostics.event("bridge-install-begin",
                          "creating the dedicated game loader; launcherLoader=" + GameDiagnostics.loaderId(launcherLoader)
                                  + " thread=" + Thread.currentThread().getName());
                  try {
                      ApplicationInfo launcherInfo = context.getApplicationInfo();
                      ApplicationInfo minecraft = context.getPackageManager().getApplicationInfo(MINECRAFT_PACKAGE, 0);
                      String launcherApk = launcherInfo.sourceDir;
                      List<String> codePaths = new ArrayList<String>();
                      codePaths.add(launcherApk);
                      codePaths.addAll(minecraftCodeApks(minecraft));

                      Set<String> libraryDirsSet = new LinkedHashSet<String>();
                      if (launcherInfo.nativeLibraryDir != null) {
                          libraryDirsSet.add(launcherInfo.nativeLibraryDir);
                      }
                      if (minecraft.nativeLibraryDir != null) {
                          libraryDirsSet.add(minecraft.nativeLibraryDir);
                      }
                      collectLibraryDirs(new File(context.getFilesDir(), "minecraft_libs"), 0, libraryDirsSet);
                      collectLibraryDirs(context.getFilesDir(), 0, libraryDirsSet);

                      harvestExistingNativeDirs(launcherLoader, libraryDirsSet);

                      List<String> libraryDirs = new ArrayList<String>(libraryDirsSet);
                      trace("game loader code paths: " + codePaths);
                      trace("game loader native library dirs: " + libraryDirs);

                      ClassLoader loader = new PathClassLoader(
                              join(codePaths), join(libraryDirs), new LauncherDelegatingParent(launcherLoader));
                      detachLauncherResources(loader, launcherApk);
                      reportPreloadedGameClasses(loader);
                      probeLibraryResolution(loader);

                      GameDiagnostics.section("GAME LOADER CREATED",
                              GameDiagnostics.loaderReport("launcher (app) loader", launcherLoader)
                                      + GameDiagnostics.loaderReport("dedicated game loader", loader)
                                      + "libraryResolutionProbe:\n" + libraryResolutionSummary + "\n");
                      describePairIp(loader, dexElementsOf(loader));

                      Class<?> activityClass = loader.loadClass(ACTIVITY_CLASS);
                      Class<?> gameActivityClass = loader.loadClass("com.google.androidgamesdk.GameActivity");
                      if (activityClass.getClassLoader() != loader) {
                          throw new IllegalStateException("MinecraftActivity is not defined by the game loader");
                      }
                      if (gameActivityClass.getClassLoader() != loader) {
                          throw new IllegalStateException("GameActivity is not defined by the game loader");
                      }
                      if (!gameActivityClass.isAssignableFrom(activityClass)) {
                          throw new IllegalStateException("MinecraftActivity does not extend the game-loader GameActivity");
                      }
                      ensureLauncherCopy(loader, launcherLoader, "com.mojang.minecraftpe.MainActivity");
                      ensureLauncherCopy(loader, launcherLoader, "com.google.androidgamesdk.GameActivity");

                      gameLoader = loader;
                      hookActivityCreation(context, loader);
                      GameDiagnostics.event("bridge-installed",
                              "game classes and game libraries use " + GameDiagnostics.loaderId(loader)
                                      + " | libs=" + libraryResolutionSummary.replace('\n', ';'));
                      return loader;
                  } catch (Throwable t) {
                      Log.e(TAG, "Failed to create the game class loader", t);
                      String reason = t.getMessage() != null ? t.getMessage() : t.getClass().getSimpleName();
                      UnsatisfiedLinkError error = new UnsatisfiedLinkError("Game class-loader bridge failed: " + reason);
                      error.initCause(t);
                      throw error;
                  }
              }

              private static void harvestExistingNativeDirs(ClassLoader cl, Set<String> into) {
                  try {
                      if (!(cl instanceof BaseDexClassLoader)) return;
                      Field pathListField = BaseDexClassLoader.class.getDeclaredField("pathList");
                      pathListField.setAccessible(true);
                      Object pathList = pathListField.get(cl);
                      if (pathList == null) return;
                      Field nativeDirsField = pathList.getClass().getDeclaredField("nativeLibraryDirectories");
                      nativeDirsField.setAccessible(true);
                      Object dirsObj = nativeDirsField.get(pathList);
                      if (dirsObj instanceof List) {
                          for (Object item : (List<?>) dirsObj) {
                              if (item instanceof File) {
                                  File f = (File) item;
                                  if (f.isDirectory()) into.add(f.getAbsolutePath());
                              }
                          }
                      } else if (dirsObj instanceof File[]) {
                          for (File f : (File[]) dirsObj) {
                              if (f != null && f.isDirectory()) into.add(f.getAbsolutePath());
                          }
                      }
                  } catch (Throwable t) {
                      trace("harvestExistingNativeDirs note: " + t);
                  }
              }

              private static void probeLibraryResolution(ClassLoader loader) {
                  String[] libs = {
                          "preloader",
                          "minecraftpe",
                          "pairipcore",
                          "c++_shared",
                          "PlayFabMultiplayer",
                          "maesdk",
                          "fmod",
                          "HttpClient.Android",
                          "gxcore",
                          "leviworld"
                  };
                  StringBuilder sb = new StringBuilder();
                  if (loader instanceof BaseDexClassLoader) {
                      BaseDexClassLoader bdcl = (BaseDexClassLoader) loader;
                      for (String lib : libs) {
                          String resolved;
                          try {
                              resolved = bdcl.findLibrary(lib);
                          } catch (Throwable t) {
                              resolved = "ERR:" + t;
                          }
                          sb.append("  findLibrary(").append(lib).append(") -> ").append(resolved != null ? resolved : "NOT_FOUND").append('\n');
                      }
                  }
                  libraryResolutionSummary = sb.toString().trim();
                  trace("GameLoader findLibrary audit:\n" + libraryResolutionSummary);
              }

              public static void initializePairIp(Context context) {
                  ClassLoader loader = obtainGameLoader(context);
                  GameDiagnostics.event("pairip", "initialising com.pairip.VMRunner in the game loader");
                  try {
                      Class.forName("com.pairip.VMRunner", true, loader);
                      GameDiagnostics.event("pairip", "com.pairip.VMRunner initialised");
                  } catch (Throwable t) {
                      trace("PairIP initialisation failed: " + GameDiagnostics.stackToString(t));
                      String reason = t.getMessage() != null ? t.getMessage() : t.getClass().getSimpleName();
                      UnsatisfiedLinkError error = new UnsatisfiedLinkError(
                              "Cannot initialize official PairIP using the game class loader: " + reason);
                      error.initCause(t);
                      throw error;
                  }
              }

              private static String join(List<String> parts) {
                  StringBuilder sb = new StringBuilder();
                  for (String part : parts) {
                      if (sb.length() > 0) sb.append(File.pathSeparatorChar);
                      sb.append(part);
                  }
                  return sb.toString();
              }

              private static List<String> minecraftCodeApks(ApplicationInfo info) {
                  List<String> all = new ArrayList<String>();
                  all.add(info.sourceDir);
                  if (info.splitSourceDirs != null) {
                      for (String split : info.splitSourceDirs) all.add(split);
                  }
                  List<String> withCode = new ArrayList<String>();
                  for (String apk : all) {
                      ZipFile zip = null;
                      try {
                          zip = new ZipFile(apk);
                          if (zip.getEntry("classes.dex") != null) withCode.add(apk);
                      } catch (Throwable ignored) {
                      } finally {
                          if (zip != null) {
                              try {
                                  zip.close();
                              } catch (Throwable ignored) {
                              }
                          }
                      }
                  }
                  if (withCode.isEmpty()) withCode.add(info.sourceDir);
                  return withCode;
              }

              private static void collectLibraryDirs(File dir, int depth, Set<String> into) {
                  if (depth > 6 || dir == null || !dir.isDirectory()) return;
                  File[] children = dir.listFiles();
                  if (children == null) return;
                  boolean hasLibrary = false;
                  for (File child : children) {
                      if (child.isFile() && child.getName().endsWith(".so")) hasLibrary = true;
                  }
                  if (hasLibrary) into.add(dir.getAbsolutePath());
                  for (File child : children) {
                      if (child.isDirectory()) collectLibraryDirs(child, depth + 1, into);
                  }
              }

              private static Object[] dexElementsOf(ClassLoader loader) throws Exception {
                  Class<?> baseDexLoader = Class.forName("dalvik.system.BaseDexClassLoader");
                  Field pathListField = baseDexLoader.getDeclaredField("pathList");
                  pathListField.setAccessible(true);
                  Object pathList = pathListField.get(loader);
                  if (pathList == null) throw new IllegalStateException("Loader has no pathList");
                  Field elementsField = pathList.getClass().getDeclaredField("dexElements");
                  elementsField.setAccessible(true);
                  return (Object[]) elementsField.get(pathList);
              }

              private static void detachLauncherResources(ClassLoader loader, String launcherApk) {
                  try {
                      int detached = 0;
                      for (Object element : dexElementsOf(loader)) {
                          if (element == null) continue;
                          Field pathField = element.getClass().getDeclaredField("path");
                          pathField.setAccessible(true);
                          Object current = pathField.get(element);
                          if (current != null && launcherApk.equals(current.toString())) {
                              pathField.set(element, null);
                              detached++;
                          }
                      }
                      trace("Detached resource lookup from " + detached + " launcher dex element(s)");
                  } catch (Throwable t) {
                      trace("WARNING: could not detach launcher resources: " + t);
                  }
              }

              private static void reportPreloadedGameClasses(ClassLoader loader) {
                  try {
                      Method find = ClassLoader.class.getDeclaredMethod("findLoadedClass", String.class);
                      find.setAccessible(true);
                      String[] names = {
                              "com.mojang.minecraftpe.MainActivity",
                              "com.google.androidgamesdk.GameActivity",
                              "androidx.fragment.app.FragmentActivity",
                              "androidx.activity.ComponentActivity",
                              ACTIVITY_CLASS
                      };
                      List<String> already = new ArrayList<String>();
                      for (String name : names) {
                          if (find.invoke(loader, name) != null) already.add(name);
                      }
                      trace("Classes already defined by the game loader before the bridge: "
                              + (already.isEmpty() ? "none" : already.toString()));
                  } catch (Throwable t) {
                      trace("findLoadedClass probe failed: " + t);
                  }
              }

              private static void ensureLauncherCopy(ClassLoader gameClassLoader, ClassLoader launcherLoader, String name) {
                  String detail;
                  boolean mismatch;
                  try {
                      Class<?> mine = Class.forName(name, false, gameClassLoader);
                      Class<?> launchers = Class.forName(name, false, launcherLoader);
                      int mineMethods = mine.getDeclaredMethods().length;
                      int launcherMethods = launchers.getDeclaredMethods().length;
                      int mineFields = mine.getDeclaredFields().length;
                      int launcherFields = launchers.getDeclaredFields().length;
                      detail = "methods " + mineMethods + "/" + launcherMethods + " fields " + mineFields + "/" + launcherFields;
                      mismatch = mineMethods != launcherMethods || mineFields != launcherFields;
                      trace("Copy check for " + name + ": " + detail + (mismatch ? "  <-- MINECRAFT'S OWN COPY" : "  (launcher copy)"));
                      trace("  game-loader copy    : " + GameDiagnostics.describeClass(mine));
                      trace("  launcher-loader copy: " + GameDiagnostics.describeClass(launchers));
                  } catch (Throwable t) {
                      trace("Could not compare " + name + " copies: " + t);
                      return;
                  }
                  if (mismatch) {
                      throw new IllegalStateException("The game loader defined Minecraft's own " + name
                              + " instead of the launcher copy (" + detail + ")");
                  }
              }

              private static void describePairIp(ClassLoader loader, Object[] elements) {
                  try {
                      List<String> names = new ArrayList<String>();
                      for (Object element : elements) {
                          if (element == null) continue;
                          try {
                              Field dexFileField = element.getClass().getDeclaredField("dexFile");
                              dexFileField.setAccessible(true);
                              Object dexFile = dexFileField.get(element);
                              if (!(dexFile instanceof DexFile)) continue;
                              Enumeration<String> entries = ((DexFile) dexFile).entries();
                              while (entries.hasMoreElements()) {
                                  String name = entries.nextElement();
                                  if (name.startsWith("com.pairip.")) names.add(name);
                              }
                          } catch (Throwable ignored) {
                          }
                      }
                      Collections.sort(names);
                      StringBuilder sb = new StringBuilder("Minecraft dex contains " + names.size() + " com.pairip.* class(es):\n");
                      for (String n : names) sb.append(n).append('\n');
                      trace(sb.toString());
                  } catch (Throwable t) {
                      trace("Could not enumerate com.pairip.* classes: " + t);
                  }
                  try {
                      Class<?> runner = Class.forName("com.pairip.VMRunner", false, loader);
                      StringBuilder sb = new StringBuilder("com.pairip.VMRunner members (loader=" + runner.getClassLoader() + "):\n");
                      for (Field f : runner.getDeclaredFields()) {
                          sb.append("  field ").append(f.getType().getName()).append(' ').append(f.getName())
                                  .append(" mods=").append(f.getModifiers()).append('\n');
                      }
                      for (Method m : runner.getDeclaredMethods()) {
                          sb.append("  method ").append(m.getReturnType().getName()).append(' ').append(m.getName()).append('(');
                          Class<?>[] params = m.getParameterTypes();
                          for (int i = 0; i < params.length; i++) {
                              if (i > 0) sb.append(',');
                              sb.append(params[i].getName());
                          }
                          sb.append(") mods=").append(m.getModifiers()).append('\n');
                      }
                      trace(sb.toString());
                  } catch (Throwable t) {
                      trace("Could not describe com.pairip.VMRunner: " + t);
                  }
              }

              private static String loaderLabel(ClassLoader loader, ClassLoader launcher) {
                  if (loader == null) return "boot";
                  if (loader == gameLoader) return "GAME-LOADER";
                  if (loader == launcher) return "LAUNCHER-LOADER";
                  return loader.getClass().getSimpleName() + "@" + Integer.toHexString(System.identityHashCode(loader));
              }

              public static String describeActivity(Object activity) {
                  try {
                      ClassLoader launcher = GameClassLoaderBridge.class.getClassLoader();
                      StringBuilder sb = new StringBuilder();
                      sb.append("diagnosticsFile=").append(GameDiagnostics.path());
                      sb.append(" gameLoaderCreated=").append(gameLoader != null);
                      sb.append(" factoryHook=").append(factoryHook);
                      sb.append(" routerHook=").append(routerHook);
                      sb.append(" routerRequests=").append(routerRequests);
                      sb.append(" factoryAllCalls=").append(factoryAllCalls);
                      sb.append(" factoryLast=[").append(factoryLastNames.trim()).append("] factoryLoader=").append(factoryLastLoader);
                      sb.append(" factoryRequests=").append(factoryRequests);
                      sb.append(" factoryResult=").append(factoryResult);
                      sb.append(" activityChain=");
                      Class<?> current = activity.getClass();
                      int depth = 0;
                      while (current != null && depth < 6) {
                          sb.append(current.getSimpleName()).append(':').append(loaderLabel(current.getClassLoader(), launcher)).append(' ');
                          current = current.getSuperclass();
                          depth++;
                      }
                      ClassLoader installed = gameLoader;
                      if (installed != null) {
                          try {
                              Class<?> ga = Class.forName("com.google.androidgamesdk.GameActivity", false, installed);
                              sb.append("gameLoaderGameActivity=").append(loaderLabel(ga.getClassLoader(), launcher));
                          } catch (Throwable t) {
                              sb.append("gameLoaderGameActivity=ERR:").append(t.getClass().getSimpleName());
                          }
                          if (installed instanceof BaseDexClassLoader) {
                              String preloaderPath = ((BaseDexClassLoader) installed).findLibrary("preloader");
                              String mcpePath = ((BaseDexClassLoader) installed).findLibrary("minecraftpe");
                              sb.append(" findLib(preloader)=").append(preloaderPath);
                              sb.append(" findLib(minecraftpe)=").append(mcpePath);
