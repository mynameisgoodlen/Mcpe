                  candidates.add(new File(ctx.getFilesDir(), FILE_NAME));
                  for (File candidate : candidates) {
                      try {
                          trimIfHuge(candidate);
                          FileOutputStream stream = new FileOutputStream(candidate, true);
                          logFile = candidate;
                          out = stream;
                          return;
