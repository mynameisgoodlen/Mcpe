              private static void sampleThreads() {
                  Map<Thread, StackTraceElement[]> all = Thread.getAllStackTraces();
                  for (Map.Entry<Thread, StackTraceElement[]> e : all.entrySet()) {
                      Thread th = e.getKey();
                      StackTraceElement[] st = e.getValue();
                      String name = th.getName();
                      if (st == null || st.length == 0 || skipThread(name)) continue;
                      if (isIdleTop(st[0]) && !name.startsWith("pool-")) continue;
                      String text = stackText(st, 26);
                      String key = name + "|" + text.hashCode();
                      if (!WATCH_SEEN.add(key)) continue;
                      if (watchBytes > WATCH_CAP) continue;
                      watchBytes += text.length() + 64;
                      write(stamp() + " TH \"" + name + "\" state=" + th.getState() + "\n" + text, false);
                  }
              }

              private static String readText(String path, int maxBytes) {
                  FileInputStream in = null;
                  try {
                      in = new FileInputStream(path);
                      byte[] buf = new byte[maxBytes];
                      int n = in.read(buf);
                      return n <= 0 ? "" : new String(buf, 0, n, "UTF-8");
                  } catch (Throwable t) {
                      return "";
                  } finally {
                      if (in != null) {
                          try {
                              in.close();
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
