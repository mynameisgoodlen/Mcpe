name: LeviLauncher ARMv7 runtime compatibility (fixed SDK setup)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@v4

      - name: Check out pinned LeviLaunchroid source and native submodules
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLaunchroid
          ref: cc5c7bc6eac48f1e82adf705b8b5f63ba0883247
          path: source
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      # setup-android@v3 defaults to "tools platform-tools". The legacy
      # "tools" package no longer exists, so explicitly override that default.
      - name: Set up Android SDK (no obsolete tools package)
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools, exact NDK, and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Verify upstream runtime and configure ARMv7 build
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Verify package-context and split-APK runtime management.
          manager = Path("app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt")
          runtime = Path("app/src/main/java/org/levimc/launcher/core/minecraft/MinecraftRuntimePreparer.kt")
          manager_text = manager.read_text(encoding="utf-8")
          runtime_text = runtime.read_text(encoding="utf-8")
          required = (
              "createPackageContext(",
              "Context.CONTEXT_INCLUDE_CODE",
              "splitPublicSourceDirs",
              "splitSourceDirs",
              "System.load(libFile.absolutePath)",
          )
          missing = [token for token in required if token not in manager_text]
          if missing:
              raise SystemExit("Upstream runtime changed; missing: " + ", ".join(missing))
          if "MC_SPLIT_SRC" not in runtime_text:
              raise SystemExit("Split-APK handoff missing; refusing incomplete build.")

          # Verify ARMv7 preloader support and its matching static hook archive.
          preloader_cmake = Path("app/src/main/cpp/preloader/CMakeLists.txt")
          hook_archive = Path("app/src/main/cpp/preloader/lib/ARM/libGlossHook.a")
          if not preloader_cmake.is_file() or not hook_archive.is_file():
              raise SystemExit("ARMv7 preloader source/archive is missing.")
          cmake_text = preloader_cmake.read_text(encoding="utf-8")
          if 'CMAKE_ANDROID_ARCH_ABI STREQUAL "armeabi-v7a"' not in cmake_text:
              raise SystemExit("Preloader CMake no longer declares ARMv7 support.")

          # Change only the application ABI filter.
          gradle = Path("app/build.gradle")
          gradle_text = gradle.read_text(encoding="utf-8")
          old_abi = "abiFilters 'arm64-v8a'"
          if gradle_text.count(old_abi) != 1:
              raise SystemExit(f"Expected one {old_abi!r}; found {gradle_text.count(old_abi)}.")
          gradle_text = gradle_text.replace(old_abi, "abiFilters 'armeabi-v7a'", 1)
          gradle_text = gradle_text.replace("mappingFileUploadEnabled true",
                                            "mappingFileUploadEnabled false")
          gradle_text = gradle_text.replace("nativeSymbolUploadEnabled true",
                                            "nativeSymbolUploadEnabled false")
          gradle.write_text(gradle_text, encoding="utf-8")

          # LevelDB's desktop CLI is not used by the Android application.
          leveldb = Path("app/src/main/cpp/worldtools/vendor/leveldb/CMakeLists.txt")
          cm = leveldb.read_text(encoding="utf-8")
          old_block = '''add_executable(leveldbutil
            "db/leveldbutil.cc"
          )
          target_link_libraries(leveldbutil leveldb)'''
          new_block = '''# Desktop-only command line utility; exclude from Android builds.
          if(NOT ANDROID)
            add_executable(leveldbutil
              "db/leveldbutil.cc"
            )
            target_link_libraries(leveldbutil leveldb)
          endif()'''
          if old_block in cm:
              leveldb.write_text(cm.replace(old_block, new_block, 1), encoding="utf-8")
          elif "if(NOT ANDROID)" not in cm or "add_executable(leveldbutil" not in cm:
              raise SystemExit("LevelDB utility target changed; refusing a guessed patch.")

          # Use width-correct FNV-1a constants on 32-bit ARM.
          hash_file = Path("app/src/main/cpp/worldtools/vendor/nbt/src/nbt/detail/StringUtils.hpp")
          hs = hash_file.read_text(encoding="utf-8")
          old_hash = '''[[nodiscard]] constexpr size_t doHash(std::string_view x) {
              size_t           hash  = 0xcbf29ce484222325;
              constexpr size_t prime = 0x100000001b3;
              for (char c : x) {
                  hash ^= static_cast<size_t>(c);
                  hash *= prime;
              }
              return hash;
          }'''
          new_hash = '''[[nodiscard]] constexpr size_t doHash(std::string_view x) {
              if constexpr (sizeof(size_t) <= sizeof(uint32_t)) {
                  uint32_t hash = 0x811c9dc5u;
                  constexpr uint32_t prime = 0x01000193u;
                  for (char c : x) {
                      hash ^= static_cast<uint32_t>(static_cast<unsigned char>(c));
                      hash *= prime;
                  }
                  return static_cast<size_t>(hash);
              } else {
                  uint64_t hash = 0xcbf29ce484222325ULL;
                  constexpr uint64_t prime = 0x100000001b3ULL;
                  for (char c : x) {
                      hash ^= static_cast<uint64_t>(static_cast<unsigned char>(c));
                      hash *= prime;
                  }
                  return static_cast<size_t>(hash);
              }
          }'''
          if old_hash in hs:
              hs = hs.replace(old_hash, new_hash, 1)
              if "#include <cstdint>" not in hs:
                  hs = hs.replace("#include <string>", "#include <cstdint>\n#include <string>", 1)
              hash_file.write_text(hs, encoding="utf-8")
          elif "sizeof(size_t) <= sizeof(uint32_t)" not in hs:
              raise SystemExit("NBT doHash changed; refusing a guessed ARMv7 patch.")

          print("Package-context and split-APK runtime checks passed.")
          print("ARMv7 preloader archive verified.")
          print("Application ABI configured as armeabi-v7a.")
          print("Android-only source compatibility patches applied.")
          PY

          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {"package_name": "org.levimc.launcher"}
                },
                "oauth_client": [],
                "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          chmod +x ./gradlew

      - name: Build ARMv7 debug APK
        id: build
        working-directory: source
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/levilauncher-armv7-gradle.log"
          ./gradlew --no-daemon --stacktrace --info --console=plain :app:assembleDebug 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          exit "$rc"

      - name: Verify APK ABI and required ARMv7 runtime libraries
        if: success()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          REPORT="$RUNNER_TEMP/armv7-runtime-preflight.txt"
          BADGING="$RUNNER_TEMP/badging.txt"
          LIBS="$RUNNER_TEMP/armv7-libs.txt"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$BADGING"
          grep -q "native-code: 'armeabi-v7a'" "$BADGING"

          unzip -Z1 "$APK" | grep '^lib/armeabi-v7a/' | sort > "$LIBS"
          grep -q '^lib/armeabi-v7a/libpreloader.so$' "$LIBS"

          missing=()
          for lib in libgxcore.so libPlayFabMultiplayer.so libmaesdk.so; do
            if ! grep -q "^lib/armeabi-v7a/${lib}$" "$LIBS"; then
              missing+=("$lib")
            fi
          done

          if ((${#missing[@]})); then
            {
              echo "ARMv7 APK preflight blocked: required runtime libraries are absent."
              for lib in "${missing[@]}"; do echo " - $lib"; done
              echo "No APK artifact will be published until genuine ARMv7 builds"
              echo "or supported source builds for these components are available."
            } | tee "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if grep -q '^lib/armeabi-v7a/libpairipcore.so$' "$LIBS"; then
            echo "Unexpected separately bundled PairIP library; refusing artifact." | tee "$REPORT"
            exit 1
          fi

          echo "PASS: ABI and runtime library checks passed." | tee "$REPORT"
          cp "$APK" "$RUNNER_TEMP/LeviLauncher-ARMv7-runtime-compat-debug.apk"

      - name: Upload installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-runtime-compat-debug-APK
          path: ${{ runner.temp }}/LeviLauncher-ARMv7-runtime-compat-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-ARMv7-runtime-compat-diagnostics
          path: |
            ${{ runner.temp }}/levilauncher-armv7-gradle.log
            ${{ runner.temp }}/armv7-runtime-preflight.txt
            ${{ runner.temp }}/badging.txt
            ${{ runner.temp }}/armv7-libs.txt
          if-no-files-found: ignore
          retention-days: 7
