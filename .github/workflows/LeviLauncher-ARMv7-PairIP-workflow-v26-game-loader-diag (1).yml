                      raf.close();
                      FileOutputStream rewrite = new FileOutputStream(f, false);
                      rewrite.write("[older diagnostics trimmed to keep the file small]\n".getBytes("UTF-8"));
                      rewrite.write(tail);
                      rewrite.close();
