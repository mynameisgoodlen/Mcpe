name: Single-File ARMv7 Native Bootstrap Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-29 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/java/com/mclauncher/armv7

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MC-ARMv7-Bootstrap"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mclauncher.armv7'
              compileSdk 29

              defaultConfig {
                  applicationId "com.mclauncher.armv7"
                  minSdk 26
                  targetSdk 29
                  versionCode 2
                  versionName "2.0-armv7"

                  ndk {
                      abiFilters "armeabi-v7a"
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags "-std=c++17 -Wall -Wextra"
                          // CRITICAL FIX: Use c++_static so our APK does NOT bundle its own libc++_shared.so
                          // and collide with Minecraft's armeabi-v7a libc++_shared.so!
                          arguments "-DANDROID_ABI=armeabi-v7a",
                                    "-DANDROID_PLATFORM=android-29",
                                    "-DANDROID_STL=c++_static"
                      }
                  }
              }

              buildTypes {
                  debug {
                      debuggable true
                      jniDebuggable true
                  }
              }

              externalNativeBuild {
                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.22.1'
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mclauncher.armv7">

              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:extractNativeLibs="true"
                  android:hardwareAccelerated="true"
                  android:label="MC ARMv7 Bootstrap"
                  android:largeHeap="true">

                  <activity
                      android:name=".BootstrapActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("mc_bootstrap" LANGUAGES CXX)

          if(NOT ANDROID_ABI STREQUAL "armeabi-v7a")
              message(FATAL_ERROR "Strictly armeabi-v7a only. Current ABI: ${ANDROID_ABI}")
          endif()

          add_library(mc_bootstrap SHARED mc_bootstrap.cpp)

          find_library(log-lib log)
          find_library(android-lib android)
          find_library(dl-lib dl)
          find_library(egl-lib EGL)
          find_library(glesv2-lib GLESv2)

          target_link_libraries(mc_bootstrap
              ${log-lib}
              ${android-lib}
              ${dl-lib}
              ${egl-lib}
              ${glesv2-lib}
          )
          EOF

          cat << 'EOF' > app/src/main/cpp/mc_bootstrap.cpp
          #include <jni.h>
          #include <dlfcn.h>
          #include <android/log.h>
          #include <string>
          #include <vector>
          #include <sstream>
          #include <elf.h>
          #include <fcntl.h>
          #include <unistd.h>

          #define LOG_TAG "MC_ARMv7_Bootstrap"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          namespace {

          void AppendLog(std::ostringstream& oss, const std::string& msg) {
              LOGI("%s", msg.c_str());
              oss << msg << "\n";
          }

          void AppendErr(std::ostringstream& oss, const std::string& msg) {
              LOGE("%s", msg.c_str());
              oss << "[ERROR] " << msg << "\n";
          }

          bool VerifyElfArmv7(const std::string& path, std::ostringstream& log) {
              int fd = open(path.c_str(), O_RDONLY);
              if (fd < 0) {
                  AppendErr(log, "Cannot open file: " + path);
                  return false;
              }
              Elf32_Ehdr ehdr{};
              ssize_t bytes = read(fd, &ehdr, sizeof(ehdr));
              close(fd);
              if (bytes != sizeof(ehdr) ||
                  ehdr.e_ident[EI_MAG0] != ELFMAG0 ||
                  ehdr.e_ident[EI_MAG1] != ELFMAG1 ||
                  ehdr.e_ident[EI_MAG2] != ELFMAG2 ||
                  ehdr.e_ident[EI_MAG3] != ELFMAG3 ||
                  ehdr.e_ident[EI_CLASS] != ELFCLASS32 ||
                  ehdr.e_machine != EM_ARM) {
                  AppendErr(log, "Invalid 32-bit ARM ELF: " + path);
                  return false;
              }
              AppendLog(log, "[ELF OK] 32-bit EM_ARM verified: " + path);
              return true;
          }

          } // namespace

          JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM* /*vm*/, void* /*reserved*/) {
              LOGI("libmc_bootstrap.so (c++_static) initialized on 32-bit ARMv7");
              return JNI_VERSION_1_6;
          }

          extern "C"
          JNIEXPORT jstring JNICALL
          Java_com_mclauncher_armv7_BootstrapActivity_nativeInspectLoadedEngine(
                  JNIEnv* env,
                  jclass /*clazz*/,
                  jstring jNativeLibDir,
                  jboolean inspectEngineSymbols) {

              std::ostringstream report;
              const char* cLibDir = env->GetStringUTFChars(jNativeLibDir, nullptr);
              std::string libDir(cLibDir ? cLibDir : "");
              env->ReleaseStringUTFChars(jNativeLibDir, cLibDir);

              AppendLog(report, "=== Native Linker & Symbol Verification ===");

              std::string cppPath = libDir + "/libc++_shared.so";
              if (VerifyElfArmv7(cppPath, report)) {
                  void* cppHandle = dlopen(cppPath.c_str(), RTLD_NOLOAD | RTLD_NOW);
                  if (!cppHandle) {
                      cppHandle = dlopen(cppPath.c_str(), RTLD_NOW | RTLD_GLOBAL);
                  }
                  if (cppHandle) {
                      void* sstreamSym = dlsym(cppHandle, "_ZTVNSt6__ndk118basic_stringstreamIcNS_11char_traitsIcEENS_9allocatorIcEEEE");
                      AppendLog(report, std::string("Minecraft libc++_shared.so basic_stringstream vtable = ") +
                                (sstreamSym ? "FOUND (No STL collision!)" : "MISSING"));
                  }
              }

              if (!inspectEngineSymbols) {
                  return env->NewStringUTF(report.str().c_str());
              }

              std::string pairipPath = libDir + "/libpairipcore.so";
              void* pairipHandle = dlopen(pairipPath.c_str(), RTLD_NOLOAD | RTLD_NOW);
              if (pairipHandle) {
                  void* execSym = dlsym(pairipHandle, "ExecuteProgram");
                  AppendLog(report, std::string("libpairipcore.so::ExecuteProgram = ") + (execSym ? "FOUND" : "MISSING"));
              }

              std::string mcpePath = libDir + "/libminecraftpe.so";
              void* mcpeHandle = dlopen(mcpePath.c_str(), RTLD_NOLOAD | RTLD_NOW);
              if (mcpeHandle) {
                  void* jniOnLoadSym = dlsym(mcpeHandle, "JNI_OnLoad");
                  void* gameActInitSym = dlsym(mcpeHandle, "Java_com_google_androidgamesdk_GameActivity_initializeNativeCode");
                  void* gameActOnCreateSym = dlsym(mcpeHandle, "GameActivity_onCreate");
                  void* mainActResizeSym = dlsym(mcpeHandle, "Java_com_mojang_minecraftpe_MainActivity_nativeResize");

                  AppendLog(report, std::string("libminecraftpe.so::JNI_OnLoad = ") + (jniOnLoadSym ? "FOUND" : "MISSING"));
                  AppendLog(report, std::string("GameActivity_initializeNativeCode = ") + (gameActInitSym ? "FOUND" : "MISSING"));
                  AppendLog(report, std::string("GameActivity_onCreate = ") + (gameActOnCreateSym ? "FOUND" : "MISSING"));
                  AppendLog(report, std::string("MainActivity_nativeResize = ") + (mainActResizeSym ? "FOUND" : "MISSING"));
              } else {
                  AppendErr(report, "libminecraftpe.so handle not resident in linker table.");
              }

              return env->NewStringUTF(report.str().c_str());
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mclauncher/armv7/BootstrapActivity.java
          package com.mclauncher.armv7;

          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.res.AssetManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.Enumeration;
          import java.util.List;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;

          import dalvik.system.DexClassLoader;

          public class BootstrapActivity extends Activity {

              public static final String MC_PACKAGE = "com.mojang.minecraftpe";

              static {
                  System.loadLibrary("mc_bootstrap");
              }

              public static native String nativeInspectLoadedEngine(String nativeLibDir, boolean inspectEngineSymbols);

              private TextView logView;
              private PackageInspectionResult runtimeInfo;

              public static class PackageInspectionResult {
                  public boolean installed;
                  public String baseApkPath;
                  public final List<String> splitApkPaths = new ArrayList<>();
                  public String armv7SplitPath;
                  public String stagedLibDir;
                  public DexClassLoader bridgedClassLoader;
                  public Context mcPackageContext;
                  public String diagnosticLog;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.parseColor("#121212"));
                  int pad = (int) (10 * getResources().getDisplayMetrics().density);
                  root.setPadding(pad, pad, pad, pad);

                  LinearLayout buttonRow = new LinearLayout(this);
                  buttonRow.setOrientation(LinearLayout.HORIZONTAL);
                  buttonRow.setGravity(Gravity.CENTER_VERTICAL);

                  Button btnSafeStage = new Button(this);
                  btnSafeStage.setText("1. Load Base ARMv7 Libs");

                  Button btnFullStage = new Button(this);
                  btnFullStage.setText("2. Load Full Engine + PairIP + MCPE");

                  buttonRow.addView(btnSafeStage, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  buttonRow.addView(btnFullStage, new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  ScrollView scroll = new ScrollView(this);
                  logView = new TextView(this);
                  logView.setTextColor(Color.parseColor("#00E676"));
                  logView.setTypeface(Typeface.MONOSPACE);
                  logView.setTextSize(11.5f);
                  scroll.addView(logView);

                  root.addView(buttonRow, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);

                  appendLog("Preparing installed com.mojang.minecraftpe split APKs (async)...");
                  new Thread(() -> {
                      PackageInspectionResult info = prepareInstalledRuntime(getApplicationContext());
                      runOnUiThread(() -> {
                          runtimeInfo = info;
                          logView.setText(info.diagnosticLog);
                      });
                  }).start();

                  btnSafeStage.setOnClickListener(v -> runBootstrap(false));
                  btnFullStage.setOnClickListener(v -> runBootstrap(true));
              }

              private void runBootstrap(boolean includeFullEngine) {
                  if (runtimeInfo == null || !runtimeInfo.installed || runtimeInfo.stagedLibDir == null) {
                      appendLog("\n[ABORT] Runtime is not ready.");
                      return;
                  }
                  appendLog("\n=== Starting Namespace-Isolated ARMv7 Bootstrap (fullEngine=" + includeFullEngine + ") ===");
                  new Thread(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          String[] baseLibs = {
                              "c++_shared",
                              "fmod",
                              "HttpClient.Android",
                              "MediaDecoders_Android",
                              "conscrypt_jni"
                          };

                          for (String lib : baseLibs) {
                              loadIntoBridgedNamespace(runtimeInfo.bridgedClassLoader, lib, sb);
                          }

                          if (includeFullEngine) {
                              // Initialize FMOD Java Audio bridge with Minecraft context
                              try {
                                  Class<?> fmodClass = runtimeInfo.bridgedClassLoader.loadClass("org.fmod.FMOD");
                                  Method fmodInit = fmodClass.getDeclaredMethod("init", Context.class);
                                  fmodInit.setAccessible(true);
                                  fmodInit.invoke(null, runtimeInfo.mcPackageContext != null ? runtimeInfo.mcPackageContext : getApplicationContext());
                                  sb.append("[FMOD OK] org.fmod.FMOD.init(Context) succeeded.\n");
                              } catch (Throwable fmodErr) {
                                  sb.append("[WARN] FMOD.init warning: ").append(fmodErr.toString()).append("\n");
                              }

                              String[] engineLibs = {
                                  "pairipcore",
                                  "maesdk",
                                  "PlayFabMultiplayer",
                                  "minecraftpe"
                              };

                              for (String lib : engineLibs) {
                                  loadIntoBridgedNamespace(runtimeInfo.bridgedClassLoader, lib, sb);
                              }
                          }

                          String jniReport = nativeInspectLoadedEngine(runtimeInfo.stagedLibDir, includeFullEngine);
                          sb.append("\n").append(jniReport);

                      } catch (Throwable t) {
                          sb.append("\n[FATAL EXCEPTION] ").append(t.getClass().getName()).append(": ").append(t.getMessage()).append("\n");
                          if (t.getCause() != null) {
                              sb.append("Cause: ").append(t.getCause().toString()).append("\n");
                          }
                      }
                      final String out = sb.toString();
                      runOnUiThread(() -> appendLog(out));
                  }).start();
              }

              private void loadIntoBridgedNamespace(ClassLoader loader, String libShortName, StringBuilder sb) throws Exception {
                  String resolvedPath = null;
                  Method findLib = ClassLoader.class.getDeclaredMethod("findLibrary", String.class);
                  findLib.setAccessible(true);
                  resolvedPath = (String) findLib.invoke(loader, libShortName);

                  if (resolvedPath == null) {
                      resolvedPath = runtimeInfo.stagedLibDir + "/lib" + libShortName + ".so";
                  }

                  // Use Runtime.getRuntime().loadLibrary0(ClassLoader, String)
                  // so Android's linker loads the library inside the DexClassLoader's native namespace!
                  try {
                      Method loadLib0 = Runtime.class.getDeclaredMethod("loadLibrary0", ClassLoader.class, String.class);
                      loadLib0.setAccessible(true);
                      loadLib0.invoke(Runtime.getRuntime(), loader, libShortName);
                      sb.append("[NAMESPACE LOADED] lib").append(libShortName).append(".so (via ClassLoader namespace)\n");
                  } catch (NoSuchMethodException nsme) {
                      System.load(resolvedPath);
                      sb.append("[SYSTEM LOADED] ").append(resolvedPath).append("\n");
                  }
              }

              private void appendLog(String text) {
                  logView.append(text + "\n");
              }

              public static PackageInspectionResult prepareInstalledRuntime(Context hostContext) {
                  PackageInspectionResult res = new PackageInspectionResult();
                  StringBuilder log = new StringBuilder();

                  log.append("=== Device & ABI Inspection ===\n");
                  log.append("Model: ").append(Build.MODEL).append(" (API ").append(Build.VERSION.SDK_INT).append(")\n");
                  log.append("Supported ABIs: ").append(String.join(", ", Build.SUPPORTED_ABIS)).append("\n\n");

                  try {
                      PackageManager pm = hostContext.getPackageManager();
                      PackageInfo pkgInfo = pm.getPackageInfo(MC_PACKAGE, 0);
                      ApplicationInfo appInfo = pkgInfo.applicationInfo;

                      res.installed = true;
                      res.baseApkPath = appInfo.publicSourceDir;
                      log.append("=== Official Minecraft Installation Found ===\n");
                      log.append("Version: ").append(pkgInfo.versionName)
                         .append(" (").append(pkgInfo.getLongVersionCode()).append(")\n");
                      log.append("Base APK: ").append(res.baseApkPath).append("\n");

                      if (appInfo.splitPublicSourceDirs != null) {
                          for (String split : appInfo.splitPublicSourceDirs) {
                              res.splitApkPaths.add(split);
                              log.append("Split APK: ").append(split).append("\n");
                              if (split.contains("armeabi_v7a") || split.contains("arm")) {
                                  res.armv7SplitPath = split;
                              }
                          }
                      }

                      // Create package context for com.mojang.minecraftpe so AssetManager has base.apk + splits
                      try {
                          res.mcPackageContext = hostContext.createPackageContext(
                                  MC_PACKAGE, Context.CONTEXT_INCLUDE_CODE | Context.CONTEXT_IGNORE_SECURITY);
                          AssetManager mcAssets = res.mcPackageContext.getAssets();
                          String[] rootAssetList = mcAssets.list("");
                          log.append("[ASSETS OK] Mounted com.mojang.minecraftpe AssetManager (")
                             .append(rootAssetList != null ? rootAssetList.length : 0).append(" root entries).\n");
                      } catch (Throwable ctxErr) {
                          log.append("[WARN] createPackageContext note: ").append(ctxErr.toString()).append("\n");
                      }

                      String sourceApkForLibs = (res.armv7SplitPath != null) ? res.armv7SplitPath : res.baseApkPath;
                      File stageDir = new File(hostContext.getFilesDir(), "mc_armv7_libs");
                      if (!stageDir.exists()) {
                          stageDir.mkdirs();
                      }

                      int extractedCount = extractArmv7Libs(sourceApkForLibs, stageDir, log);
                      res.stagedLibDir = stageDir.getAbsolutePath();
                      log.append("Staged ").append(extractedCount).append(" armeabi-v7a libraries to: ")
                         .append(res.stagedLibDir).append("\n");

                      File optimizedDir = hostContext.getCodeCacheDir();
                      res.bridgedClassLoader = new DexClassLoader(
                              res.baseApkPath,
                              optimizedDir.getAbsolutePath(),
                              res.stagedLibDir,
                              hostContext.getClassLoader()
                      );

                      Class<?> gameActivityClass = res.bridgedClassLoader.loadClass("com.google.androidgamesdk.GameActivity");
                      Class<?> mainActivityClass = res.bridgedClassLoader.loadClass("com.mojang.minecraftpe.MainActivity");
                      Class<?> fmodClass = res.bridgedClassLoader.loadClass("org.fmod.FMOD");
                      log.append("[DEX OK] Loaded GameActivity: ").append(gameActivityClass.getName()).append("\n");
                      log.append("[DEX OK] Loaded MainActivity: ").append(mainActivityClass.getName()).append("\n");
                      log.append("[DEX OK] Loaded FMOD: ").append(fmodClass.getName()).append("\n");

                  } catch (PackageManager.NameNotFoundException e) {
                      res.installed = false;
                      log.append("[ERROR] Package ").append(MC_PACKAGE).append(" is not installed on this device.\n");
                  } catch (Throwable t) {
                      log.append("[ERROR] Exception during runtime preparation: ").append(t.toString()).append("\n");
                  }

                  res.diagnosticLog = log.toString();
                  return res;
              }

              private static int extractArmv7Libs(String apkPath, File destDir, StringBuilder log) {
                  int count = 0;
                  try (ZipFile zip = new ZipFile(apkPath)) {
                      Enumeration<? extends ZipEntry> entries = zip.entries();
                      byte[] buffer = new byte[65536];
                      while (entries.hasMoreElements()) {
                          ZipEntry entry = entries.nextElement();
                          String name = entry.getName();
                          if (name.startsWith("lib/armeabi-v7a/") && name.endsWith(".so")) {
                              String fileName = name.substring("lib/armeabi-v7a/".length());
                              File outFile = new File(destDir, fileName);
                              if (!outFile.exists() || outFile.length() != entry.getSize()) {
                                  if (outFile.exists()) {
                                      outFile.setWritable(true);
                                  }
                                  try (InputStream is = zip.getInputStream(entry);
                                       FileOutputStream fos = new FileOutputStream(outFile)) {
                                      int read;
                                      while ((read = is.read(buffer)) != -1) {
                                          fos.write(buffer, 0, read);
                                      }
                                  }
                                  outFile.setReadOnly();
                              }
                              count++;
                          }
                      }
                  } catch (Exception e) {
                      log.append("[WARN] Failed scanning ").append(apkPath).append(": ").append(e.getMessage()).append("\n");
                  }
                  return count;
              }
          }
          EOF

      - name: Build Debug APK (armeabi-v7a only)
        run: |
          gradle assembleDebug --no-daemon

      - name: Verify APK ABI Contents (Ensure 32-bit ARMv7 Only & No Bundled libc++_shared.so)
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/"
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/arm64-v8a/"; then
            echo "ERROR: arm64-v8a libraries detected!"
            exit 1
          fi
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "libc++_shared.so"; then
            echo "ERROR: Bundled libc++_shared.so detected! Must use c++_static."
            exit 1
          fi

      - name: Upload ARMv7 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-armv7-bootstrap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
